          maximum_likelihood:
            max_iterations: 50
            tolerance: 1e-20
          method: jinc
          pixel_axes: altaz
          pixel_size_arcsec: 1.0
          tan_dec: 0
          tan_ra: 0
          x_size_pix: 0
          y_size_pix: 0
