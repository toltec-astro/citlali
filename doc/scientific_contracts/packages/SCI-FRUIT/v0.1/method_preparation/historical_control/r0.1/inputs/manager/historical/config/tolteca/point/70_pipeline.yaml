          fitter:
            modelspec: gainlintrend
            weight_window:
              fwhm_Hz: 1.5e4
              type: lorentz
          solver:
            extra_output: false
            fitreportdir: ../data
            parallel_policy: seq
        mapmaking:
          coverage_cut: 0.1
          crpix1: 0
          crpix2: 0
          crval1_J2000: 0
          crval2_J2000: 0
          cunit: mJy/beam
          enabled: true
          grouping: auto
          jinc_filter:
