derived_probes:
  method: >-
    Direct double-precision evaluation of the exact source formulas using the
    project Python environment. These probes are derived evidence, not a
    compiled-source or Unity claim.
  results:
    - id: SCI-AST-001-P001
      claim: MJD conversion quantizes support to integer Unix seconds.
      input: "MJD=60000.123456789"
      exact_unix_seconds: "1677293866.6665695"
      source_returned_integer_seconds: 1677293866
      lost_seconds: "0.66656947135925293"
    - id: SCI-AST-001-P002
      claim: TAN singular and back-hemisphere directions can become the finite map center.
      results:
        quarter_turn_exact_x: "0"
        quarter_turn_previous_double_x: "3530114321217157.5"
        quarter_turn_next_double_x: "0"
        antipode_x: "-1.2246467991473532e-16"
    - id: SCI-AST-001-P003
      claim: Negative azimuth-boundary crossing is not wrapped by calc_tan_altaz.
      input: "TelAzAct=0.1 rad, SourceAz=6.2 rad, elevation=0.8 rad, zero corrections"
      tangent_longitude_rad: "-4.2499109270177096"
      tangent_longitude_arcsec: "-876607.05392872554"
    - id: SCI-AST-001-P004
      claim: A one-arcsecond tangent-x error is not a one-arcsecond RA error away from the equator.
      ra_error_arcsec_for_one_arcsec_tangent_x:
        dec_0_deg: "0.99999999999216516"
        dec_60_deg: "1.9999999999373212"
        dec_80_deg: "5.7587704816473346"
    - id: SCI-AST-001-P005
      claim: Float WCS storage can erase a sub-arcsecond CRVAL distinction.
      input_crval_deg: "359.99999"
      stored_float32_crval_deg: "360"
      error_arcsec: "0.035999999909108737"

positive_controls:
  - id: SCI-AST-001-C001
    observation: >-
      FITS image writes reverse the internal longitude axis and assign negative
      CDELT1; reads reverse it back. No corresponding latitude reversal is
      applied and CDELT2 is positive.
    conclusion: Conforms to the frozen handedness convention for the traced path.
  - id: SCI-AST-001-C002
    observation: >-
      Internal zero-based CRPIX=(N-1)/2 is written as CRPIX+1, yielding the
      FITS one-based center (N+1)/2 for required odd dimensions.
    conclusion: Conforms to the frozen indexing convention for generated maps.
  - id: SCI-AST-001-C003
    observation: >-
      Required WCS/output exceptions and incomplete astrometry provenance
      propagate rather than being logged and forgotten; provenance is written
      atomically only after lifecycle completion.
    conclusion: Conforming failure-flow evidence, while schema completeness remains open.
  - id: SCI-AST-001-C004
    observation: >-
      Per-observation astrometry requests are installed before application and
      lifecycle completion requires equal nonzero install/application counts.
    conclusion: Useful replacement/application-count guard, not realized-value proof.

