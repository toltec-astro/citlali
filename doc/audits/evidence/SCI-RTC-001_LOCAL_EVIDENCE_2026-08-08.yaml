direct_observations:
  - id: SCI-RTC-001-O001
    claim: RTC stage order and output split are explicit.
    result: >-
      Calibration then extinction precede kernel creation and despike
      replacement; pre/filter/notch/IIR stages precede outer capture; phase-zero
      decimation, post-filter masks/notches, and signal-only alt-az destriping
      produce the inner PTC input. Outer RTC is therefore not the same stage as
      inner RTC/PTC input.
  - id: SCI-RTC-001-O002
    claim: RTC-entry absolute response is nonconformant with the frozen CAL authority.
    result: >-
      Signal is multiplied by flux_conversion_factor times APT flxscale.
      Non-q0 tau is made zenith-equivalent by division by airmass and then
      applied as exp(tau), while q0 returns zero tau. Required strict finite,
      positivity, factor-identity, and top-of-atmosphere application semantics
      are not realized.
  - id: SCI-RTC-001-O003
    claim: calibrated-domain replacement omits the calibration-factor ratio.
    result: >-
      Donor residuals are divided by donor responsivity, averaged, and
      multiplied by target responsivity after calibration. Equation RTC-07
      requires g_target*rho_target/(g_donor*rho_donor); source applies only the
      rho ratio, does not validate target responsivity, and persists no donor
      links or factor identities. Replaced target rows remain flagged.
  - id: SCI-RTC-001-O004
    claim: validity and influence support are not propagated through the realized operator.
    result: >-
      FIR/notch/IIR consume filled/flagged/non-finite payloads without a typed
      mask operator. Phase-zero striding selects values while flags OR only the
      corresponding factor-cell block. Neighboring unflagged outputs can depend
      on replacement, synthesized, flagged, or non-finite cells; the kernel does
      not include donor mixing and cause-specific influence is not persisted.
  - id: SCI-RTC-001-O005
    claim: an enabled signal operator is absent from the kernel.
    result: >-
      Alt-az destriping forms templates from time/az/el/derivatives, fits each
      detector on unflagged rows, and subtracts X*beta from signal only. It does
      not transform the kernel. Current science and Beammap configs enable both
      alt-az destriping and kernel generation.
  - id: SCI-RTC-001-O006
    claim: source-mask invalidity fails open.
    result: >-
      Nonpositive/non-finite radius, unsupported/empty coordinate shape, and
      non-finite coordinates yield an all-false or partial mask; the supported
      mode sets info.valid true and RTC ignores that validity. Invalid
      coordinate is therefore treated as outside/unprotected.
  - id: SCI-RTC-001-O007
    claim: edge response is profile-dependent and incompletely represented.
    result: >-
      FIR leaves first and last n_terms unchanged. Context is requested, but
      only an enabled flag-mode edge guard marks missing observation-boundary
      context. The current science config enables a 32-term FIR while omitting
      the RTC edge_guard block; Point/OOF/Beammap explicitly enable it.
  - id: SCI-RTC-001-O008
    claim: typed configuration has a positive anti-alias dependency guard.
    result: >-
      Validation rejects enabled downsampling without filtering and rejects
      filter high frequency above output Nyquist. It does not prove attenuation,
      coefficient normalization, phase/support provenance, or alias bounds.
  - id: SCI-RTC-001-O009
    claim: four state axes exist but realized scientific provenance is incomplete.
    result: >-
      Requested/effective/observation/realized nodes are serialized atomically
      after completion. Realized lifecycle records only completion, scan count,
      and required write count; optional flagged/dynamic-notch counts are not
      populated by the traced lifecycle. Exact coefficients, order/state,
      calibration table/digests, donor links, masks, phase/support, per-scan
      application, response availability, and product digests are absent.
  - id: SCI-RTC-001-O010
    claim: bounded consumers cannot recover the missing RTC semantics.
    result: >-
      PTC mean/PCA paths consume signal, flags, and kernel; approximate weights
      use fcf and sens although fcf omits flxscale. Ordinary map population skips
      directly flagged cells before payload inspection and fails on eligible
      non-finite values, so unflagged neighbors influenced by invalid/replaced
      cells remain admissible. Beammap uses the same RTC and enables the
      signal-only destriper with a kernel.

