proposed_unity_protocol:
  status: proposed_not_requested
  exact_application_sha: 9aae0e669384c5c0c0dda93debc194d6b8dac787
  prerequisites:
    - Clean exact-SHA checkout, executable digest, build/dependency identity, compiler, host/CPU, and thread environment.
    - Coordinator-approved checksum-pinned input and authored/resolved config with explicit arrays, detector identity, sample rate, flags, and calibration.
    - Complete logs, policy diagnostics, mapmaking provenance, product index, FITS products/digests, HDU metadata, and finite/non-finite/support counts.
    - Existing checksum-pinned independent unit-source input is required for a response-injection claim; absence remains open and does not authorize a new campaign.
  cases:
    - id: U01
      purpose: Ordinary array-grouped JINC product and formal-weight identity with empirical replacement disabled.
    - id: U02
      purpose: Same as U01 with only empirical replacement enabled; preserve formal product and declare working-weight/SNR change.
    - id: U03
      purpose: Detector-grouped Beammap JINC with forced sequential execution.
    - id: U04
      purpose: Exact U03 twin with authorized concurrent policy/thread count; compare contributors, support, finite status, and all numeric planes under preapproved tolerances.
    - id: U05
      purpose: Exact repeat of U04 to assess run-to-run determinism.
    - id: U06
      purpose: Conditional existing unit-source input comparison of signal response and recorded kernel; unavailable if the prerequisite does not already exist.
  prohibitions:
    - no_new_helper_or_validator
    - no_parameter_optimization
    - no_code_patch_or_repair
    - no_substitute_sha
    - no_naive_result_promoted_to_jinc

