static_positive_controls:
  - id: SCI-MAP-002-C001
    observation: Raw signal, signed denominator, and coefficient-squared variance are distinct N, C, and Q accumulators.
    conclusion: Conforms to the frozen constant-field gridding equations before final masking.
  - id: SCI-MAP-002-C002
    observation: Negative coefficients are retained in N and C and squared only in Q/coverage; negative C remains valid above the magnitude gate.
    conclusion: Signed-lobe and ordinary cancellation direction conform.
  - id: SCI-MAP-002-C003
    observation: Observation signal and kernel are divided by the same C, while formal weight is C-squared/Q over the ordinary admitted range.
    conclusion: Signal and analytic unit-source kernel equations conform conditionally on support/numerical gates.
  - id: SCI-MAP-002-C004
    observation: Stable array names select shape vectors and output files/WCS; missing required vectors do not fall back to a neighboring array.
    conclusion: Current valid array identity path conforms statically.
  - id: SCI-MAP-002-C005
    observation: Formal standardized signal and empirical pixel S/N use distinct names/metadata, and formal weight remains separately publishable.
    conclusion: Traced observation product identity conforms; empirical-noise truth remains out of scope.
  - id: SCI-MAP-002-C006
    observation: Reachable detector-parallel Beammap JINC has a one-to-one detector-to-map mapping.
    conclusion: The preliminary overlapping-block race concern is discharged for the current direct caller, while numerical reproducibility remains unverified.

