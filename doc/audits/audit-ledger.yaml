      - id: SCI-MAP-001-F010
        class: scientific_policy_decision
        severity: P1
        evidence_basis: owner_decision
        confidence: high
        status: addressed_pending_reaudit
        owner: scientific_product_owner
        decision_date: 2026-07-31
        decision: >-
          Persist and distinguish geometric hits, contributing hits, coadd
          observation count, upstream-eligible exposure, retained exposure,
          normalization support, science-policy support, and authoritative
          science validity. Require numerical support, science-policy support,
          finite signal and required companions, and admitted product identity
          for validity. Keep normalization and science-policy thresholds
          separate with versioned algorithms and full-precision realized
          provenance. Retain coverage_I only as a retained-exposure
          compatibility alias; deprecate coverage_bool_I as validity
          authority; require downstream raw science validity to remain
          separate from operator-local support.
        summary: >-
          The exposure, hits, support, validity, alias, provenance, and
          downstream separation hierarchy is owner-approved.
        closure_gate: >-
          Implement/version every product and exact absence rule, alias,
          deprecation, companion/identity conjunction, threshold/provenance
          field, and downstream interface; pass exact persisted
          reconstruction, boundary, full-precision round-trip, and fresh
          re-audit gates.
