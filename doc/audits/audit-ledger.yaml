        authority_sha256: 52cdc7d691efb510e0c5e2cd8ad6e3817952995af9f719cbaf4b2e6af1adb793
        approved_contract: >-
          The stage dependency is RTC to optional PTC to optional mapmaking.
          PTC-disabled is an RTC-only terminal mode: bypass all mean
          subtraction, PTC cleaning, PTC weighting, mapmaking, and PTC/map
          products while permitting requested RTC timestream and diagnostic
