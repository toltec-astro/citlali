        WCS admission policy for F003; D006 limits inverse-TAN uncertainty work
        to one map-center response and explicit unavailability, rejecting
        broader covariance computation; D007 preserves and bounds the
        small-angle hot path offline and limits simulation parity to supported
        AltAz and RA/Dec while rejecting Galactic simulation; D008 supplies
        compact truthful precision, per-field metadata, factorized validity,
        full/mini availability, and four-stage provenance without routine
        large identity or validity matrices.
