          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F009
            - SCI-AST-001-F010
            - SCI-AST-001-F011
            - SCI-AST-001-F012
          policy: >-
            Use double precision for compact product-level WCS authorities and
            fitted/catalog sky coordinates. Retain the existing large full-TOD
            coordinate representation only if its offline quantization bound
            is negligible against established astrometric performance; a
            failure returns for owner review. Use exact per-field registry
            metadata and dedicated factorized AST validity: packed aligned-
            sample status, detector admission once per detector, and product
            counts. Do not create detector-by-sample identity/validity arrays.
            Full TOD carries its coordinate contract; mini TOD adds no
            coordinate arrays and declares them unavailable. Persist compact
            atomic four-stage state using ALIGN grid and AST detector identity.
          compatibility_evidence: >-
            Project-owner approval conditioned on no wholesale large-array
            widening, no routine repeated sample IDs or detector-by-sample
            validity matrix, no mini-TOD expansion, and no material runtime or
            scientific-product change. Exact successor quantization, WCS,
            registry, validity, full/mini, provenance, size, runtime, and
            ordinary-map fixtures remain required.
