    addressed_findings:
      - id: SCI-MAP-001-F009
        class: scientific_policy_decision
        severity: P1
        evidence_basis: owner_decision
        confidence: high
        status: addressed_pending_reaudit
        owner: scientific_owner
        decision_date: 2026-07-31
        decision: >-
          Adopt strict identity, unit, response, and full-precision WCS
          admission before mutation with only the current centered integer
          common-grid embedding. Set signal centering to identity; prohibit
          general reprojection/interpolation. Retain the normalized weighted
          mean and treat its weights as nonprecision gridding coefficients by
          default. Precision requires SCI-PTC-001 independence/covariance
          proof; correlated GLS is deferred. Exclude explicitly invalid
          pixels and fail on unexpected non-finite valid inputs. Authorize no
          coadd precision or significance claim while covariance is
          unresolved.
        summary: >-
          Coadd admission, registration, centering, estimator, coefficient,
          finite-input, covariance, and consumer policy are owner-approved.
        closure_gate: >-
          Implement the decision atomically on a separate repair branch; pass
          identity/WCS/response/unit, centered-embedding, invalid/non-finite,
          unequal-coefficient, no-centering, unchanged-compatible-control,
          and provenance fixtures; fresh exact-repair-SHA re-audit.
      - id: SCI-MAP-001-F010
        class: scientific_policy_decision
        severity: P1
        evidence_basis: owner_decision
        confidence: high
        status: addressed_pending_reaudit
        owner: scientific_product_owner
        decision_date: 2026-07-31
        decision: >-
          Persist and distinguish geometric hits, contributing hits, coadd
          observation count, upstream-eligible exposure, retained exposure,
          normalization support, science-policy support, and authoritative
          science validity. Require numerical support, science-policy support,
          finite signal and required companions, and admitted product identity
          for validity. Keep normalization and science-policy thresholds
          separate with versioned algorithms and full-precision realized
          provenance. Retain coverage_I only as a retained-exposure
          compatibility alias; deprecate coverage_bool_I as validity
          authority; require downstream raw science validity to remain
          separate from operator-local support.
        summary: >-
          The exposure, hits, support, validity, alias, provenance, and
          downstream separation hierarchy is owner-approved.
        closure_gate: >-
          Implement/version every product and exact absence rule, alias,
          deprecation, companion/identity conjunction, threshold/provenance
          field, and downstream interface; pass exact persisted
          reconstruction, boundary, full-precision round-trip, and fresh
          re-audit gates.
