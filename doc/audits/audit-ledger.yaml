inventory_dependency_detail: >-
  An upstream record containing only package_id and status is an
  inventory-only edge. Before that package audit is dispatched, the
  coordinator must add the exact required contract fact and the consequence
  while it remains open.

controlled_vocabulary:
  tiers: [A, B, C]
  contract_status:
    - not_started
    - independent_draft_frozen
    - proposed
    - approved
    - superseded
  implementation_status:
    - not_assessed
    - conformant
    - conditionally_conformant
    - nonconformant
  validation_status:
    - not_started
    - planned
    - in_progress
    - external_pending
    - complete
    - failed
  production_status:
    - fail_closed
    - existing_use_only
    - restricted_use
    - approved
    - retired
  verdict:
    - pending
    - retain
    - amend
    - split
    - supersede
    - reject
  finding_class:
    - implementation_defect
    - contract_gap
    - scientific_policy_decision
    - evidence_gap
    - dependency_gap
  evidence_basis: [observed, derived, suspected, owner_decision]
  finding_status: [open, addressed_pending_reaudit, closed, superseded]
  severity: [P0, P1, P2, P3]
  confidence: [low, medium, high]
  dependency_status: [open, conditioned, satisfied, superseded]
  re_audit_status: [not_started, not_required, required, in_progress, complete]

packages:
  - id: SCI-MAP-001
    name: Shared and naive mapmaking plus observation coaddition
    tier: A
    queue_wave: first_new_audit
    scientific_scope: >-
      The shared map-product contract, naive weighted gridding, normalization,
      signal, formal weight, kernel, hits/coverage, validity, and centered
      inverse-variance observation coaddition.
    known_code_areas:
      - include/citlali/core/mapmaking/naive_mm.h
      - include/citlali/core/mapmaking/map.h
      - src/citlali/core/mapmaking/map.cpp
      - include/citlali/core/pipeline/mapmaking_execution_plan.h
      - include/citlali/core/pipeline/observation_coadd_accumulation.h
    inputs:
      - calibrated processed samples and sample/detector eligibility
      - detector weights and timestream covariance assumptions
      - pointing/pixel operator and sample duration
    outputs:
      - observation and coadd signal maps
      - formal map weight, kernel, hits/coverage, and validity
    upstream_dependencies:
      - package_id: SCI-CAL-001
        status: open
        required_contract: >-
          Calibrated processed-sample identity, units, multiplicative response,
          and calibration-uncertainty terms at the mapmaker input.
        consequence: >-
          Map amplitude, units, and calibration covariance remain conditional.
      - package_id: SCI-AST-001
        status: open
        required_contract: >-
          Per-sample projection/pointing operator, coordinate frame, pixel
          convention, and astrometric-response uncertainty.
        consequence: >-
          Spatial response, WCS, and astrometric covariance remain conditional.
      - package_id: SCI-PTC-001
        status: open
        required_contract: >-
          Processed-sample weighting or covariance identity, normalization,
          and any correlations retained after timestream conditioning.
        consequence: >-
          A gridding denominator cannot be authorized as formal inverse
          variance without this contract.
      - package_id: SCI-VAL-001
        status: open
        required_contract: >-
          Sample/detector eligibility, flag, non-finite, and zero-support
          semantics presented to accumulation and coaddition.
        consequence: >-
          Map validity, hits, coverage, and consumer eligibility remain
          conditional.
    downstream_consumers:
      - SCI-MAP-002
      - SCI-NOI-001
      - SCI-NOI-002
      - SCI-FLT-001
      - SCI-FLT-002
      - SCI-SRC-001
      - SCI-MODE-001
      - SCI-BEAM-001
      - SCI-FRUIT-001
