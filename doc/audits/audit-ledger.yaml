    implementation_assessment:
      governing_source: nonconformant
      claimed_operator: >-
        theta=T(x,m,a;phi), z=F(x,m,a,theta), w=W(z,m,a,theta), and
        q_(s+1)=G(q_s,x,m,a), with cause-preserving validity, bounded conditioned
        or local response, declared covariance/uncertainty, exact four-state
        identity, immutable parent/product links, and fail-closed consumers.
      implemented_operator: >-
        Per-detector source-mask mean subtraction followed, when enabled, by
        sequential configured data-derived covariance/eigenmode selection and
        projection for signal and a fixed-state kernel; optional post-PCA flags;
        approximate/full/hybrid/validated/constant scalar detector coefficients;
        then ordered PTC products and coefficient-weighted map/beam consumers.
      positive_controls:
        - local cleaner state per call and ordered group passes
        - active-detector/covariance overlap checks and bounded diagnostics
        - signal and kernel receive the same fixed realized PCA projection
        - explicit cache and learned-weight mutex ownership
        - one-way typed requested/effective configuration skeleton
        - direct flags checked before ordinary map payload use
        - atomic file creation and required writer failure propagation
      consequence: >-
        Positive subcontracts do not compensate for exact validity/influence,
        rate, extent, response, covariance, provenance, product, policy,
        dependency, and evidence nonconformities.

