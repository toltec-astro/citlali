  - id: SCI-ALIGN-001
    name: Sample alignment, scan slicing, and gap interpolation
    tier: A
    queue_wave: foundation_1
    scientific_scope: >-
      Construction of the common detector/telescope/HWPR sample axis,
      interface time offsets, scan bounds, timing-gap interpolation, and gap
      masks before scientific conditioning.
    known_code_areas:
      - include/citlali/core/engine/detail/todproc_alignment_impl.h
      - include/citlali/core/engine/detail/kidsproc_gaps_impl.h
      - include/citlali/core/pipeline/timestream_scan_generation.h
    inputs: [raw detector and telescope samples, timestamps, interface offsets]
    outputs: [aligned samples, scan windows, timing-gap values and masks]
    upstream_dependencies: []
    external_input_contract:
      status: open_for_audit
      required_fact: >-
        Each raw detector, telescope, and optional HWPR stream presented to
        ALIGN has a declared observation/interface identity, native ordered
        sample axis, timestamp or clock origin, cadence, acquisition bounds,
        and missing/non-finite state; every requested interface offset has a
        declared sign, unit, reference interface, and application stage.
