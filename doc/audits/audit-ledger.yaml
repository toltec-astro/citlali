  - id: SCI-PTC-001
    name: Correlated-mode cleaning and detector-weight interface
    tier: B
    scientific_scope: >-
      Admitted RTC-stage detector timestreams, kernels/responses, flags,
      detector/APT state, and source masks through PTC mean removal,
      data-derived correlated-mode selection/subtraction, optional second pass,
      detector coefficients, diagnostics, processed products, provenance, and
      bounded VAL/MAP/NOI/BEAM consumer contracts.
    inputs:
      - admitted RTC signal/kernel/flags with exact detector, sample, scan, rate, phase, support, response, and validity identity
      - approved CAL factor table, APT binding, coefficient-factor identity, and covariance
      - approved AST/ALIGN coordinates, source-mask validity, detector-row binding, and scan extents
      - requested PTC policy plus effective, observation-resolved, and realized cleaning/weight state
    outputs:
      - cleaned signal with cause- and decision-stage-specific validity and eligibility
      - conditioned/local response or explicit response unavailability and uncertainty status
      - typed nonprecision detector coefficients or proved precision plus retained covariance
      - immutable full/mini/diagnostic/simulated/processed products and four-state provenance

    upstream_dependencies:
      - package_id: SCI-RTC-001
        status: open
        current_lane_status: audited_nonconformant_existing_use_only_successor_not_accepted
        finding_id: SCI-PTC-001-F010
        required_contract: >-
          Complete admitted signal/kernel response, direct and transitive causal
          support, sample/rate/phase identity, calibration-factor identity, and
          reconstructible realized provenance at the same application SHA.
        consequence: >-
          New absolute response, independent-sample, covariance, and coefficient
          factor claims fail closed.
      - package_id: SCI-CAL-001
        status: open
        current_lane_status: active_repair_from_governing_SHA
        finding_id: SCI-PTC-001-F011
        required_contract: >-
          Exact fcf/sensitivity/flxscale factor identity, detector/APT binding,
          units, validity, normalization, and shared uncertainty/covariance.
        consequence: >-
          New precision, inverse-variance, calibrated-significance, and absolute
          coefficient interpretations fail closed.
      - package_id: SCI-ALIGN-001
        status: open
        current_lane_status: owner_managed_repair_evidence_not_integrated_or_Unity_validated
        finding_id: SCI-PTC-001-F004
        required_contract: >-
          Exact contiguous scan/sample extents and accepted aligned sample,
          origin, support, and detector identity.
        consequence: >-
          Variable-length processed products and new extent/reconstruction claims
          fail closed.
      - package_id: SCI-AST-001
        status: open
        current_lane_status: repair_held_behind_ALIGN
        finding_id: SCI-PTC-001-F012
        required_contract: >-
          Exact coordinate frame/domain/validity, topology, source-mask identity,
          and detector-row binding.
        consequence: >-
          New coordinate-aware mask, feedback, response, and eligibility claims
          fail closed.

