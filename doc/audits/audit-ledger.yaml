    addressed_findings:
      - id: SCI-MAP-001-F009
        class: scientific_policy_decision
        severity: P1
        evidence_basis: owner_decision
        confidence: high
        status: addressed_pending_reaudit
        owner: scientific_owner
        decision_date: 2026-07-31
        decision: >-
          Adopt strict identity, unit, response, and full-precision WCS
          admission before mutation with only the current centered integer
          common-grid embedding. Set signal centering to identity; prohibit
