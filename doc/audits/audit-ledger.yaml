        record_commit: 0a17d088aded7fc6c18a59522f5b2b2fce9749ad
        sha256: >-
          d40def5bb1450446abc858d2acfc1924c2f65276f8f48eec89cf05a171cdcf6a
      approved_decisions:
        - id: SCI-AST-001-D001
          status: approved_with_astrometric_and_layered_identity_compatibility_guards
          authority: project_owner
          evidence_basis: owner_decision
          policy: >-
            Preserve the demonstrated end-to-end sign, basis, rotation,
            handedness, and composition behavior; document each stage and use
            explicit boundary adapters without moving correctly located
            sources. Admit a proven target acquisition-row or explicit keyed
            binding while keeping source-Beammap and optional design matches
            distinct; do not claim a universal stable UID or perfect match.
          compatibility_evidence: >-
            Project-owner statement that approximately one-square-degree maps
            place point sources correctly, including at map corners; local
            read-only evidence of exact same-observation/target-row spines and
            imperfect cross-observation matching; exact repair-base artifacts
            remain required for repair and re-audit validation.
        - id: SCI-AST-001-D002
          status: approved_strict_forward_hemisphere_and_fail_closed_validity
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F001
            - SCI-AST-001-F012
          policy: >-
            Admit forward TAN only for finite inputs, finite D strictly greater
            than zero, and finite continuous output. Every other case is
            explicit coordinate invalidity, never center alias, clamp, stale
            reuse, or ordinary map exclusion. Block invalid coordinates before
            integer pixels and consumers; a required otherwise-eligible
            invalid sample fails the required coordinate-dependent product and
            reduction. Adopt no tighter radius or positive D_min unless
            independently derived and preregistered from supported footprints.
          compatibility_evidence: >-
            Project-owner approval of the coordinator recommendation plus the
            demonstrated ordinary approximately one-square-degree astrometric
            domain; exact successor fixtures remain required.
        - id: SCI-AST-001-D003
          status: approved_product_frame_split_explicit_epoch_and_shortest_topology
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F002
            - SCI-AST-001-F006
            - SCI-AST-001-F010
          policy: >-
            Preserve native AltAz tangent coordinates for Point, OOF, and
            Beammap and explicit equatorial J2000 TAN for Science. Publish
            FK5/EQUINOX=2000 only when headers establish that identity;
            preserve ICRS or use one named transform. Never silently default a
            missing epoch. Normalize persisted longitude to [0, 2*pi), use a
            canonical shortest-signed difference in [-pi, pi), and require
            named authority and inputs for any new EOP/refraction/frame
            transformation. Legacy ambiguous identity is restricted and
            cannot support a new precision claim.
          compatibility_evidence: >-
            Project-owner approval plus established product-family frame
            conventions and demonstrated end-to-end source locations; exact
            successor frame, wrap, metadata, and transform fixtures remain
            required.
        - id: SCI-AST-001-D004
          status: approved_explicit_support_and_scientifically_adequate_time_precision
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings: [SCI-AST-001-F005]
          policy: >-
            Use explicit constant, two-present finite strictly increasing
            bracketed-MJD, or both-absent legacy observation-span modes. Reject
            mixed, equal, reversed, non-finite, unbracketed, clamped, nearest,
            extrapolated, or stale support. Judge time precision by the
            quantified angular effect of actual time quantization and pointing
            drift against preregistered Point/Beammap performance. Retain
            integer-second time if adequate; otherwise improve only enough to
            meet the demonstrated astrometric need without wholesale retiming.
          compatibility_evidence: >-
            Project-owner scientific judgment that subsecond timing error does
            not produce a meaningful fraction-of-an-arcsecond pointing error,
            conditioned on a preregistered drift-rate bound and established
            source-crossing, centroid, repeatability, and PSF-width evidence.
        - id: SCI-AST-001-D005
          status: approved_legacy_zero_automatic_reject_explicit_wcs
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings: [SCI-AST-001-F003]
          policy: >-
            Treat exact zero in crpix1/2, crval1/2_J2000, and tan_ra/dec as the
            legacy automatic sentinel and preserve current centered/source-
            derived WCS behavior. Reject every nonzero or non-finite value at
            configuration admission with a field-specific unsupported error;
            no accepted value may be ignored or overwritten. Any future
            explicit control requires a typed automatic/explicit contract so
            legitimate zero coordinates remain representable.
          compatibility_evidence: >-
            Project-owner approval plus generated configurations and retained
            validation profiles using exact zero for all six fields; exact
            successor admission, provenance, config, WCS, and product fixtures
            remain required.
        - id: SCI-AST-001-D006
          status: approved_map_center_response_only_broader_covariance_rejected
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F007
            - SCI-AST-001-F008
          policy: >-
            Evaluate the inverse-TAN 2x2 response only once at the realized
            map/WCS tangent center when equatorial positional uncertainty is
            reported, and apply it to the available map-center covariance.
            Preserve native tangent-plane uncertainty without unnecessary
            conversion. Missing terms remain explicitly unavailable, never
            zero, and no incomplete synthetic total or new precision claim is
            allowed. Per-sample, per-detector, per-pixel, response-grid, dense,
            or broadly composed covariance calculations are not approved.
          compatibility_evidence: >-
            Project-owner scientific judgment that offset-pointing sources
            have the same or very similar declination as their science targets,
            making the realized map-center response operationally adequate.
            Exact successor center-reference, availability, unchanged-map, and
            no-hot-path-work fixtures remain required.
        - id: SCI-AST-001-D007
          status: approved_preserved_hot_path_offline_bound_and_fail_closed_simulation
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F006
            - SCI-AST-001-F014
          policy: >-
            Preserve the existing small-angle production operator and bound it
            offline against an independent exact spherical reference over a
            preregistered envelope of supported map footprints, focal-plane
            offsets, and pointing corrections. Judge its discrepancy against
            established centroid, repeatability, and PSF-width tolerances;
            fail outside the envelope and add no production exact-spherical
            fallback. Supported AltAz and RA/Dec simulation must reuse the
            applicable real coordinate preparation. Galactic simulation is
            rejected at admission until separately implemented and approved.
          compatibility_evidence: >-
            Project-owner approval plus evidence that representative
            approximately one-square-degree maps place sources correctly at
            centers, edges, and corners. Exact successor offline-bound,
            ordinary-source, compact real/simulation parity, fail-closed, and
            no-material-runtime-regression evidence remains required.
        - id: SCI-AST-001-D008
          status: approved_compact_truthful_products_factorized_validity_and_bounded_precision
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F009
            - SCI-AST-001-F010
            - SCI-AST-001-F011
            - SCI-AST-001-F012
          policy: >-
            Use double precision for compact product-level WCS authorities and
            fitted/catalog sky coordinates. Retain the existing large full-TOD
            coordinate representation only if its offline quantization bound
            is negligible against established astrometric performance; a
            failure returns for owner review. Use exact per-field registry
            metadata and dedicated factorized AST validity: packed aligned-
            sample status, detector admission once per detector, and product
            counts. Do not create detector-by-sample identity/validity arrays.
            Full TOD carries its coordinate contract; mini TOD adds no
            coordinate arrays and declares them unavailable. Persist compact
            atomic four-stage state using ALIGN grid and AST detector identity.
          compatibility_evidence: >-
            Project-owner approval conditioned on no wholesale large-array
            widening, no routine repeated sample IDs or detector-by-sample
            validity matrix, no mini-TOD expansion, and no material runtime or
            scientific-product change. Exact successor quantization, WCS,
            registry, validity, full/mini, provenance, size, runtime, and
            ordinary-map fixtures remain required.
      pending_decisions: []
      effect: >-
        Resolves D001-D008 for contract design without approving the governing
        implementation, closing F001/F002/F003/F005/F006/F007/F008/F009/F010/F011/F012/F013/F014,
        authorizing repair, or expanding production use. D001's identity
