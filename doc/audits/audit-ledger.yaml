          status: approved_preserved_hot_path_offline_bound_and_fail_closed_simulation
          authority: project_owner
          evidence_basis: owner_decision
          affected_findings:
            - SCI-AST-001-F006
            - SCI-AST-001-F014
          policy: >-
            Preserve the existing small-angle production operator and bound it
            offline against an independent exact spherical reference over a
            preregistered envelope of supported map footprints, focal-plane
            offsets, and pointing corrections. Judge its discrepancy against
            established centroid, repeatability, and PSF-width tolerances;
            fail outside the envelope and add no production exact-spherical
            fallback. Supported AltAz and RA/Dec simulation must reuse the
            applicable real coordinate preparation. Galactic simulation is
            rejected at admission until separately implemented and approved.
          compatibility_evidence: >-
            Project-owner approval plus evidence that representative
            approximately one-square-degree maps place sources correctly at
            centers, edges, and corners. Exact successor offline-bound,
            ordinary-source, compact real/simulation parity, fail-closed, and
            no-material-runtime-regression evidence remains required.
        - id: SCI-AST-001-D008
