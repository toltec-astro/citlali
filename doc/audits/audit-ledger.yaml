        authority_sha256: f57f1afdfe561db9ebd49c51edf1c716c017838dce5ee1bca679e95ba5401e63
        approved_contract: >-
          Inputs known to be invalid for estimating the PTC model must be
          excluded before fitted-state arithmetic. A later result requires
          refitting or fitted-product invalidation only when its typed cause
          explicitly reclassifies that input as fit-invalid. Residual-based
          post-PCA sample rejection, clean-state detector-quality selection,
          and coefficient-based preference are downstream eligibility/weighting
          decisions; they directly exclude or downweight the selected output
          only and do not automatically invalidate the PCA state or other
          detectors.
        minimum_semantics:
          - fit_invalid
          - postfit_output_reject
          - weight_only
        representation_owner: engineering

