          proof; correlated GLS is deferred. Exclude explicitly invalid
          pixels and fail on unexpected non-finite valid inputs. Authorize no
          coadd precision or significance claim while covariance is
          unresolved.
        summary: >-
          Coadd admission, registration, centering, estimator, coefficient,
          finite-input, covariance, and consumer policy are owner-approved.
        closure_gate: >-
          Implement the decision atomically on a separate repair branch; pass
