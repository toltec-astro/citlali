      - id: SCI-MAP-001-F002
        class: implementation_defect
        severity: P0
        evidence_basis: observed
        confidence: high
        status: open
        owner: map_product_implementation
        summary: >-
          Persisted coverage_bool validity admits zero and non-finite weight
