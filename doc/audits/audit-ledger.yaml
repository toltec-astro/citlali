        - exact static, digest, YAML, link, and offline document checks without overall conformance inference
      restricted:
        - new precision, inverse variance, significance, independent-noise, covariance, photometry, transfer, kernel, beam, or response-uncertainty claims
        - new VAL eligibility/exposure interpretations equating finite/unflagged with uninfluenced or independent
        - new coordinate-aware mask/feedback use without conformant AST/ALIGN binding
        - new coefficient-factor interpretation without conformant CAL authority
        - equivalence among RTC input, full, mini, diagnostic, simulated, processed, map, or beam products
        - production expansion from static/config/historical evidence or a future test pass alone
      fail_closed:
        - missing, non-finite, invalid, duplicate, or unbound detector/sample/rate/phase/factor/coordinate/support/product authority
        - unavailable complete response, covariance, causal eligibility, uncertainty, or immutable product completeness
        - any new consumer outside the existing allowlist
        - any use of this audit as repair, validation, integration, re-audit, downstream launch, or production authorization

