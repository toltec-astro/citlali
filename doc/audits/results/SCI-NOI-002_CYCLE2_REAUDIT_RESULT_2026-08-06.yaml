findings:
  - id: SCI-NOI-002-C2RA-P1-001
    severity: P1
    title: publication_starts_before_reduction_directory_exists
    status: open
    evidence:
      - include/citlali/core/cli/reduction_execution.h:161
      - include/citlali/core/pipeline/output_path_state.h:9
      - include/citlali/core/engine/detail/todproc_raw_input_impl.h:44
      - include/citlali/core/pipeline/noise_provenance.h:155
    impact: >-
      Fresh processor sessions throw before the first iteration; reused state
      can invalidate the prior reduction authority before a new reduction
      directory is selected.
    lower_level_helpers_omit_begin_but_independent_support_not_established: true
    affects: [SCI-NOI-002-RA-B001, SCI-NOI-002-RA-B003]

  - id: SCI-NOI-002-C2RA-P1-002
    severity: P1
    title: session_scoped_noise_publication_corrupts_FRUIT_iterations
    status: open
    evidence:
      - include/citlali/core/pipeline/noise_execution_plan.h:223
      - include/citlali/core/pipeline/mapmaking_execution_plan.h:110
      - include/citlali/core/pipeline/iteration_output_layout.h:13
      - include/citlali/core/pipeline/fruit_loop_activation_validation.h:49
      - include/citlali/core/pipeline/mapmaking_dispatch.h:49
    impact: >-
      Members and observed counters accumulate across FRUIT iterations while
      expectations describe the final iteration; reused/outside-root members
      and double counts deterministically make enabled-FRUIT completion fail.
    latent_behind_publication_initialization_finding: SCI-NOI-002-C2RA-P1-001
    affects: [SCI-NOI-002-RA-B001, SCI-NOI-002-RA-B003, SCI-NOI-002-F006]

  - id: SCI-NOI-002-C2RA-P1-003
    severity: P1
    title: completion_not_reconciled_to_package_product_identities
    status: open
    evidence:
      - include/citlali/core/pipeline/noise_provenance.h:554
      - tests/test_config_scaffold.cpp:3185
      - tests/test_config_scaffold.cpp:3200
      - tests/test_config_scaffold.cpp:3288
      - direct_disabled_package_probe
    impact: >-
      Disabled zero-work packages may contain stack-derived empirical FITS and
      finite NetCDF products, while enabled packages may omit expected
      empirical identities. Realization HDUs are separately reconciled.
    affects: [SCI-NOI-002-RA-B001, SCI-NOI-002-RA-B002, SCI-NOI-002-RA-B003]

  - id: SCI-NOI-002-C2RA-P1-004
    severity: P1
    title: joins_and_member_symlink_identity_are_not_exact
    status: open
    evidence:
      - include/citlali/core/pipeline/noise_provenance.h:210
      - include/citlali/core/pipeline/noise_provenance.h:303
      - include/citlali/core/pipeline/noise_provenance.h:339
      - include/citlali/core/pipeline/noise_provenance.h:418
      - tools/baseline/audit_reduction_run.py:1326
    impact: >-
      Required join fields and identity-specific values are unchecked,
      duplicate non-realization canonical HDUs collapse into a set, and
      symlink-free path identity or lexical alias rejection is not uniform
      between producer and auditor.
    affects: [SCI-NOI-002-RA-B001, SCI-NOI-002-RA-R001]

  - id: SCI-NOI-002-C2RA-P1-005
    severity: P1
    title: production_filtered_validity_does_not_use_actual_response_or_support
    status: open
    evidence:
      - include/citlali/core/pipeline/map_image_output_helpers.h:558
      - include/citlali/core/pipeline/map_image_output_helpers.h:699
      - doc/SCIENTIFIC_CONVENTIONS.md:265
      - doc/SCIENTIFIC_CONVENTIONS.md:296
      - src/citlali/core/mapmaking/map.cpp:541
      - tests/test_science_map_fits_products.cpp:401
    impact: >-
      Production derives no actual response, hard-codes unity, substitutes the
      non-authoritative raw policy mask for raw validity/local support, and
      makes response_invalid unreachable. The helper also mislabels a mixed
      finite-off-support/nonfinite-on-support case as support_invalid.
    authority_ambiguity_if_unity_identity_response_was_intended: true
    affects: [SCI-NOI-002-RA-B004, SCI-NOI-002-F005]

  - id: SCI-NOI-002-C2RA-P1-006
    severity: P1
    title: split_Beammap_bookkeeping_counts_unselected_maps
    status: open
    evidence:
      - include/citlali/core/engine/detail/beammap_map_product_writers_impl.h:145
      - include/citlali/core/engine/detail/beammap_map_product_writers_impl.h:198
      - include/citlali/core/engine/detail/beammap_map_product_writers_impl.h:266
      - include/citlali/core/pipeline/noise_execution_plan.h:401
      - include/citlali/core/pipeline/noise_provenance.h:554
    impact: >-
      When configured flags select a strict subset, selected split files are
      admitted but full MapBuffer cardinality is counted, causing completion
      failure with realizations or false empirical counts without them. The
      pre-existing selection itself is unchanged.
    affects: [SCI-NOI-002-RA-B001, SCI-NOI-002-RA-B003]

  - id: SCI-NOI-002-C2RA-P1-007
    severity: P1
    title: literal_enabled_zero_authority_not_implemented
    status: open_authority_clarification_permitted_but_not_waived
    evidence:
      - include/citlali/core/pipeline/noise_execution_plan.h:176
      - tools/baseline/audit_reduction_run.py:1094
      - direct_requested_enabled_zero_probe
    impact: >-
      Requested enabled/count-zero is accepted when mapmaking disables
      effective execution, contrary to the literal frozen statement that
      enabled-zero remains invalid.
    affects: [SCI-NOI-002-RA-B002]

  - id: SCI-NOI-002-C2RA-P2-001
    severity: P2
    title: duplicate_compatible_legacy_HDU_physical_plane_remains
    status: open
    evidence:
      - include/citlali/core/pipeline/map_image_output_helpers.h:652
    impact: >-
      sig2noise and sig2noise_pixel store the same matrix with the same
      canonical identity, retaining one extra 8N-byte payload per map contrary
      to the one-physical-plane owner policy.
    affects: [SCI-NOI-002-RA-R001]

  - id: SCI-NOI-002-C2RA-P2-002
    severity: P2
    title: aggregate_digest_encoding_and_auditor_order_are_ambiguous
    status: open
    evidence:
      - include/citlali/core/pipeline/noise_provenance.h:594
      - tools/baseline/audit_reduction_run.py:1573
    impact: >-
      Newline-delimited unescaped names are not injective and the active
      auditor does not require the writer's lexical member order.
    affects: [SCI-NOI-002-RA-B001]

  - id: SCI-NOI-002-C2RA-P2-003
    severity: P2
    title: Mapdiag_exact_metadata_and_value_regression_fixture_incomplete
    status: implementation_pass_validation_incomplete
    evidence:
      - include/citlali/core/pipeline/mapdiag_netcdf_map_double_values.h:52
      - tests/test_config_scaffold.cpp:3146
    impact: >-
      Implementation preserves names/value bindings and corrects comments, but
      tests do not prove unique variables, exact metadata, absence of old
      wording, or unchanged values.
    affects: [SCI-NOI-002-RA-R002]

