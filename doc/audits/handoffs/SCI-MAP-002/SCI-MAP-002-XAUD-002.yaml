claim: >-
  The current production trace establishes unique per-detector map ownership
  for detector grouping and sequential invocation across scans. Task
  01a00127-b5f4-74a2-a4bb-88c102277aea, SCI-MAP-002-OWNERSHIP-001, enforces
  the ownership and destination precondition eagerly before diagnostics,
  mutation, or parallel launch. It is coherently committed at exact SHA
  e6c8d126157674a9990abc8d1e96ce2dd69f9374 from parent/base
  46ad23888a40f5102cdfd50c06e49a549bdf8a20 with tree
  c69aa1718178d892a4c9d71fbeb931b55ed2d607 and standard binary patch SHA-256
  d20cf7cde7e6397e9876e048f9401217dcc7592414e1dc94cbd669043ecb55aa.
  The exact three paths are jinc_mm.h, test_jinc_parallel_ownership.cpp, and
  tests/CMakeLists.txt. Final applicable gates passed: 24/24 across the 1/2/4/8
  valid-path matrix with worker arithmetic unchanged, full CTest 629/629
  runnable with only the established disabled test, config 127/127, valid
  ledgers, and clean scope. TSan is superseded, not passed or waived, for this
  corrected pre-parallel contract-hardening mission: independent Apple TSan
  produced 91 cross-region stack/lifetime reports despite GRPPI's
  implicit-barrier OpenMP loop, and alternate LLVM was unusable. The committed
  task is awaiting owner push; it is not pushed, integrated, accepted,
  promoted, or production-ready. Any later independent review remains
  conditioned only where the frozen package requires it.

