summary: >-
  RTC owner decisions D002 and D003 require a complete conditioned response or
  an honest unavailable state and immutable stage identities with explicit
  parent/processing links.
claim: >-
  SCI-MAP-003 may treat only the approved RTC complete-response and immutable-
  identity rules as pre-core authority; the exact discrete Gaussian tracer and
  conformity of the governing implementation remain open audit questions.
supports:
  - >-
    Every response-changing RTC stage must be represented in the kernel or
    realized local response; a partial kernel is never the complete response.
  - >-
    If the complete response cannot be represented truthfully and economically,
    response is unavailable.
  - >-
    Outer, inner, full, mini, diagnostic, simulated, and processed RTC products
    retain distinct immutable stage identities and parent/processing links.
does_not_establish:
  - the exact APT row or detector mixture, Gaussian amplitude, truncation, or pixelization
  - conformity of RTC implementation at governing application SHA 46ad2388
  - closure of RTC findings or ALIGN, CAL, and AST dependencies
  - an approved MAP-003 transfer, uncertainty, or production consumer

