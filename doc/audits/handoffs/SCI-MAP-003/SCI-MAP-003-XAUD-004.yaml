summary: >-
  PTC D003 identifies the current kernel as an estimated map-center point-source
  response with exact band/mode/configuration/selection/realization scope and
  explicit unavailable or invalid states.
claim: >-
  SCI-MAP-003 may begin from the bounded estimated map-center response identity
  but may not promote it to an off-center, spatially varying, extended-source,
  arbitrary-morphology/amplitude, or universal cross-band/cross-mode transfer.
supports:
  - >-
    The response binds exact band, analysis/configuration, detector/mask/
    selection state, realization state, and every applicable upstream response.
  - >-
    Response status distinguishes computed_published,
    not_computed_or_not_requested_for_this_product, invalid, and unavailable.
  - >-
    Distinct bands and map/reduction modes are expected to have different
    transfer functions; substitution is not authorized.
