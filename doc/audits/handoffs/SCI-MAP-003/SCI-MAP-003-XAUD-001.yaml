summary: >-
  The approved MAP-001 contract supplies the shared map-product identity,
  parent, WCS/unit, support/validity, required-output, and publication
  vocabulary needed to define one exact OOF product cell.
claim: >-
  SCI-MAP-003 must bind its reference, final kernel, transfer, validity domain,
  and publication state to an admitted SCI-MAP-001 product identity and must
  keep upstream eligibility, estimator contribution, numerical support,
  science-policy support, and authoritative science validity distinct.
supports:
  - >-
    Product identity includes admitted WCS, frame, units, response, required
    companions, and exact parentage rather than only finite array values.
  - >-
    Authoritative validity requires normalization support, science-policy
    support, finite signal and required companions, and admitted product
    identity.
  - >-
    Existing MAP use remains bounded and does not authorize a new response
    interpretation or consumer.
does_not_establish:
  - conformity of MAP-001 implementation at governing application SHA 46ad2388
  - a JINC-specific kernel identity or transfer estimator
  - an FFT convention, denominator rule, or LMTOOF consumer contract
  - closure of MAP-001 upstream CAL, AST, PTC, or VAL dependencies

