summary: >-
  Direct finite and unflagged PTC output does not prove absence of invalid
  causal influence, and the stored conditioned kernel does not establish the
  response or uncertainty needed by VAL or a later BEAM audit.
claim: >-
  At the governing SHA, masked NaN/Inf arithmetic can contaminate PTC means,
  covariance, selected state, and unflagged descendants; null surrogates shift
  signal without shifting validity; and second-pass, post-clean detector, and
  weight flags occur after cross-detector mixing without recomputation or
  transitive invalidation. The kernel follows a fixed realized PTC basis but
  omits data-dependent selection derivatives and inherits incomplete RTC
  causal support/response. Therefore direct binary flags and the stored kernel
  are insufficient authority for new eligibility, exposure, response,
  transfer, beam, or response-uncertainty claims.

required_PTC_interface_facts:
  direct_validity:
    binary_sample_flags_present: true
    eligible_only_nonfinite_admission_conformant: false
    cause_specific_validity_present: false
    transitive_cross_detector_influence_present: false
  late_exclusion:
    second_pass_flags_after_cleaning: true
    post_clean_detector_flags_after_cleaning: true
    descendant_recomputation_or_invalidation_present: false
  response:
    conditioned_signal_derived_kernel_present_in_full_output: true
    present_in_mini_output: false
    unconditional_or_local_Jacobian_complete: false
    upstream_RTC_response_complete: false
    response_uncertainty_present: false
    explicit_unavailable_state_present: false
  BEAM_later_route:
    beammap_consumes_PTC_cleaning_and_kernel_boundary: true
    new_beam_or_transfer_claim_supported: false
    BEAM_launched_by_this_record: false

supports:
  - >-
    Preserve VAL existing_use_only and reject new eligibility/exposure claims
    that equate finite and unflagged with original-valid, uninfluenced, or
    statistically independent.
  - >-
    Require durable direct cause, transitive influence, source-mask support,
    selected state, conditioned/local response class, uncertainty, and explicit
    unavailable fields before expanding consumers.
  - >-
    Route the response facts to a future separately launched BEAM audit; until
    then, no new global, extended-source, beam, or response-uncertainty use is
    supported.
does_not_establish:
  - This record does not audit VAL eligibility policy, statistics, or package-wide behavior.
  - It does not audit or launch BEAM and does not quantify a beam or map bias.
  - It does not prove that any accepted historical product exercised an edge case.
  - It does not authorize repair, validation execution, re-audit, or production change.

