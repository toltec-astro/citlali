summary: >-
  Fit-admission invalidity, post-fit output rejection, and weight-only
  noncontribution require distinct durable cause and decision-stage semantics;
  ordinary post-fit quality selection does not retroactively invalidate PCA.
claim: >-
  At the governing SHA, F001 remains a P0 invalid-input admission defect:
  masked NaN/Inf arithmetic can contaminate fitted state and descendants, and
  null surrogates shift signal without coupled validity. F002 is instead a P1
  contract gap because the binary flag channel does not durably distinguish
  fit_invalid from postfit_output_reject or weight_only. Only a typed cause
  explicitly classified fit_invalid requires refit or fitted-product
  invalidation. Residual-based post-PCA sample rejection, clean-state
  detector-quality selection, and coefficient-based preference directly
  exclude or downweight selected outputs and do not automatically invalidate
  the PCA state or other detectors. The conditioned kernel and incomplete RTC
  causal support/response remain insufficient for new response or uncertainty
  claims.

required_PTC_interface_facts:
  fit_admission:
    eligible_only_nonfinite_admission_conformant: false
    fit_invalid_excluded_before_fitted_state_arithmetic: false
  typed_cause_and_decision_stage:
    fit_invalid_distinguishable: false
    postfit_output_reject_distinguishable: false
    weight_only_distinguishable: false
    exact_representation_engineering_owned: true
  postfit_decisions:
    postfit_quality_selection_requires_PCA_recompute: false
    refit_or_fitted_product_invalidation_trigger: typed_fit_invalid_cause_only
  response:
    conditioned_signal_derived_kernel_present_in_full_output: true
    present_in_mini_output: false
    unconditional_or_local_Jacobian_complete: false
    upstream_RTC_response_complete: false
    response_uncertainty_present: false
    explicit_unavailable_state_present: false
  BEAM_later_route:
    beammap_consumes_PTC_cleaning_and_kernel_boundary: true
    new_beam_or_transfer_claim_supported: false
    BEAM_launched_by_this_record: false

supports:
  - >-
    Preserve VAL existing_use_only and require eligible-only fit admission for
    inputs explicitly typed fit_invalid.
  - >-
    Preserve cause and decision-stage semantics for fit_invalid,
    postfit_output_reject, and weight_only without prescribing representation.
  - >-
    Do not require PCA recomputation merely because a residual, clean-state
    quality decision, or coefficient preference rejects or downweights an
    output after fitting.
  - >-
    Route the unchanged response facts to a future separately launched BEAM
    audit; no new global, extended-source, beam, or response-uncertainty use is
    supported.
does_not_establish:
  - This record does not audit VAL eligibility policy, statistics, or package-wide behavior.
  - It does not close F001 or F002 or establish implementation conformance.
  - It does not require a specific flag encoding, refit mechanism, or invalidation representation.
  - It does not audit or launch BEAM and does not quantify a beam or map bias.
  - It does not authorize repair, validation execution, re-audit, production change, or any target launch.

