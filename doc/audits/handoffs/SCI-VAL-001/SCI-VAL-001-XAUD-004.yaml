summary: >-
  ALIGN's current binary and dilated flags cannot express or reconstruct the
  cellwise sample quality and eligibility state required by VAL.
claim: >-
  At the governing source SHA, the common-slot mask can disagree with numeric
  detector placement at an exact half slot, while later generic flags discard
  whether a value is original, synthesized, unavailable, or original-invalid,
  along with method, reason, source identities, weights, residual, gap action,
  acquired exposure, and strict eligibility.
supports:
  - >-
    VAL should require a typed per-cell origin, validity, method, reason, source,
    and eligibility interface plus exact boundary and round-trip tests.
  - >-
    Current flags may manifest legacy selection, but they cannot establish
    original-only science eligibility or acquired exposure for new claims.
does_not_establish:
  - This record does not choose VAL's cross-stage encoding or selection policy.
  - It does not audit filtering, mapping, calibration, or source estimators.
  - It does not authorize repair, close a VAL finding, or change production state.

