summary: >-
  Current RTC flags protect direct replacement cells but do not encode the full
  validity, mask, edge, non-finite, synthesis, or temporal-influence contract
  required for downstream sample eligibility.
claim: >-
  Despike replacement remains directly flagged and ordinary map population
  skips a flagged payload before inspection. However, RTC filters consume
  flagged/replaced/synthesized/non-finite values without a declared mask
  operator, while downsample flags OR only the corresponding factor-cell block.
  Consequently unflagged values may carry invalid or replacement influence and
  remain eligible. Source-mask coordinate failure becomes an all-false/partial
  unprotected mask; observation-boundary FIR values may remain unchanged and
  unflagged when the optional guard is absent. A finite/unflagged cell is not a
  proof of valid independent RTC exposure.

required_RTC_interface_facts:
  replacement:
    direct_target_flag_retained: true
    donor_links_persisted: false
    calibrated_scale_conformant: false
    direct_science_eligibility: zero_by_frozen_core_pending_owner_decision
  flags_and_validity:
    direct_flag_authority_present: true
    cause_specific_validity_present: false
    transitive_filter_or_donor_influence_present: false
    nonfinite_policy_in_filter_stages_explicit: false
  source_mask:
    coordinate_validity_admitted: false
    invalid_coordinate_behavior: outside_or_unprotected
    fail_closed: false
  edges:
    FIR_first_last_n_terms_overwritten: false
    missing_context_always_flagged: false
    science_profile_edge_guard_explicitly_enabled: false
  downstream_eligibility_boundary:
    direct_flag_skipped_before_payload: true
    eligible_nonfinite_signal_or_kernel_fails: true
    unflagged_temporally_influenced_cell_currently_admissible: true

supports:
  - >-
    Preserve VAL existing_use_only and reject new eligibility/exposure claims
    that equate finite and unflagged with original-valid, independent, or
    response-complete.
  - >-
    Require separate origin, direct validity, influence support, mask cause,
    edge/context, response, numerical validity, and consumer eligibility fields.
  - >-
    Add exact-successor fixtures for replacement, non-finite, source-mask,
    edge/short-scan, filter impulse support, odd/even phase-zero decimation, and
    sequential/OpenMP equivalence before RTC/VAL boundary re-audit.
does_not_establish:
  - This record does not audit VAL package-wide policy, map statistics, or estimators.
  - It does not quantify a map bias or prove that a historical accepted product hit an edge case.
  - It does not authorize repair, test execution, re-audit, or production change.

