summary: >-
  MAP source tracing found Boolean, threshold, non-finite, product,
  provenance, and reconstruction defects and gaps relevant to the upstream
  validity interface.
claim: >-
  At the audited governing SHA, the raw product bundle does not persist an
  authoritative, exactly reconstructible science-valid region, and allowed
  Boolean and non-finite states can disagree with the approved eligibility,
  support, and validity distinctions.
supports:
  - >-
    SCI-MAP-001-F002 records that coverage_bool_I uses the predicate
    !(w < t), which admits zero at the default t=0 and also admits NaN and
    positive infinity, while normalization uses a separate support floor.
  - >-
    SCI-MAP-001-F005 records that non-finite coordinates, kernels,
    multiplicative masks, and coadd inputs can poison output because the
    governing implementation lacks complete finite checks and explicit
    valid-set selection.
  - >-
    SCI-MAP-001-F007 records that hits, the retained-low-confidence state,
    normalization support, science-policy support, authoritative science
    validity, and operator-local computability are absent or conflated in the
    persisted product contract.
  - >-
    SCI-MAP-001-F008 records that provenance does not preserve both threshold
    algorithms, coefficient stages, full-precision realized thresholds,
    comparison and finite policies, required companions, bundle identity, or
    the raw-parent product digest needed for exact reconstruction.
  - >-
    SCI-MAP-001-F011 records that end-to-end persisted pixel, finite-state,
    threshold-boundary, cross-HDU identity, and validity/provenance round-trip
    tests are absent; F013 leaves upstream eligibility and validity semantics
    conditioned on SCI-VAL-001.
  - >-
    Related handoff SCI-MAP-001-XAUD-001 shows a downstream-computable
    guard-band manifestation of the missing distinction between raw science
    validity and operator-local numerical support.
does_not_establish:
  - a raw mapmaking numerical regression
  - that the governing raw Boolean caused the reported guard-band pixel
  - correctness or failure of any SCI-VAL-001 implementation, because none was inspected
  - an upstream flag, replacement, eligibility, or missing-data policy
  - a filtering, noise-realization, variance, response, source, or fruit-loop contract
  - closure of any MAP finding, repaired science validity, or production authorization

