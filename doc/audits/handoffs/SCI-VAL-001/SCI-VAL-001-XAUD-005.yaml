summary: >-
  Existing AST checks exercise configuration wiring and historical
  compatibility but omit the numerical coordinate, WCS, validity,
  uncertainty, identity, simulation, and exact-SHA gates needed for Tier A.
claim: >-
  A bounded AST validation suite must test TAN/inverse-TAN domain and
  round-trip behavior, both wrap directions, support-time precision and
  monotonicity, detector identity and focal-plane composition, WCS
  requested-to-realized identity and handedness, per-variable product units,
  Jacobian/covariance propagation, invalidity propagation, simulations,
  sequential/OMP equivalence, and clean exact-SHA operational products.
supports:
  - Add the frozen AST falsification suite as versioned validation requirements.
  - Record SCI-AST-001-UNITY-001 as outstanding rather than inferring evidence from historical runs.
  - Trigger AST re-audit only after every required local and external gate is returned without skips.
does_not_establish:
  - This handoff does not define VAL estimator semantics outside the AST boundary.
  - Passing current config preflight does not establish any omitted numerical claim.
  - It does not authorize repair, production expansion, or a Unity connection by Codex.

