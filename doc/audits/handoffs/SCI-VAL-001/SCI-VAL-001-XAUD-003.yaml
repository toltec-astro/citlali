summary: >-
  CAL can emit or propagate samples whose calibration factor or detector binding was not proven valid.
claim: >-
  The governing CAL boundary does not consistently reject non-finite or
  out-of-domain coefficients, tau/elevation/transmission, or beam facts, and it
  binds external APT rows to TOD columns positionally without a UID join.
supports:
  - Calibrated eligibility must include factor-domain validity and detector-identity validity.
  - Downstream finite signal or map support cannot retroactively prove a valid CAL operation.
does_not_establish:
  - This record does not choose the cross-stage flag encoding owned by SCI-VAL-001.
  - It does not authorize CAL or VAL repair.

requested_actions:
  - Include CAL factor and detector-join validity in the independent VAL input abstraction.
  - Define fail-closed versus explicit invalidity propagation for each CAL failure scope.
  - Test NaN, infinity, zero, negative, domain, duplicate, missing, and permutation cases.
