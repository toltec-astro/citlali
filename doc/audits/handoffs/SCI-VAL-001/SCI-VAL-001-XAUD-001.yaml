summary: >-
  The approved MAP contract keeps upstream eligibility, estimator
  contribution, exposure, two support decisions, and authoritative science
  validity separate.
claim: >-
  SCI-MAP-001 requires SCI-VAL-001 to provide authoritative sample and
  detector eligibility semantics while MAP separately persists geometric and
  contributing hits, coadd-observation count, upstream-eligible and retained
  exposure, normalization support, science-policy support, and authoritative
  science validity.
supports:
  - >-
    The approved MAP contract distinguishes the geometric projection set G_p,
    upstream-eligible set E_p, and estimator-contribution set I_p rather than
    treating hits, eligibility, and contribution as synonyms.
  - >-
    Normalization support and science-policy support are separate versioned
    decisions with separate algorithm, input, threshold, and comparison
    identities.
  - >-
    Authoritative science validity requires normalization support,
    science-policy support, finite signal and every required companion, and
    admitted product identity including WCS, frame, units, and response.
  - >-
    Retained low-confidence numerical population is distinct from science
    validity, and an operator-local computability mask may never promote a
    science-invalid input.
does_not_establish:
  - the upstream flag, replacement, eligibility, or missing-data policy owned by SCI-VAL-001
  - a JINC-specific signed-contribution predicate owned by SCI-MAP-002
  - serialized product names proposed outside the approved F010 logical contract
  - implementation conformance, filtering validity, or a downstream estimator contract

