summary: >-
  PTC masks, cleaning decisions, and fruit-loop placement consume AST detector
  coordinates without a complete validity, topology, or detector-identity boundary.
claim: >-
  The exact governing AST source can map invalid directions to finite center,
  mishandle one azimuth wrap direction, and apply APT rows without validating
  full detector identity and offset finiteness. PTC must not interpret a
  finite coordinate or a signal flag as AST coordinate validity.
supports:
  - Add a distinct AST coordinate-validity input to PTC selection and feedback interfaces.
  - Exercise singular, wrap, non-finite, detector-order, and seq/OMP interface tests.
  - Restrict new source-protection and fruit-loop coordinate claims until dependency closure.
does_not_establish:
  - This record does not assess mature PTC cleaning algorithms or transfer functions.
  - It does not establish a numerical regression in an accepted PTC run.
  - It does not authorize repair.

