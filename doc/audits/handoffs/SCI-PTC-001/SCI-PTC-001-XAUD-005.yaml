summary: >-
  PTC receives an inner RTC signal/kernel/flag bundle whose calibrated response,
  causal validity support, kernel equivalence, and exact realized provenance
  are nonconformant or unavailable at the governing SHA.
claim: >-
  RTC's inner product follows calibration/extinction, flagged donor replacement,
  FIR/notch/IIR conditioning, phase-zero striding when enabled, post-filter
  flagging/notches, and signal-only alt-az destriping. The kernel follows most
  configured filters and striding but not donor replacement or alt-az
  destriping; flags do not cover the full donor/filter/IIR influence support.
  Approximate PTC weight input fcf records flux_conversion_factor and mean
  extinction but omits APT flxscale, so it is not the complete RTC calibration
  factor. PTC cleaning/weight interpretation must not infer a matched response,
  independent samples, or complete calibration from the present bundle.

required_RTC_interface_facts:
  sample:
    stage_id: inner_RTC_PTC_input
    value_path: post_decimation_post_RTC_masks_post_altaz_destripe
    time_phase: phase_zero_stride_when_downsampled
    exact_support_available: false
    absolute_response_conformant: false
  kernel:
    present_when_requested: true
    matched_to_filter_and_stride_subset: true
    includes_donor_replacement_response: false
    includes_altaz_destripe_response: false
    complete_conditioned_response_available: false
  flags:
    direct_replacement_cells_remain_flagged: true
    downsample_rule: OR_over_each_factor_cell_block
    complete_FIR_IIR_donor_influence_support: false
    cause_specific_provenance_available: false
  transfer:
    conditional_LTI_only: true
    data_dependent_stages:
      - spike detection and donor selection
      - dynamic line selection
      - flag-conditioned alt-az projection
    exact_realized_coefficients_and_state_persisted: false
  calibration_for_weights:
    fcf_contains_flux_conversion_factor: true
    fcf_contains_mean_extinction_factor_when_enabled: true
    fcf_contains_APT_flxscale: false
    complete_factor_identity_available: false

supports:
  - >-
    Keep PTC existing_use_only and fail closed on new absolute weight, transfer,
    covariance, or kernel-response claims until RTC/CAL/ALIGN dependencies and
    RTC findings close at one re-audited successor SHA.
  - >-
    Require PTC admission to distinguish direct flags from temporal/donor
    influence, and to bind every sample, kernel, factor, detector, scan, rate,
    phase, and response identity.
  - >-
    Add focused interface fixtures for unequal calibration factors, donor
    mixing, impulse support, flagged/non-finite influence, matched signal/kernel
    projection, exact factor identity, and sequential/OpenMP equivalence.
does_not_establish:
  - This record does not audit PTC PCA/correlated-mode mathematics or weighting estimators.
  - It does not quantify an astronomical bias or invalidate a particular accepted run.
  - It does not authorize RTC/PTC repair, re-audit, execution, or production expansion.

