summary: >-
  The approved MAP contract treats map and coadd weights as nonprecision
  gridding coefficients unless PTC proves the conditions needed for a
  precision interpretation.
claim: >-
  SCI-MAP-001 requires SCI-PTC-001 to identify the selected weighting or
  covariance object, its normalization and lifecycle, and retained temporal,
  detector, pixel, and cross-observation correlations before a map or coadd
  denominator may be interpreted as inverse variance.
supports:
  - >-
    The ordinary map denominator D_p is a normalization or gridding weight by
    default. It is marginal precision only for one-hot projection, independent
    selected samples, and w_td equal to sigma_td^-2.
  - >-
    The coadd coefficient u_op is a nonprecision gridding coefficient by
    default. Q_p^c is inverse variance only when registered observation errors
    are mutually independent and u_op equals the applicable marginal
    precision.
  - >-
    Precision interpretation requires SCI-PTC-001 proof of the applicable
    weighting, normalization, marginal-precision, independence, and covariance
    conditions. Correlated GLS is deferred, and no coadd precision or
    significance claim is authorized while covariance is unresolved.
does_not_establish:
  - a PTC estimator, correlation model, detector-weight construction, or normalization
  - that any governing map or coadd weight is an inverse variance
  - that map, pixel, detector, temporal, or cross-observation covariance is diagonal
  - an approved GLS implementation, covariance approximation, uncertainty, or significance claim

