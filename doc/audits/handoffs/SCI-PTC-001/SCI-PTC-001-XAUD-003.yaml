summary: >-
  PTC weight inputs do not carry one approved calibration-factor or total-covariance identity.
claim: >-
  The CAL path applies APT flxscale to signal but excludes it from fcf; fcf
  contains the target-unit factor and mean implemented extinction factor, while
  approximate/hybrid PTC weighting combines fcf with APT sens.  CAL supplies no
  common gain, extinction, beam, or template covariance.
supports:
  - Treat fcf and sens as a named CAL-to-PTC factor interface rather than self-evident total precision.
  - Keep PTC weights conditional/statistical until calibration covariance and normalization are approved.
does_not_establish:
  - This record does not audit PTC cleaning or weight estimation.
  - It does not prove that the intended fcf/sens decomposition is numerically wrong.

requested_actions:
  - Record exact fcf, flxscale, sens, and responsivity units, contents, normalization, and reciprocal convention.
  - Test signal/variance/precision scaling and shared calibration covariance under the approved CAL successor.
  - Prevent total-uncertainty or absolute-significance claims while the interface is unresolved.
