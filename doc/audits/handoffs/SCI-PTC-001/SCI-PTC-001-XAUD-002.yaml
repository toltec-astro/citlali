summary: >-
  MAP source tracing found conditional-weight, covariance, provenance, and
  validation gaps whose interpretation depends on the future PTC contract.
claim: >-
  At the audited governing SHA, map and coadd denominators and optionally
  empirical-scaled weight planes lack the PTC covariance authority,
  reproducible lifecycle identity, and validation needed for an inverse-
  variance or significance interpretation.
supports:
  - >-
    SCI-MAP-001-F006 records that formal and optionally globally
    empirical-scaled gridding weights are described as inverse variance even
    though no approved PTC/NOI covariance conditions make that claim
    unconditional.
  - >-
    SCI-MAP-001-F008 records that realized provenance does not preserve the
    weighting or covariance identity, coefficient lifecycle stage,
    per-observation coadd coefficients, retained correlations, or an explicit
    unavailable state needed to reproduce the interpretation.
  - >-
    SCI-MAP-001-F011 records the absence of direct small-matrix A C_n A^T,
    unequal-weight, controlled-correlation, coadd, and persisted
    coefficient/provenance truth tests.
  - >-
    SCI-MAP-001-F013 leaves the PTC weighting/covariance input fact conditioned
    and requires independent diagonal-noise, constant-weight, and correlated
    small-matrix interface tests before MAP precision conclusions can be
    re-audited.
does_not_establish:
  - a defect in any SCI-PTC-001 implementation, because none was inspected
  - the correct PTC estimator, correlation model, weight construction, or normalization
  - the magnitude, stationarity, sparsity, or diagonal form of any covariance
  - that empirical scaling creates a precision or calibrates significance
  - an approved GLS solver, map uncertainty product, or production expansion

