summary: >-
  RTC source masks and coordinate-aware kernels consume AST detector tangent
  positions that presently lack a complete validity and identity contract.
claim: >-
  Invalid spherical directions can be represented as finite near-center
  tangent positions, negative azimuth wrap crossings can be catastrophically
  displaced, and detector offset rows are not admitted against a stable raw
  detector identity. Coordinate finiteness alone cannot authorize RTC source
  selection or kernel placement.
supports:
  - Add AST coordinate validity, frame, sample identity, and detector-row identity as explicit RTC inputs.
  - Test that invalid or unresolved AST coordinates fail closed before RTC source masks or kernels.
  - Restrict new coordinate-dependent RTC claims while AST and ALIGN remain open.
does_not_establish:
  - This handoff does not reopen or assess mature RTC numerical kernels, filtering, or temporal response.
  - It does not prove that a historical accepted RTC product encountered an edge case.
  - It does not authorize repair.

