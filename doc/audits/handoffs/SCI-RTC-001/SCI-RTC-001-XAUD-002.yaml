summary: >-
  RTC receives unbounded synthesized detector values and unstable scan support
  without the mapping, quality, response, covariance, or exposure needed to
  interpret their scientific effect.
claim: >-
  At the governing source SHA, every internal detector gap is bridged and edge
  holes are constant-extrapolated; these finite values enter calibration and
  filtering, whose inspected hot paths do not use the generic gap flags, so
  synthetic endpoints can influence neighboring retained values. Scan creation
  also drops or renumbers valid support, while RTC may clamp inconsistent inner
  cardinality instead of rejecting it.
supports:
  - >-
    RTC should record the realized ALIGN mapping, per-cell origin and validity,
    gap action, scan identity, response, covariance availability, and exposure
    as explicit input dependencies.
  - >-
    New RTC claims treating filled values as acquired or independent samples, or
    current scans as a stable complete partition, should remain restricted.
does_not_establish:
  - This record does not audit or broaden RTC filtering mathematics.
  - It does not prove an end-to-end astronomical bias magnitude.
  - It does not authorize ALIGN or RTC repair or production changes.

