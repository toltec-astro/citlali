summary: >-
  Extinction-enabled OOF and absolute Pointing/OOF amplitudes depend on unresolved CAL correctness and photometric policy.
claim: >-
  Active OOF configurations enable the CAL extinction path affected by F001
  and F002; Pointing/OOF absolute amplitude, significance, and physical
  interpretation also lack approved calibration covariance and
  beam/template/unit meaning.
supports:
  - Treat extinction, calibrated amplitude, beam/template response, and covariance as explicit MODE dependencies.
  - Restrict existing extinction-disabled mJy/beam Pointing use to relative/diagnostic interpretation under verified detector identity.
does_not_establish:
  - This record does not audit Pointing or OOF fitting estimators.
  - It does not determine an OOF surface model or astrometric policy.

requested_actions:
  - Include CAL state and restrictions in the MODE independent input contract.
  - Test recovered amplitude versus airmass and standard-source prediction after CAL repair.
  - Fail closed on extinction-enabled and absolute/significance claims while CAL P0/P1 findings remain open.
