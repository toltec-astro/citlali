summary: >-
  ALIGN supplies AST with telescope values whose topology, units, frame,
  validity, and source mapping are not a complete scientific interface.
claim: >-
  At the governing source SHA, one generic scalar interpolation path is used for
  continuous angles, circular variables, state, counters, and time, with local
  evidence of endpoint clamping; native coordinates and source weights are
  discarded, later observations may retain stale optional fields, and every
  persisted telescope variable is labeled radians.
supports:
  - >-
    AST should record ALIGN as an open input dependency and independently verify
    topology, frame, unit, validity, and source-row identity at its boundary.
  - >-
    New precise pointing or astrometric claims based on the current aligned
    telescope bundle should remain restricted until the interface is repaired
    and re-audited.
does_not_establish:
  - This record does not audit AST coordinate construction or correction estimators.
  - >-
    The locally inspected interpolation dependency is not established as the
    exact production-build dependency identity.
  - This record does not choose telescope field topology or authorize repair.

