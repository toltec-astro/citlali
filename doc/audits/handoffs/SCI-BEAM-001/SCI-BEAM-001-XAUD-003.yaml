summary: >-
  Beammap detector-map consumers receive a kernel that omits an enabled
  signal-conditioning projection and lacks complete detector/scan validity,
  donor influence, calibrated response, and realized RTC provenance.
claim: >-
  The current Beammap profile enables RTC kernel generation and alt-az
  destriping. RTC fits an unflagged-row, detector-local template projection and
  subtracts it from signal only, never from kernel. The same RTC path also uses
  flagged donor replacement and filtering without complete causal validity;
  Beammap source-aware reruns can use previous-fit source centers but do not
  repair the response mismatch. Simulation uses the same sample-population
  boundary without an exact RTC truth/equivalence fixture. Therefore the
  persisted kernel is not the complete realized detector-map response.

required_RTC_interface_facts:
  response:
    configured_kernel_enabled: true
    configured_altaz_destripe_enabled: true
    signal_altaz_projection_applied: true
    kernel_altaz_projection_applied: false
    replacement_response_in_kernel: false
    complete_detector_response_available: false
  detector_and_scan_validity:
    exact_APT_raw_binding_dependency: SCI-AST-001_and_SCI-CAL-001
    aligned_origin_support_dependency: SCI-ALIGN-001
    donor_links_and_influence_support_persisted: false
    scan_context_and_output_stage_fully_persisted: false
  provenance:
    requested_effective_observation_realized_nodes_exist: true
    exact_coefficients_factor_tables_masks_donors_and_product_digests: false
  simulation:
    shared_RTC_path: true
    exact_real_sim_RTC_response_fixture_found: false

supports:
  - >-
    Keep BEAM existing_use_only and fail closed on new beam amplitude, transfer,
    kernel-normalization, detector-response, or uncertainty claims based on the
    current RTC kernel.
  - >-
    Require a matched signal/kernel operator through every enabled conditioned
    linear stage, or mark response unavailable; bind detector, scan, context,
    source coordinate validity, factors, phase, flags, and product digests.
  - >-
    Add exact-successor source-crossing, alt-az-template, impulse, donor,
    invalid-coordinate, edge, real/simulation, and sequential/OpenMP interface
    fixtures before BEAM boundary re-audit.
does_not_establish:
  - This record does not audit BEAM fitting, calibration, source models, or mapmaking mathematics.
  - It does not quantify a recovered beam or flux bias in an accepted run.
  - It does not authorize RTC/BEAM repair, execution, re-audit, or production expansion.

