summary: >-
  Beammap-derived APT calibration requires correct extinction, detector identity, beam/template policy, and propagated uncertainty.
claim: >-
  Beammap computes detector flxscale as source flux divided by a fitted or
  template amplitude and multiplies sens, while CAL's upstream extinction
  factor and detector binding are nonconforming and fit/source/beam uncertainty
  is not propagated through the CAL contract.
supports:
  - Treat source model, fit/template amplitude, extinction, detector identity, and covariance as one Beammap-to-CAL promotion boundary.
  - Keep Beammap-produced APTs diagnostic until that boundary is approved and re-audited.
does_not_establish:
  - This record does not audit Beammap fitting, priors, flagging, or iteration.
  - It does not determine the correct calibrator flux or beam estimator.

requested_actions:
  - Include the Beammap-to-CAL factor and uncertainty lifecycle in the independent BEAM contract.
  - Test source recovery, UID permutation, fit/source/beam covariance, and observation-order independence.
  - Prevent promotion of derived flxscale or sens to calibration authority while CAL findings remain open.
