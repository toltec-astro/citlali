summary: >-
  The current ALIGN output does not implement the complete ordered sample
  identity required by the bounded approved CAL consumer decision supplied in
  the governing ALIGN prompt.
claim: >-
  At the governing source SHA, CAL cannot recover exact original detector row
  identity, trustworthy common timestamps and elevation validity, acquired
  duration, gap and interpolation origin, or original-versus-synthesized
  eligibility from the aligned values, binary masks, scan indices, exposure,
  and provenance that ALIGN supplies.
supports:
  - >-
    CAL should treat the current ALIGN interface as an open scientific
    dependency, not as a complete approved sample-identity contract.
  - >-
    New CAL claims requiring exact ordered identity, acquired duration, or
    original-only eligibility should remain restricted pending ALIGN repair and
    re-audit.
does_not_establish:
  - This record does not audit or revise any CAL estimator equation.
  - >-
    It does not import unrelated CAL operational decisions into ALIGN, close a
    CAL finding, authorize repair, or change production state.
  - It does not establish external raw clock or header semantics.

