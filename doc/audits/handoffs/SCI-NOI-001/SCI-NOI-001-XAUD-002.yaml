summary: >-
  Owner-approved FLT restrictions that bound how NOI-001 may characterize an
  ensemble while reserving empirical-estimator validity to NOI-002.
claim: >-
  FLT requires identical realized operator identity and full realization
  provenance, retains direct pixelwise jackknife variance and S/N as
  diagnostics pending NOI-002, and reserves aperture uncertainty to blank
  apertures or a future compact NOI-002 product; it authorizes neither a
  spatial empirical model, full covariance matrix, long-term realization-stack
  requirement, nor independent-pixel aperture summation.
supports:
  - >-
    Require NOI-001 to characterize only ensemble adequacy and provenance,
    with downstream estimator and product validity reserved to NOI-002.
  - >-
    Carry the exact realized filtering operator as a conditional propagation
    interface when filtering is assessed.
does_not_establish:
  - scientific validity of a variance, weight, S/N, confidence, or feedback product.
  - an aperture-uncertainty estimator or production realization-count/default policy.
  - a new FLT implementation requirement, repair, evidence run, or re-audit closure.

