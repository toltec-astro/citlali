summary: >-
  Current signed map realizations reuse coefficient-weighted PTC-cleaned data
  and do not constitute independent noise draws, retained covariance, or a
  calibrated significance model.
claim: >-
  Naive map noise paths multiply the same PTC-cleaned, per-detector
  coefficient-weighted signal by signs while ordinary PTC cleaning has already
  introduced data-dependent temporal and inter-detector correlation. PTC
  supplies neither retained conditional/full covariance nor fitted-state,
  calibration, response, or cross-observation uncertainty. The scalar
  detector coefficients are nonprecision and the realized selection/random
  state is incompletely persisted. Signed outputs may remain existing bounded
  realizations, but they are not authority for independent draws, a noise
  covariance, inverse variance, calibrated significance, or uncertainty
  coverage.

required_PTC_NOI_interface_facts:
  input_signal: PTC_cleaned_data_dependent_timestream
  coefficient_shape: per_detector_scalar
  coefficient_is_precision: false
  temporal_and_inter_detector_correlation_induced: true
  retained_conditional_covariance_present: false
  fitted_selection_and_response_uncertainty_present: false
  sign_path_reuses_same_weighted_signal: true
  independent_noise_draw_established: false
  calibrated_significance_established: false
  realized_random_and_selection_state_complete: false

supports:
  - >-
    Preserve NOI existing_use_only and prohibit new covariance, independent-draw,
    inverse-variance, calibrated-significance, or uncertainty-coverage claims
    for current PTC-derived signed products.
  - >-
    Require an approved coefficient/covariance contract, exact realized PTC
    state, random/sign identity, and covariance-aware fixtures before a future
    NOI audit may expand interpretation.
does_not_establish:
  - This record does not audit NOI package-wide estimators, randomization policy, or products.
  - It does not prove a historical signed realization failed a specific empirical tolerance.
  - It does not authorize PTC or NOI repair, validation, re-audit, integration, or production change.

