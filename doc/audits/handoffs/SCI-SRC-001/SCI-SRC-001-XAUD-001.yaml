summary: >-
  Source positions are transformed through inverse TAN while their reported
  coordinate errors are only scalar unit-converted, without the inverse-map
  Jacobian or cross-covariance.
claim: >-
  At map center a one-arcsecond tangent-x error corresponds to about two
  arcseconds of RA at declination 60 degrees and 5.76 arcseconds at 80
  degrees, but the traced boundary reports one arcsecond in both cases. The
  AST projection domain, WCS frame, validity, and covariance availability must
  therefore remain explicit inputs to source inference.
supports:
  - Open a source-position uncertainty/interface finding and AST dependency.
  - Test inverse-TAN mean and full covariance propagation across declination and wrap.
  - Restrict precision, uncertainty-coverage, and catalog-coordinate claims using current scalar errors.
does_not_establish:
  - This record does not audit source detection, fitting likelihood, photometry, deblending, or completeness.
  - The one-arcsecond examples are local Jacobian probes, not astronomical recovery evidence.
  - It does not authorize repair.

