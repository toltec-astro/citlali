summary: >-
  Every current PTC detector weight family is a nonprecision gridding
  coefficient, while the stored kernel and scalar weights omit the covariance
  and response authority needed for new MAP significance claims.
claim: >-
  The governing source constructs approximate, full, hybrid, validated, and
  constant per-detector scalar coefficients, with optional correlation and
  busy-row penalties. No family constructs temporal, inter-detector, or
  cross-observation precision; factor identity, units, normalization, and
  lifecycle are incomplete, and the constant family is dimensionless despite
  a universal inverse-signal-squared file attribute. Naive, JINC, and ML paths
  consume the coefficients in signal/kernel normalization or system rows. The
  kernel is only a conditioned partial response and PTC publishes no retained
  covariance. Those consumers cannot upgrade the inputs to inverse variance,
  formal precision, response-complete normalization, or significance.

required_PTC_MAP_interface_facts:
  coefficient_shape: per_detector_scalar
  coefficient_families:
    - approximate
    - full
    - hybrid
    - validated
    - constant
  temporal_precision_present: false
  inter_detector_precision_present: false
  cross_observation_precision_present: false
  retained_PTC_covariance_present: false
  coefficient_family_and_normalization_persisted_completely: false
  universal_file_unit_valid_for_constant_family: false
  conditioned_kernel_present_in_full_output: true
  unconditional_response_or_uncertainty_present: false
  direct_consumers:
    - naive_MAP_numerator_denominator_and_kernel
    - JINC_basis_normalization_and_kernel
    - ML_linear_system_rows

supports:
  - >-
    Preserve the MAP rule that PTC/coadd values are nonprecision coefficients
    unless exact factor, normalization, lifecycle, marginal-precision, and
    independence or full-covariance conditions are proved.
  - >-
    Keep MAP existing_use_only and prohibit new inverse-variance, significance,
    response-complete, or covariance interpretations of current denominators
    and weight attributes.
  - >-
    Require typed coefficient family/units/normalization/lifecycle plus explicit
    conditioned-response and covariance availability before MAP re-audit.
does_not_establish:
  - This record does not re-audit the MAP estimator, JINC, ML, coaddition, or map products.
  - It does not quantify a map bias or invalidate a particular accepted map.
  - It does not authorize PTC, CAL, or MAP repair, re-audit, integration, or production expansion.

