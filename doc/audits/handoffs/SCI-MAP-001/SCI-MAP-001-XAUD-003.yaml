summary: >-
  The governing AST implementation can emit finite-invalid tangent positions
  at the TAN singular/back hemisphere, mis-handle one azimuth wrap direction,
  and accept WCS controls that are not realized.
claim: >-
  MAP consumes AST tangent coordinates and WCS identity for geometry,
  accumulation, FITS publication, and feedback-map admission. A finite map
  center is therefore not sufficient evidence of a valid AST coordinate, and
  current WCS round-trip checks do not establish the frozen AST domain or
  requested-to-realized identity.
supports:
  - Record AST as an open MAP dependency for coordinate validity and WCS identity.
  - Add finite-validity, projection-domain, handedness, CRPIX/CRVAL, and rejected-control interface tests.
  - Hold new precise MAP geometry or WCS interpretation for MAP re-audit.
does_not_establish:
  - This handoff does not re-audit the MAP estimator, normalization, covariance, or coaddition.
  - The conforming generated-map x reversal and zero/one-based CRPIX conversion are not challenged.
  - This handoff does not authorize an AST or MAP repair.

