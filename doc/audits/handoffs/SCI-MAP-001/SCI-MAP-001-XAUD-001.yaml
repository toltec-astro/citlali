summary: >-
  A reproducible convolve characterization exposed a downstream-computable
  guard-band pixel outside the reconstructed raw science-valid region.
claim: >-
  The current raw-map product vocabulary did not give the downstream operator
  an authoritative, reproducible distinction between raw scientific validity
  and operator-local numerical computability.
supports:
  - >-
    The filtering-disabled control and filtering-enabled candidate had 15
    common raw products with zero changed, zero skipped, and no set difference
    under a strict bitwise comparison that included timestreams.
  - >-
    In a2000, a filtered pixel outside the reconstructed raw science-valid
    region but inside convolution support had direct empirical S/N about
    -165.7 and filtered coverage_bool true.
  - >-
    Eight of the nine a2000 pixels with direct filtered absolute S/N above 5
    were in that guard band.
  - >-
    A downstream operator can be numerically computable where its raw input is
    not scientifically valid, so those states require separate contracts.
does_not_establish:
  - a raw mapmaking numerical regression
  - correctness of the raw estimator, mask, weight, covariance, or coadd
  - validity of the filtering or empirical-noise estimator
  - an approved filtering boundary, response, variance floor, or source statistic
  - closure of any SCI-MAP-001 finding or production authorization

