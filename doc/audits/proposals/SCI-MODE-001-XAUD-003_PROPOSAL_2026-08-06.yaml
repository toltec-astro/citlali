  - retain_Pointing_noise_products_as_existing_use_only_pending_contract
  - keep_Pointing_fit_coefficient_labeled_nonprecision
  - preserve_OOF_disabled_effective_zero_no_work_semantics
  - avoid_inferring_count_adequacy_from_standard_configuration
