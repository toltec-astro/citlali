summary: >-
  Standard Pointing actively requests five detector-coherent realization maps
  and applies the globally scaled nonprecision coefficient, whereas standard
  OOF disables noise maps and its configured count one is inert.
claim: >-
  Pointing count five is a configuration value, not an adequacy result or
  default decision for filtered pixels, Gaussian fits, or parameter errors.
  Under the binding disabled-lane policy, OOF resolves to effective count zero
  and performs no noise-product work; its stored count one has no operational
  or scientific meaning while disabled.
