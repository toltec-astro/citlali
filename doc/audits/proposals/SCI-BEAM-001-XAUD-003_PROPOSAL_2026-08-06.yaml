summary: >-
  Standard Beammap noise maps are owner-disabled with effective count zero and
  no work; only an explicitly enabled optional v4-compatible use would become
  a recipient of NOI-002 estimator, filtered-pixel, and count restrictions.
claim: >-
  The configured disabled count ten and normalize-errors value are inert in
  standard Beammap. They are not a default, requirement, adequacy threshold,
  operational expectation, or evidence request. If an owner explicitly
  enables the optional capability, its 1/R stack scatter and scalar-scaled
  nonprecision coefficient do not establish detector-fit precision,
  point-source/aperture uncertainty, or count adequacy.
