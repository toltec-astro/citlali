summary: >-
  A narrow current interface subtracts the loaded fruit map, cleans and
  weights the source-subtracted state, populates noise maps before source
  readdition, and then restores the source for the science-map pass.
claim: >-
  At exact application SHA d5015fe716971bf8ea617e8a187311bf5af05185,
  when fruit loops are enabled and a map is loaded, the Lali and Pointing
  paths expose a final pre-readdition state that is structurally capable of
  the R3 residual ensemble. The later final science-map pass suppresses a
  second noise population. The product/provenance does not establish an
  approved residual ensemble identity, source-model identity, unbiasedness,
  or protection against model absorption of physical noise.
