contract_disposition:
  SCI-NOI-002-RA-B001:
    status: open
    reason: >-
      Explicit nonrecursive membership and atomic rename exist, but publication
      initialization, iteration scope, semantic/member reconciliation, exact
      joins, non-symlink safety, split selection, and aggregate identity remain
      nonconformant.
  SCI-NOI-002-RA-B002:
    status: open
    reason: >-
      Available-zero serialization validates on basic records, but disabled
      packages may contain stack-derived products, and literal requested-enabled
      zero is accepted when mapmaking disables execution.
  SCI-NOI-002-RA-B003:
    status: open
    reason: >-
      Expected and realized fields are separate, but current-run/iteration
      ownership, partial publication, and split selection accounting are not
      truthfully reconciled.
  SCI-NOI-002-RA-B004:
    status: open
    reason: >-
      Fail-closed reasons and NaN masking exist, but production supplies a
      hard-coded unity response and raw-parent policy support instead of actual
      calculated response and filtered support.
  SCI-NOI-002-RA-R001:
    status: open
    reason: >-
      Candidate-added canonical HDUs were removed, but two compatible legacy
      HDUs retain the same physical coefficient-standardized plane and
      duplicate canonical identities are not rejected.
  SCI-NOI-002-RA-R002:
    status: implementation_pass_validation_incomplete
    reason: >-
      Stored names, calculations, and value bindings are unchanged and comments
      are corrected without duplicate variables; exact regression assertions
      are incomplete.

