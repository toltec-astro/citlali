      plus offsets; flags evolve separately. The kernel follows the filter and
      stride subset but omits donor replacement and P_X.
    positive_controls:
      - typed requested/effective/observation-resolved/realized state skeleton
      - downsampling rejected when filtering is disabled
      - filter high frequency rejected above output Nyquist
