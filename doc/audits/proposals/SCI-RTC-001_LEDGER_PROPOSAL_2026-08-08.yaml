package:
  id: SCI-RTC-001
  name: Raw-timestream conditioning interface and temporal response
  tier: B
  scientific_scope: >-
    Conditioning of aligned detector timestreams through calibration,
    extinction, despiking/replacement, FIR/IIR/notch stages, source protection,
    downsampling, response/kernel/flags, temporal support, output products,
    provenance, and bounded PTC/VAL/BEAM input contracts.
  inputs:
    - admitted ALIGN common-grid samples with exact detector, scan, origin, validity, and support identity
    - approved CAL factor table, opacity/airmass operator, APT binding, responsivity convention, and validity
    - approved AST coordinate/frame/validity and detector-row binding
    - selected RTC request plus observation-resolved rate, context, mask, and output state
  outputs:
    - explicitly staged conditioned TOD with rate, phase, representative time, and causal support
    - matched response/kernel or explicit response unavailability
    - typed direct validity, cause flags, influence support, eligibility, diagnostics, and covariance availability
    - lossless requested/effective/observation-resolved/realized provenance and product links

  upstream_dependencies:
