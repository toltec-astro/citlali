        Exact aligned detector and telescope sample mapping, origin/validity,
        synthesis/gap action, scan identity, timing residual, support,
        response/covariance availability, and eligibility.
      consequence: >-
        RTC exact timing/support and new response claims remain conditioned.
    - package_id: SCI-CAL-001
      status: active_repair_from_governing_SHA
      finding_id: SCI-RTC-001-F009
      required_contract: >-
        Complete factor identity, top-of-atmosphere opacity/airmass operator,
        detector/APT binding, responsivity convention, validity, and uncertainty.
      consequence: >-
        Absolute calibration, replacement conversion, photometry, and response
        fail closed for new claims.
    - package_id: SCI-AST-001
      status: repair_held_behind_ALIGN
      finding_id: SCI-RTC-001-F010
      required_contract: >-
