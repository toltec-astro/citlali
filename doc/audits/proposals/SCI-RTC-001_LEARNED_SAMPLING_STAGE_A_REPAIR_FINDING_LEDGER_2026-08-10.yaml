      recommendation: prohibited
      acceptance: prohibited
      rejection: prohibited
    later_learned_plan:
      stage_a_scope: false
      jointly_selects:
        - m
        - factor_specific_fir
      inputs:
        - cadence
        - scan_motion
        - diffraction_beam
        - astronomical_transfer_requirements
        - approved_representative_detector_noise_psd
