decision_resolutions:
  - decision_id: RTC-STAGE-A-HWPR-MOTION-ELIGIBILITY
    related_findings:
      - RTC-A-003
      - RTC-A-004
      - RTC-A-009
      - RTC-A-010
    policy_status: owner_resolved
    implementation_status: open
    validation_status: not_started
    state_contract:
      distinct_states:
        - requested
        - effective
        - realized
      physical_input_or_file_presence_implies_enabled: false
    non_hwpr_routing:
      applies_when:
        - hwpr_absent
        - hwpr_explicitly_ignored_by_effective_observation_plan
      contract: approved_non_hwpr_v95_eligibility_and_candidate_contract
    enabled_hwpr_routing:
      scientific_basis: >-
        Telescope v95 and the diffraction beam alone do not define the
        astronomical passband because RTC precedes mapmaking and polarized
        signal can occupy the 4*f_HWPR carrier plus scan-induced sidebands.
      dependent_metric_status: unavailable
      stable_reason: unavailable_hwpr_sampling_contract
      non_hwpr_one_arcsec_per_second_rule_applies: false
      telescope_only_candidate_range_applies: false
      factor_one_identity_plan:
        retained_as: provenance_and_reference
        hwpr_dependent_metrics: unavailable
        sampling_recommendation: false
    future_enablement_authority_required:
      - authoritative_rotation_frequency_and_phase_support
      - validity_and_gap_handling
      - four_times_hwpr_frequency_convention
      - scan_sideband_extent
      - combined_beam_fir_modulation_decimation_transfer
      - enabled_polarimetry_validation_dataset_and_product_gate
    current_scientific_status: >-
      enabled_polarimetry_and_hwpr_unavailable_pending_scientific_contract_and_reference_gate
    non_authorizations:
      - hwpr_correction
      - hwpr_threshold
      - hwpr_candidate_selection
      - production_behavior_change

