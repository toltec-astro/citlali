      name: existing_filter_counterfactual
      stage_a_synthesizes_filter_per_m: false
      binding: each_enumerated_m_and_phase_to_observation_effective_realized_rtc_filter
    filtering_disabled:
      coefficient_vector:
        - 1
      identity: explicit_identity_filter
      dormant_settings_consumed: false
    required_per_m_state:
      - coefficient_vector
      - coefficient_digest
      - configured_filter_parameters
      - requested_filter_state
      - effective_filter_state
      - realized_filter_state
      - exact_m_phase_filter_binding
      - relevant_filter_and_observation_identity_and_provenance
    required_characterization:
      - approved_astronomical_transfer
      - bounded_aliasing
      - stopband_characterization
      - other_approved_stage_a_metrics
      - obviously_poor_combinations
    interpretation:
      poor_result_means: m_performs_poorly_with_filter_realized_for_this_observation
      m_is_scientifically_unsuitable: not_established
      best_achievable_with_appropriate_antialias_filter: not_estimated
      explicit_in_product_contract_and_provenance: true
    selection_semantics:
