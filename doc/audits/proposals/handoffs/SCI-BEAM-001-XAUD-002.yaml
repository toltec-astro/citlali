summary: >-
  Beammap detector coordinates depend on unverified APT row identity and AST
  coordinate validity, and final TOD metadata can mislabel non-angular telescope fields.
claim: >-
  The APT reader requires columns and an altaz label but does not validate
  x_t/y_t size or finiteness, UID uniqueness, or exact APT-to-raw detector-row
  identity before index-wise detector pointing. Beammap final TOD rewrites
  detector positions through the same AST operator, while generic telescope
  variables are all labeled radians.
supports:
  - Add AST/ALIGN detector identity, APT basis, coordinate validity, and product-unit dependencies.
  - Test APT permutation/duplication/non-finite cases and final TOD coordinate/unit round trips.
  - Restrict new detector-coordinate or astrometric Beammap claims until re-audit.
does_not_establish:
  - This record does not audit Beammap fitting, photometry, priors, or detector selection.
  - Historical exact Beammap product compatibility is not proof of the missing identity contract.
  - It does not authorize repair.

