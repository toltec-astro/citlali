summary: >-
  Pointing and OOF coordinate means cross the AST inverse-TAN boundary, but
  positional errors and provenance do not carry the corresponding Jacobian,
  covariance, support precision, or frame identity.
claim: >-
  Current Pointing table columns named x_t/y_t become absolute RA/Dec degrees
  for RA/Dec maps while their errors receive only arcsecond-to-degree scaling.
  MODE must distinguish tangent offsets, spherical coordinates, formal fit
  covariance, and astrometric correction uncertainty.
supports:
  - Record an AST dependency for Pointing/OOF coordinate and uncertainty interpretation.
  - Add declination, wrap, support-time, frame, and covariance interface tests.
  - Restrict absolute-coordinate precision and coverage claims from current table errors.
does_not_establish:
  - This handoff does not audit Pointing/OOF map fitting, focus models, or mode estimators.
  - Formal fit error is not shown to equal astrometric correction uncertainty.
  - It does not authorize repair.

