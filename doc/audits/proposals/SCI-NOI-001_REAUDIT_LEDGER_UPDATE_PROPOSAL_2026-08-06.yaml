closure_blockers:
  - id: SCI-NOI-001-REAUDIT-B001
    mapped_findings:
      - SCI-NOI-001-F002
      - SCI-NOI-001-F005
    class: required_validation_boundary_nonconformance
    evidence_basis: observed_static_source_and_direct_compatibility_probe
    confidence: high
    summary: >-
      The repaired application emits citlali-noise-products-provenance-v2,
      the versioned SHA256/SplitMix counter identity, and available-zero
      disabled cardinalities, while the active reduction auditor admits only
      v1, requires the retired mt19937 identity, and requires disabled counts
      to be unavailable.
    consequence: >-
      An exact-candidate run audited with required noise-products provenance
      is rejected even when the repaired output is correct; F002 and F005
      cannot close end to end.
    bounded_successor_gate:
      - admit_and_semantically_validate_v2_with_any_intentional_v1_compatibility
      - validate_compact_policy_partition_order_completion_mode_and_digest_joins
      - validate_disabled_available_zero_counts_suppressed_promises_and_zero_work
      - add_enabled_and_disabled_v2_baseline_regressions
      - retain_and_compare_new_noise_identity_FITS_cards
      - rerun_proportionate_local_gates_and_fresh_narrow_reaudit
    does_not_require:
      - application_algorithm_change
      - dense_sign_or_correlation_products
      - estimator_or_count_policy
      - astronomical_evidence
      - Unity
      - local_reduction
      - production_change

