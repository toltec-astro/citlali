      restricted diagnostics in which deterministic signal may remain and
      negative-source realizations are permitted.
  - id: SCI-NOI-001-F005
    current_status: open
    proposed_status: open
    disposition: retain_open_pending_required_validator_repair_and_reaudit
    basis: >-
      Config and execution code correctly reject enabled zero, force disabled
