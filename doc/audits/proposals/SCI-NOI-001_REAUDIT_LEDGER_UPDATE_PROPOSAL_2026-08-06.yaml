    disposition: close_explicit_opt_in_deterministic_lifecycle_scope
    basis: >-
      Beammap signs are populated once per named pass/iteration before active
      buffer reset and pass order/history tests are stable; standard Beammap
      remains disabled and its configured count is inert.
  - id: SCI-NOI-001-F007
