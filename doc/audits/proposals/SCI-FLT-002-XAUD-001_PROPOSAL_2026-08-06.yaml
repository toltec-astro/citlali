summary: >-
  The Wiener/low-pass interface can calculate noise products and force the
  same-stack scalar coefficient rescale through normalize_errors, then expose
  two inequivalent filtered S/N-like maps and a pixelwise point-source label.
claim: >-
  At exact d501, normalize_errors can apply a globally scaled nonprecision
  coefficient even when the ordinary empirical-apply flag is false. The
  coefficient-standardized and direct-stack ratios are unequal unless the
  formal coefficient times stack scatter is spatially constant, and neither
  statistic establishes a null tail, template response, or aperture error.
