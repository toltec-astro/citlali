summary: >-
  The current NOI-001 realization stack feeds variance, empirical coefficient,
  S/N, source-threshold, coadd/filter/source-finding, point-source, and fruit
  feedback products whose estimator and production validity belongs solely to
  SCI-NOI-002.
claim: >-
  At exact application SHA d5015fe716971bf8ea617e8a187311bf5af05185,
  calc_noise_products forms a mean-subtracted one-over-N pixel stack variance,
  derives a global median-based coefficient scale, can replace the map
  coefficient before coadd/filter/source finding, and publishes or supplies
  pixel S/N, point-source uncertainty/S/N, median realization RMS, and fruit
  S/N feedback inputs. The ordinary current ensemble includes deterministic
  signal, and observation sign prefixes repeat because the fixed RNG seed is
  reset without an observation namespace.
