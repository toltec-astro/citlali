summary: >-
  Exact d501 globally rescales the MAP nonprecision coefficient from the
  median product of coefficient and centered 1/R stack scatter, while its
  filtered point-source uncertainty remains a pixel diagonal rather than an
  aperture or template covariance.
claim: >-
  The scalar operation can establish only an in-sample global scale
  functional of the existing nonprecision pattern. It cannot establish a
  marginal inverse variance, full precision, filtered correlation shape, or
  response-corrected aperture uncertainty; the latter requires the exact FLT
  operator and a complete consumer projection.
supports:
  - retain_one_global_empirical_scale_only_as_nonprecision_diagnostic
  - keep_direct_filtered_pixel_scatter_separate_from_aperture_uncertainty
  - require_exact_filter_response_and_raw_parent_identity_for_any_stronger_claim
  - prefer_blank_aperture_or_compact_covariance_method_when_separately_validated
does_not_establish:
  - filter_response_normalization_or_edge_semantics
  - physical_noise_covariance_or_precision
  - point_source_photometric_or_aperture_uncertainty
  - numerical_tolerance_evidence_request_repair_or_production_admission

