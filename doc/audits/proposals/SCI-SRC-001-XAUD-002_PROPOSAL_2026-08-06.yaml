summary: >-
  Source detection, Gaussian fitting, filtered pixel products, and the source
  table consume different coefficient- or map-scale statistics that currently
  share S/N-like interpretation without one common null or error law.
claim: >-
  Exact d501 finds sources from signal times square root of the live
  nonprecision coefficient, uses the coefficient in fitting, and reports a
  table ratio of fitted amplitude to whole-map standard deviation. Those
  statistics differ from both noise-stack pixel ratios, and none is a
  selection-corrected significance or fit-amplitude uncertainty by construction.
supports:
  - inventory_each_source_statistic_and_fit_weight_separately
  - add_SCI-NOI-002_and_relevant_FLT_dependencies
  - require_null_search_multiplicity_and_selection_contract_for_significance
  - keep_nonprecision_map_coefficient_distinct_from_fit_precision
