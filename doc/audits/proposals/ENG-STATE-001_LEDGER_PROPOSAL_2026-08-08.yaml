positive_controls:
  - id: ENG-STATE-001-PC001
    claim: >-
      ReductionSession owns an explicit ready/running/succeeded-or-failed
      lifecycle and returns structured ReductionResult failures.
    evidence_paths:
      - include/citlali/core/session/reduction_session.h
      - include/citlali/core/session/reduction_result.h
  - id: ENG-STATE-001-PC002
    claim: >-
      Runtime and configuration-source provenance record requested/effective/
      realized state and SHA-256 input/merged-config identities atomically.
    evidence_paths:
      - include/citlali/core/pipeline/runtime_provenance_output.h
      - include/citlali/core/pipeline/config_source_manifest.h
      - include/citlali/core/pipeline/atomic_yaml_output.h
      - tools/baseline/audit_reduction_run.py
  - id: ENG-STATE-001-PC003
    claim: >-
      Enabled required-product failures use a typed output error that maps to
      a structured output_failed session result.
    evidence_paths:
      - include/citlali/core/pipeline/required_output_failure.h
      - include/citlali/core/session/reduction_result.h
      - validation/product_contracts.json
findings:
  - id: ENG-STATE-001-F001
    class: evidence_gap
    severity: P1
    basis: observed
    status: open
    summary: >-
      The authorized static caller census found definitions but no call sites
      for TimestreamOutputWriters::rethrow_if_failed or verify_complete.
    consequence: >-
      Static evidence cannot prove that every required asynchronous timestream
      write is checked before successful completion and provenance publication.
    scope_limited: true
  - id: ENG-STATE-001-F002
    class: evidence_gap
    severity: P1
    basis: observed
    status: open
    summary: >-
      The final CLI boundary is outside the approved source set, so final
      exit/reporting disposition for structured reduction failures is unassessed.
    consequence: >-
      Required-output-to-CLI propagation is unconfirmed at the governing SHA.
    scope_limited: true
proposed_status_axes:
  contract_status: not_started
  implementation_status: not_assessed
  validation_status: not_started
  production_status: existing_use_only
  verdict: pending
  effect: unchanged
proposed_coordinator_disposition: >-
  Accept this static Tier C package as coordinator-ready; retain both findings
  open, preserve all scientific contracts, consumer restrictions, and status
  axes, and authorize no validation execution or repair from this proposal.
proposed_next_gates:
