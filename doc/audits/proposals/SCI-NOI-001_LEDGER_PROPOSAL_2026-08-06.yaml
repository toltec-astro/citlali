  open_findings:
    - id: SCI-NOI-001-F001
      class: implementation_defect
      severity: P1
      evidence_basis: observed_static_source_and_derived_R3_consequence
      confidence: high
      status: open
      owner: noise_RNG_and_realization_identity
      summary: >-
        Fixed seed 5489 is recreated per ordinary observation or fruit
        iteration without observation or realization namespaces, so
        equal-shaped observations repeat sign prefixes and cross-observation
        independence cannot be assumed.
      closure_gate: >-
        Approve a versioned compact key and namespace policy, establish
        collision/repeat and sequential/OpenMP fixtures, publish reconstruction
        facts and digest, and re-audit an exact successor SHA.
    - id: SCI-NOI-001-F002
      class: contract_gap
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: noise_provenance
      summary: >-
        Current sidecars and digests do not reconstruct exact assignments,
        distinguish ensemble mode, or record completed realization IDs and
        partial failure.
      closure_gate: >-
        Publish compact algorithm/version, seed/key derivation, coherence
        partition, stable ordering, assignment policy, completion IDs, mode,
        and digest joins, or classify any remaining gap; dense streams, sign
        vectors, and N-by-N matrices are not required.
    - id: SCI-NOI-001-F003
      class: contract_gap
      severity: P1
      evidence_basis: observed_static_source_and_R3_derivation
      confidence: high
      status: open
      owner: product_identity_NOI-002_and_FRUIT-001
      summary: >-
        The current ensemble contains deterministic signal; negative
        realization HDUs can show an anti-source and second moments can show
        source imprint, while the conditional fruit residual path is not an
        approved named ensemble product.
      closure_gate: >-
        Bind current/residual identity to products, preserve the R3 bias trade,
        obtain NOI-002 and FRUIT-001 dispositions, and pass admitted exact-SHA
        source/blank-region evidence without invented tolerances.
    - id: SCI-NOI-001-F004
      class: implementation_defect
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: SCI-FLT-001_operator_and_provenance
      summary: >-
        Filter science preprocessing includes a science-derived affine
        background term omitted from realization preprocessing.
      closure_gate: >-
        FLT approves identical or explicitly affine semantics, publishes the
        realized choice and parent join, passes zero/nonzero-background paired
        fixtures, and returns a conditioned exact-SHA disposition.
    - id: SCI-NOI-001-F005
      class: implementation_defect
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: noise_configuration_and_lifecycle
      summary: >-
        Enabled zero realizations are admitted although diagnostics and
        required empirical products cannot safely realize that state.
      closure_gate: >-
        Approve positive-count admission or complete zero-stack semantics,
        validate requested/effective/realized/product/write paths, and re-audit
        without selecting a production count in NOI-001.
    - id: SCI-NOI-001-F006
      class: dependency_gap
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: SCI-NOI-002
      summary: >-
        The stack feeds variance, empirical coefficient scale, S_N products,
        source thresholds, coadd/filter/source finding, and fruit feedback
        without NOI-002 authority.
      closure_gate: >-
        NOI-002 decides normalization, variance/weight formula, labels,
        S_N/significance/threshold/feedback/aperture use, and production count;
        then consumers receive dispositions and are re-audited as needed.
    - id: SCI-NOI-001-F007
      class: evidence_gap
      severity: P1
      evidence_basis: observed_absence
      confidence: high
      status: open
      owner: coordinator_and_human_evidence_operator
      summary: >-
        No exact-d501 runtime evidence establishes empirical sign law, Q,
        effective uniqueness, cross-observation behavior, source imprint,
        filter identity, or repeatability.
      closure_gate: >-
        Coordinator admits a bounded request under FRAMEWORK-NUM-001 where
        costly, a human returns the complete exact-SHA bundle, and independent
        review applies preapproved acceptance criteria.
    - id: SCI-NOI-001-F008
      class: implementation_defect
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: Beammap_RNG_and_realization_identity
      summary: >-
        Beammap regenerates and overwrites all PTC sign arrays once per active
        map slot, making retained assignments depend on active-map, pass, and
        iteration history.
      closure_gate: >-
        Approve generation scope and identity, bind it compactly to completed
        products, test active-map/pass permutations and repeats, condition JINC
        cases on SCI-MAP-002, and re-audit.

