  implementation_assessment:
    governing_source: nonconformant_to_R3_proposed_contract
    conforming_subcontracts:
      - Exact finite signs are in the target set minus one and plus one.
      - Ordinary naive Stokes-I applies the sign at the fixed map contribution boundary.
      - Science and realization maps share eligibility, coefficient, projection, map support, normalization, and fixed observation coadd structure.
      - JINC contains corresponding sign multiplication and shared deposition, conditioned entirely on SCI-MAP-002.
      - Required noise and map-product write failures propagate rather than being silently ignored.
      - Final map-bundle digests verify science, weight, kernel, realization, support, validity, and coadd-admission bytes.
    nonconforming_or_open_subcontracts:
      - Ordinary observations recreate fixed MT19937 seed 5489 and repeat equal-shape prefixes without observation namespaces.
      - No compact exact assignment reconstruction, mode, stable ordering digest, or completed-realization identity is published.
      - Current realizations contain deterministic signal and can produce literal anti-source realization HDUs and signal-imprinted second moments.
      - Filter science edge preprocessing is affine while realization preprocessing omits the background term.
      - Enabled zero realizations are admitted despite unsafe or impossible downstream diagnostics and required products.
      - Empirical variance, coefficient rescaling, S_N, threshold, source, and feedback consumers lack NOI-002 disposition.
      - Exact-SHA empirical sign, Q, uniqueness, cross-observation, source-imprint, filter, and repeatability evidence is absent.
      - Beammap retained assignments depend on active-map reset overwrite history rather than a named key.
    consequence: >-
      Correct single-observation operator propagation does not establish the
      requested randomization identity, cross-observation covariance law,
      compact reproducibility, residual-product identity, estimator validity,
      or broader production admission.

