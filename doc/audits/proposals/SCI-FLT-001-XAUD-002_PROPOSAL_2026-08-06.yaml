summary: >-
  The filter reuses one template, denominator, edge window, and core transform
  for science and realization maps, but its edge preprocessing adds a
  science-derived affine background term only to the science map.
claim: >-
  At exact application SHA d5015fe716971bf8ea617e8a187311bf5af05185,
  filter_maps replaces science by b + (science - b) times the realized edge
  window before the filter core, while filter_noise and
  filter_noise_threadsafe multiply each realization by the window without the
  b times (1-window) term. The later filter template/denominator/core operation
  is shared. Literal identical linear propagation therefore holds only when
  the background term vanishes or the window is unity.
