  open_findings:
    - id: SCI-MAP-002-F001
      class: implementation_defect
      severity: P0
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: map_product_validity_mask
      summary: >-
        coverage_bool is one wherever weight<threshold is false, so the default
        zero threshold labels zero weight valid and any non-finite weight also
        compares false and is labeled valid.
      consequence: >-
        The published HDU cannot serve as the frozen authoritative finite,
        positive valid-support mask for new validation or broader production
        claims.
      closure_gate: >-
        Approve and implement a finite/positive mask predicate and exact
        threshold semantics; preserve array/WCS/product identity; pass
        zero/negative/NaN/Inf and below/equal/above threshold fixtures; return
        exact-successor-SHA FITS evidence; re-audit direct consumers.
    - id: SCI-MAP-002-F002
      class: contract_implementation_mismatch
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: scientific_jinc_support_owner
      summary: >-
        r_max sets both the second-JINC zero and the half-width of a fully
        populated square cache; it is not the frozen radial support cutoff and
        corners extend to approximately sqrt(2) times the nominal radius.
      closure_gate: >-
        Approve either the realized square/dual-use convention or a radial
        support contract, publish it in typed effective/realized state, pass
        below/equal/above plus corner/edge cases, and re-audit. No parameter
        optimization is implied.
    - id: SCI-MAP-002-F003
      class: contract_implementation_mismatch
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: scientific_jinc_subpixel_owner
      summary: >-
        subpixel_n selects one phase-quantized point-evaluated cache and
        approaches point sampling, not the frozen pixel-area response.
      closure_gate: >-
        Approve the target response and phase/rounding/convergence convention,
        serialize it, pass bounded phase/convergence tests, and re-audit the
        exact successor SHA.
    - id: SCI-MAP-002-F004
      class: implementation_defect
      severity: P1
      evidence_basis: derived_from_static_source
      confidence: high
      status: open
      owner: jinc_normalization_and_conditioning
      summary: >-
        The fixed absolute gates abs(C)>1e-8 and max(Q,1e-30) carry implicit
        units, can change valid support under signal-unit scaling, and make
        formal weight differ from exact C-squared/Q below the Q floor.
      closure_gate: >-
        Approve a typed conditioning policy, serialize requested/effective/
        realized thresholds, pass unit-scaling, exact/near-cancellation, and
        tiny-Q tests, and re-audit.
    - id: SCI-MAP-002-F005
      class: implementation_defect
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: jinc_parameter_and_coefficient_admission
      summary: >-
        Shape elements are checked for finiteness but not their physical
        domain, and evaluated JINC coefficients are not checked for finiteness
        before signal/denominator/weight/kernel/coverage accumulation.
      closure_gate: >-
        Approve and enforce named a/b/c domains plus fail-closed coefficient
        finiteness before deposition, pass malformed-domain boundary tests,
        and re-audit. Invalid reductions need not be run on Unity.
    - id: SCI-MAP-002-F006
      class: product_contract_gap
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: map_coverage_product_and_consumers
      summary: >-
        coverage is sum(c-squared/fs), not geometric exposure, loses analytic-
        zero footprint exposure, is described only as effective integration
        time, and is used by a downstream edge-support consumer.
      closure_gate: >-
        Approve the estimator name and detector/sample accounting, distinguish
        it from geometric exposure and validity masks, publish metadata and
        realized provenance, validate product/consumer admission, and re-audit.
    - id: SCI-MAP-002-F007
      class: provenance_gap
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: mapmaking_realized_provenance
      summary: >-
        The state skeleton preserves requested/effective config and coarse
        completion but omits realized analytic/support/subpixel/normalization/
        array/execution/kernel/coverage/cancellation/mask and product-link
        identities required to reproduce or admit JINC products.
      closure_gate: >-
        Approve a versioned four-stage one-way schema, publish the missing
        realized values and product joins/digests, pass exact serialization and
        lifecycle/cardinality tests, and re-audit.
    - id: SCI-MAP-002-F008
      class: validation_gap
      severity: P1
      evidence_basis: observed_absence
      confidence: high
      status: open
      owner: coordinator_and_human_unity_operator
      summary: >-
        No exact-governing-SHA JINC runtime evidence establishes response,
        product values, execution-policy realization, or sequential/parallel
        numerical acceptance; the only incoming evidence is naive-only.
      closure_gate: >-
        Coordinator approves the bounded exact-SHA evidence prerequisites and
        acceptance policy, a human operator returns complete U01-U05 and
        conditional U06 evidence without repair or parameter campaign, and the
        exact bundle is independently checked and re-audited.

  proposed_decisions:
    - id: SCI-MAP-002-D001
      decision: amend
      statement: >-
        Adopt N=sum(qcd), C=sum(qc), Q=sum(qc-squared), observation signal=N/C,
        and formal weight=C-squared/Q as the proposed estimator while recording
