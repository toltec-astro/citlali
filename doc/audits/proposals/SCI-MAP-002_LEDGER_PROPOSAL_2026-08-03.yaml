    - id: SCI-MAP-002-D002
      decision: restrict
      statement: >-
        Do not treat coverage_bool as authoritative validity for new scientific
        validation or broader production claims until SCI-MAP-002-F001 closes;
        do not alter existing runs under this audit.
    - id: SCI-MAP-002-D003
      decision: scientific_owner_choice_required
      statement: >-
        Resolve square/radial support, dual-use r_max, point/pixel response,
        coefficient-squared coverage, conditioning, and parameter domain before
        any repair or numerical campaign.
    - id: SCI-MAP-002-D004
