      statement: >-
        Preserve distinct N/C/Q, signed lobes, the K/C response equation,
        stable array identity, and formal/empirical observation-product
        separation in any successor work.
    - id: SCI-MAP-002-D005
      decision: evidence_proposal_only
      statement: >-
        The exact-SHA U01-U06 protocol is proposed but not requested; Unity
        remains human-mediated and inaccessible to Codex.

