  implementation_assessment:
    governing_source: nonconformant_to_frozen_proposed_contract
    conforming_subcontracts:
      - N, signed C, and Q are distinct raw accumulators with the frozen equations.
      - Negative JINC lobes retain sign in N and C and are squared in Q.
      - Observation signal finalization is N/C on retained support.
      - Observation formal weight is C-squared/Q above the implementation floor.
      - Analytic unit-source kernel response is accumulated as sum(q*c*h)/C and consumed downstream without reconstruction.
      - Stable a1100/a1400/a2000 names select parameter vectors and output file/WCS identity.
      - Formal standardized signal and empirical pixel S/N have distinct traced observation-product identities.
      - Current detector-parallel Beammap writes are map-disjoint under the direct one-to-one caller invariant.
    nonconforming_or_open_subcontracts:
      - r_max realizes a square cache and a second-JINC zero rather than a declared radial support boundary.
      - subpixel_n converges to point-phase sampling rather than the frozen pixel-response average.
      - fixed absolute C and Q gates make support/formal weight unit-scale dependent.
      - shape physical-domain and coefficient-finiteness admission is incomplete.
      - coverage is coefficient-squared time with incomplete estimator metadata.
      - coverage_bool can label zero or non-finite weight as valid.
      - realized JINC/provenance and product joins are incomplete.
      - exact-SHA JINC response and sequential/parallel numerical evidence is absent.
    consequence: >-
      Correct raw algebra does not compensate for invalid published support,
      unresolved footprint/subpixel/coverage contracts, unit-dependent
      conditioning, incomplete parameter admission/provenance, and missing
      exact-SHA runtime evidence.

