  open_findings:
    - id: SCI-NOI-002-F001
      class: scientific_contract_gap
      severity: P1
      evidence_basis: observed_static_source_and_independent_derivation
      confidence: high
      status: open
      owner: NOI-002_estimator_policy
      summary: >-
        Exact d501 uses centered 1/R pixel scatter without target or
        joint-design correction; it is biased low in the iid common-law case
        and degenerates at R equals one.
      closure_gate: >-
        Name the target law, completed design/support, normalization and
        invalidity policy; implement only on an authorized successor and re-audit.
    - id: SCI-NOI-002-F002
      class: scientific_contract_gap
      severity: P1
      evidence_basis: observed_static_source_and_independent_derivation
      confidence: high
      status: open
      owner: NOI-002_with_MAP_and_FLT_interfaces
      summary: >-
        The reciprocal-median scalar only calibrates the global scale of a
        nonprecision MAP pattern, uses the same stack, and silently returns
        scale one for an empty calibration region.
      closure_gate: >-
        Adopt a bounded scale target/data/validity contract or separately
        validated covariance model; prohibit precision relabeling by unit.
    - id: SCI-NOI-002-F003
      class: provenance_and_label_gap
      severity: P1
      evidence_basis: observed_static_source
      confidence: high
      status: open
      owner: NOI-002_provenance_with_NOI-001_joins
      summary: >-
        Product metadata omits target, centering, design/divisor, completion,
        source-imprint, calibration, covariance-domain, and consumer-validity facts.
      closure_gate: >-
        Publish compact required facts and product-contract tests without
        automatically requiring dense covariance or sign streams.
    - id: SCI-NOI-002-F004
      class: consumer_contract_gap
      severity: P1
      evidence_basis: observed_static_source_and_independent_derivation
      confidence: high
      status: open
      owner: NOI-002_and_SCI-SRC-001
      summary: >-
        Multiple inequivalent coefficient, stack, pooled, source-finder, and
        source-table statistics share S/N-like interpretation without one null,
        response, search, selection, or multiplicity law.
      closure_gate: >-
        Name each statistic and response, restrict unsupported uses, and
        separately validate every claimed tail or catalog property.
    - id: SCI-NOI-002-F005
      class: dependency_gap
      severity: P1
      evidence_basis: observed_static_source_and_independent_derivation
      confidence: high
      status: open
      owner: NOI-002_with_SCI-FLT-001_and_SCI-FLT-002
      summary: >-
        Filtered point-source uncertainty is pixelwise stack scatter, not a
        response-corrected aperture/template uncertainty, and no off-diagonal
        covariance is available.
      closure_gate: >-
        Establish exact filter response/operator identity and validate a
        projected covariance, blank-aperture, or other approved compact method.
    - id: SCI-NOI-002-F006
      class: adaptive_dependency_gap
      severity: P1
      evidence_basis: observed_static_source_and_independent_derivation
      confidence: high
      status: open
      owner: SCI-FRUIT-001_with_NOI-002_interface
      summary: >-
        FRUIT consumes median realization RMS inside adaptive selection, and
        the standard science configuration text conflicts with its empirical-product prerequisite.
      closure_gate: >-
        Admit a consistent configuration and approve the complete adaptive or
        independent split/cross-fit procedure before statistical feedback use.
    - id: SCI-NOI-002-F007
      class: scientific_policy_gap
      severity: P1
      evidence_basis: observed_configuration_and_independent_derivation
      confidence: high
      status: open
      owner: package_consumer_owners_and_coordinator
      summary: >-
        Active configured counts and inert disabled counts have no
        use-specific adequacy decision; 64 is optional validation capacity only.
      closure_gate: >-
        Approve enabled uses, target/design/estimator/error criteria,
        resource/failure policy, and predeclared acceptance without presuming a count.
    - id: SCI-NOI-002-F008
      class: evidence_gap
      severity: P1
      evidence_basis: observed_absence
      confidence: high
      status: open
      owner: coordinator_and_eventual_exact_successor_verifier
      summary: >-
        Exact-d501 tests are structural and do not establish estimator,
        calibration, dependence, tail, feedback, or aperture validity.
      closure_gate: >-
        Run only separately authorized proportional successor fixtures and any
        admitted evidence with predeclared criteria; no current request exists.

  proposed_decisions:
    - id: SCI-NOI-002-D001
      decision: amend
      statement: >-
        Adopt the frozen independent core and classify exact-d501
        noise_variance as conditional source-imprinted centered 1/R stack scatter,
        not repeated-physical-noise covariance.
    - id: SCI-NOI-002-D002
      decision: restrict_global_scale_to_nonprecision_diagnostic
      statement: >-
        Retain the reciprocal-median operation only for its declared global
        scale functional; an empty region is invalid, not an empirical scale one.
    - id: SCI-NOI-002-D003
      decision: unique_statistic_and_tail_contract_required
      statement: >-
        Name every standardized statistic and reserve significance or threshold
        claims for a complete null, response, search, selection, multiplicity,
        and calibration contract.
    - id: SCI-NOI-002-D004
      decision: aperture_or_template_projection_required
      statement: >-
        Do not infer filtered point-source or aperture error from a pixel
        diagonal; require response and projected covariance or a separately
        validated blank-aperture/compact method.
    - id: SCI-NOI-002-D005
      decision: FRUIT_feedback_unavailable_pending_owner_contract
      statement: >-
        Fixed conditional stack moments do not authorize adaptive feedback;
        SCI-FRUIT-001 owns the complete procedure and failure law.
    - id: SCI-NOI-002-D006
