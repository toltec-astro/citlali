  exact_d501_estimator:
    realization_mean: mean_over_completed_stack
    moment: empirically_centered_pixel_second_central_moment
    divisor: completed_R
    algebra: V_p_equals_sum_over_r_of_Y_rp_minus_mean_squared_divided_by_R
    full_cross_pixel_covariance: not_computed
    general_joint_design_correction: absent
    source_imprint_treatment: retained_and_unmodeled_in_source_imprinted_current_ensemble
    R_equals_1: zero_centered_scatter_empty_calibration_region_scale_one
    calibration:
      input_pattern: formal_MAP_nonprecision_coefficient_q
      statistic: median_over_valid_pixels_of_q_times_V
      scale: reciprocal_of_positive_finite_median_else_one
      output: globally_scaled_nonprecision_coefficient
      external_target_calibration: absent
    standardized_products:
      coefficient_standardized_pixel: signal_times_sqrt_scaled_q
      direct_stack_pixel: signal_divided_by_sqrt_V
      pooled_stack_diagnostic: sample_sd_of_Y_times_sqrt_q_over_pixels_and_realizations
      source_table_ratio: fitted_amplitude_divided_by_whole_map_standard_deviation
      statistical_significance: not_established
    aperture_covariance: unavailable

  implementation_assessment:
    conforming_or_bounded_subcontracts:
      - Requested and effective noise configuration are distinct.
      - Disabled noise-map configurations resolve to effective count zero.
      - Formal coefficients are persisted with explicit nonprecision and unavailable-covariance labels.
      - Product inventory and required write failures are checked.
      - Exact finite-stack mean and centered 1/R scatter are deterministic descriptive quantities.
      - The reciprocal-median operation is a reproducible global scale diagnostic when its calibration region is nonempty.
    nonconforming_or_open_subcontracts:
      - The 1/R centered scatter is called noise variance without a target law or joint-design correction.
      - Completed realization identities, duplicate/complement census, missingness, and per-support counts are not bound to the estimator.
      - The current source-imprinted ensemble can imprint deterministic astronomy into moments and weights.
      - A scalar calibration of a nonprecision spatial pattern cannot establish marginal inverse variance or precision.
      - An empty calibration region silently produces scale one rather than an invalid calibration state.
      - Multiple inequivalent S/N-like statistics lack distinct complete identities and null/search/selection laws.
      - Filtered pixel scatter is labeled point-source uncertainty without aperture covariance or independently established response.
      - FRUIT consumes a spatially pooled MEDRMS statistic inside adaptive feedback without a complete joint law.
      - Enabled zero realizations remain admitted at exact d501 despite the binding positive-count admission policy.
      - No exact-d501 test validates estimator normalization, dependence, target calibration, tail, feedback, or aperture claims.

