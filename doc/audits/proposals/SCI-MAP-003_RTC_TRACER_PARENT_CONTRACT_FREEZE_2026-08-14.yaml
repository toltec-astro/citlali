owner_decisions:
  - decision: D01_detector_population_and_weights
    status: approved
    rule: >-
      Use exactly the immutable APT rows and detectors contributing to the
      terminal k parent, with identical realized eligibility and contribution
      weights; persist identities, weights, and selection digest; never
      substitute a nominal detector, unweighted average, new reweighting,
      cross_scan pooling, or marginalized mixture.
    unavailable_if: exact_population_or_weights_not_reconstructible
  - decision: D02_construction_route
    status: approved
    rule: >-
      Render g directly on the exact retained terminal_parent grid using its
      full_precision WCS; no intermediate larger grid, crop, reprojection,
      interpolation, resampling, or independent recentering.
  - decision: D03_gaussian_family_and_width
    status: approved
    rule: >-
      Use a circular symmetric Gaussian per detector with the exact realized
      positive finite per_detector FWHM used by the parent reduction; persist
      value, units, source class, source artifact and field; MAP003 does not
      rerun precedence or substitute nominal band width; ellipticity and angle
      are not applicable.
  - decision: D04_pixelization
    status: approved
    rule: >-
      Evaluate at WCS_defined pixel centers under the full two_dimensional WCS;
      persist pixel_center_sampled; do not supersample, footprint_integrate,
      interpolate, pixel_area_correct, or snap fractional centers.
  - decision: D05_truncation
    status: approved
    rule: >-
      Truncate each detector Gaussian independently at inclusive rho <= 3 sigma
      in parent tangent_plane angular coordinates; pixels outside are
      intentional valid zeros; persist sigma_limit 3.0 and comparator <=.
  - decision: D06_amplitude_units_and_normalization
    status: approved
    rule: >-
      Give each component peak amplitude exactly 1.0 mJy/beam, combine with
      approved realized weights, and divide once by the exact persisted formal
      support denominator C used by terminal k=K/C; no later peak, integral,
      DC, or global_sum normalization; C <= 0 or nonfinite C is invalid.
  - decision: D07_center_and_lifecycle
    status: approved
    rule: >-
      Use one common terminal_parent full_precision WCS reference center for
      every component at exact fractional CRPIX; persist CRVAL, frame, epoch,
      and pixel coordinates; freeze when the terminal parent becomes realized;
      never fit, snap, independently recenter, or use detector_specific prior
      centers.
  - decision: D08_support_masks_and_validity
    status: approved
    rule: >-
      Admit g only when finite and valid over the entire exact rectangular
      terminal_parent grid; apply no additional spatial mask; truncation zeros
      are valid; any invalid pixel makes the complete realization unavailable;
      no zero_fill, interpolation, inpainting, crop, or silent shrink; preserve
      g construction validity separately from k observational validity.
  - decision: D09_admissible_rtc_terminal_stage
    status: approved
    rule: >-
      The sole RTC response parent is rtc_conditioned_inner_terminal
      immediately before PTC, after every enabled signal_changing stage, inner
      crop, phase_zero downsampling, and relevant support eligibility; outer,
      pre_crop, diagnostic, mini_TOD, or generic RTC products are not
      substitutes.
  - decision: D10_governing_complete_response_availability
    status: approved
    rule: >-
      At governing application 46ad2388 the complete response for
      rtc_conditioned_inner_terminal is unavailable because donor_replacement
      response and enabled altaz_projection response are omitted and complete
      support, eligibility causes, and realized response provenance are
      insufficient; partial kernels remain explicitly partial.
  - decision: D11_digest_serialization
    status: approved
    rule: >-
      Use SHA_256 over exact persisted artifact bytes, formatted sha256 plus 64
      lowercase hexadecimal digits and accompanied by byte length; perform no
      canonicalization, reserialization, decompression, rounding, newline
      conversion, or metadata removal; bundle members use UTF_8 lexical path
      order and the exact persisted bundle manifest is also hashed.
  - decision: D12_unavailable_reason_vocabulary
    status: approved
    rule: >-
      Availability unavailable requires a nonempty controlled reason list;
      every entry identifies the affected object and exact evidence; free text
      cannot replace a code and an unlisted cause stops for owner amendment.

g_contract:
  schema_status: frozen
  realization_status: unavailable_no_realization_registered
  symbol: g
  family: weighted_circular_symmetric_APT_Gaussian_mixture
  component_formula: >-
    phi_d(r,c)=exp(-rho_d(r,c)^2/(2*sigma_d^2)) for rho_d<=3*sigma_d,
    otherwise phi_d(r,c)=0; sigma_d=FWHM_d/(2*sqrt(2*ln(2)))
  mixture_formula: >-
    g(r,c)=(1.0 mJy/beam)*sum_d(w_d(r,c)*phi_d(r,c))/C(r,c)
  unit: mJy/beam
  output_type: real_two_dimensional_plane
  construction_route: direct_on_exact_retained_terminal_parent_grid
  pixelization: pixel_center_sampled
  crop: none_g_rendered_on_already_retained_grid
  whole_grid_policy: complete_rectangular_fail_closed
  normalization: exact_terminal_parent_C_once_only
  field_group_count: 14
  field_groups:
    - id: G01_source_identity
      required: >-
        observation reduction product_cell band_array mode map_slot Stokes
        terminal_k_parent source_APT source_kernel identities and digests
    - id: G02_construction_route
      required: direct_final_grid_algorithm_and_route_identity
    - id: G03_units_and_amplitude
      required: exact_1.0_mJy_per_beam_reference_injection_and_beam_convention
    - id: G04_WCS_and_pixelization
      required: >-
        full_precision_WCS_axes_frame_epoch_handedness_rotation_scale_indexing
        and_pixel_center_sampled_rule
    - id: G05_center
      required: full_precision_CRVAL_frame_epoch_and_fractional_CRPIX
    - id: G06_grid_shape
      required: exact_Ny_Nx_row_column_order_map_slot_and_Stokes_cell
    - id: G07_masks_support_and_validity
      required: >-
        detector_exclusions_causes_WCS_validity_C_validity_complete_rectangular
        support_and_separate_g_construction_validity
    - id: G08_Gaussian_family_and_parameters
      required: >-
        circular_symmetric_family_realized_per_detector_FWHM_units_source_class
        artifact_field_and_digest
    - id: G09_truncation
      required: sigma_limit_3.0_inclusive_comparator_tangent_plane_metric_units
    - id: G10_APT_rows_detector_mixture_and_weights
      required: >-
        immutable_APT_digest_row_ids_detector_ids_realized_eligibility_exact
        contribution_weights_and_selection_digest
    - id: G11_normalization_and_denominator
      required: exact_terminal_parent_C_artifact_plane_units_values_validity
    - id: G12_crop
      required: no_g_crop_and_exact_relation_to_retained_terminal_parent
    - id: G13_lifecycle_stage
      required: >-
        requested_effective_observation_resolved_realized_identities_and
        immutable_terminal_parent_link
    - id: G14_digests
      required: >-
        SHA_256_algorithm_exact_path_object_HDU_plane_byte_count_artifact_and
        lexical_bundle_manifest_digests
  unavailable_if_any_required_group_missing: true
  independent_reconstruction_gate:
    required: true
    count: 2
    protocol: preregistered_byte_or_arithmetic_identity
    passed: false

