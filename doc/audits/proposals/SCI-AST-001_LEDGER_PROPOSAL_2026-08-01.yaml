package:
  id: SCI-AST-001
  name: Pointing, astrometry, detector coordinates, and WCS
  tier: A
  queue_wave: foundation_1
  scientific_scope: >-
    Observation pointing corrections, telescope and detector coordinates,
    interpolation/support policy, coordinate frames, projection, WCS, and
    astrometric uncertainty/response.
  inputs:
    - stable aligned telescope sample identity and typed fields
    - selected pointing support with identity, units, basis, sign, times, and validity
    - detector focal-plane offsets with stable raw/APT mapping
    - frame, epoch, tangent center, projection domain, and WCS request
  outputs:
    - realized per-sample correction and telescope/detector coordinates
    - explicit coordinate validity, response, and uncertainty availability
    - immutable WCS and linked coordinate products
    - lossless requested/effective/observation-resolved/realized provenance

  upstream_dependencies:
    - package_id: SCI-ALIGN-001
      status: open
      required_contract: >-
        AST receives an ordered detector-reference sample identity plus each
        aligned telescope field's stable identity, native-source mapping,
        units, frame, topology, validity/support, timing residual, origin,
        interpolation method, and original-versus-synthesized eligibility.
      consequence: >-
        AST may derive against the approved abstract input, but implementation
        conformity and precise coordinate/WCS claims remain restricted until
        ALIGN supplies and re-audits that interface and AST admits it.

  downstream_consumers:
    - SCI-RTC-001
    - SCI-PTC-001
    - SCI-MAP-001
    - SCI-SRC-001
    - SCI-MODE-001
    - SCI-BEAM-001

