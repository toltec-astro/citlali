  production_disposition:
    allowed_compatibility_only:
      - exact retained Point redu61 interpretation
      - exact retained OOF redu02 interpretation
      - exact retained Science redu20 through redu23 interpretation
      - exact retained Beammap redu05 interpretation
      - generated default FITS handedness and CRPIX indexing without precision expansion
    restricted:
      - all new consumers or profiles
      - wrap, pole, horizon, large-offset, high-declination, singular, or back-hemisphere cases
      - subsecond support, span fallback, mixed sentinel, or nondefault WCS interpretation
      - absolute coordinate uncertainty, covariance, response, systematic, or coverage claims
      - detector coordinates without exact APT/raw mapping
      - generic reliance on telescope-variable unit attributes
    fail_closed:
      - nonfinite or out-of-domain coordinate
      - unknown topology, frame, epoch, basis, sign, or detector identity
      - missing coordinate validity or required AST product
      - Galactic simulation and unvalidated simulation parity
      - new precise astrometry, WCS, covariance, or production-expansion claim
    note: >-
      These are production restrictions; the governing implementation does not
      yet enforce every proposed fail-closed condition.

  repair_sequence_proposal:
    audit_branch_repair_authorized: false
    steps:
      - approve or supersede decisions D001 through D008
      - complete and re-audit the ALIGN interface
      - select a separate exact repair base and repair only AST conformance
      - pass every non-N/A local deterministic and product gate
      - freeze and independently re-audit the exact successor SHA
      - issue a new successor-SHA Unity request and audit the complete return
      - disposition downstream handoffs and re-audit owning consumer boundaries

