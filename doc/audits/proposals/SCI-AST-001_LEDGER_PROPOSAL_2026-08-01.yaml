  contract_status: proposed
  implementation_status: nonconformant
  validation_status: in_progress
  production_status: existing_use_only
  verdict: amend

  implementation_assessment:
    governing_source: nonconformant
    positive_controls:
      - generated FITS x-axis reversal and negative CDELT1 are internally consistent
      - zero-based internal CRPIX is converted to one-based FITS CRPIX
      - required WCS/provenance output failures propagate
      - observation lifecycle enforces nonzero equal install/application counts
    consequence: >-
      Positive subcontracts do not compensate for known projection, topology,
      WCS realization, uncertainty, identity, validity, unit, simulation, and
      provenance mismatches.

  open_findings:
    - id: SCI-AST-001-F001
      class: implementation_defect
      severity: P0
      evidence_basis: observed
      confidence: high
      status: open
      owner: ast_projection_implementation
      summary: >-
        Forward TAN maps near-zero denominator to finite center and accepts the
        back hemisphere, aliasing invalid directions to valid-looking coordinates.
      closure_gate: >-
        Implement an approved positive-domain/invalidity contract, propagate a
        coordinate-validity product, pass exhaustive boundary and round-trip
        tests, and re-audit the exact successor SHA.
    - id: SCI-AST-001-F002
      class: implementation_defect
      severity: P0
      evidence_basis: observed
      confidence: high
      status: open
      owner: telescope_coordinate_implementation
      summary: >-
        AltAz applies only one azimuth wrap correction and can produce a
        multi-radian tangent displacement for the opposite crossing.
      closure_gate: >-
        Use the approved shortest signed topology in both directions and pass
        wrap, horizon, pole, and ordinary controls at an exact successor SHA.
    - id: SCI-AST-001-F003
      class: implementation_defect
      severity: P0
      evidence_basis: observed
      confidence: high
      status: open
      owner: wcs_config_product_implementation
      summary: >-
        Accepted CRPIX/CRVAL/TAN configuration is overwritten or unused and can
        succeed without realizing the requested scientific values.
      closure_gate: >-
        Owner selects exact implementation or startup rejection/deprecation for
        every field; pass nondefault requested-to-realized/provenance tests and
        re-audit.
    - id: SCI-AST-001-F004
      class: dependency_gap
      severity: P0
      evidence_basis: observed
      confidence: high
      status: open
      owner: sci_align_repair_and_coordinator
      summary: >-
        ALIGN does not yet supply the complete typed field, source mapping,
        topology, frame, validity, timing, interpolation, and eligibility identity AST requires.
      closure_gate: >-
        Implement and re-audit the approved ALIGN interface, then pass AST
        sample/field/detector admission tests.
    - id: SCI-AST-001-F005
      class: implementation_defect
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: ast_support_implementation
      summary: >-
        Support resolution permits ambiguous mixed sentinels, truncates MJD to
        integer seconds, and lacks local strict span-time validation.
      closure_gate: >-
        Approve support modes/precision, preserve times losslessly, reject
        ambiguity/extrapolation/nonmonotonicity, and pass endpoint, mixed, and
        subsecond tests.
    - id: SCI-AST-001-F006
      class: contract_gap
      severity: P1
      evidence_basis: derived
      confidence: high
      status: open
      owner: scientific_astrometry_owner
      summary: >-
        Correction sign, focal-plane basis/rotation/order, topology, frame/epoch
        transform, and small-angle validity radius lack authoritative definitions.
      closure_gate: >-
        Approve versioned equations and bounds, publish them in typed state,
        and pass limiting and independent-reference fixtures.
    - id: SCI-AST-001-F007
      class: implementation_defect
      severity: P1
      evidence_basis: derived
      confidence: high
      status: open
      owner: ast_src_mode_product_boundary
      summary: >-
        Point/source means use inverse TAN while positional errors receive only
        scalar unit conversion, without Jacobian or cross-covariance.
      closure_gate: >-
        Propagate full covariance/availability through inverse TAN and pass
        high-declination, wrap, and cross-term tests plus consumer re-audit.
    - id: SCI-AST-001-F008
      class: contract_gap
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: scientific_astrometry_product_owner
      summary: >-
        Correction, alignment, focal-plane, frame, systematic, response and
        selection uncertainty have no approved covariance/availability product.
      closure_gate: >-
        Approve covariance scope and unavailable semantics; implement versioned
        Jacobian/terms or explicit absence and validate coverage/systematics.
    - id: SCI-AST-001-F009
      class: contract_gap
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: ast_lifecycle_provenance
      summary: >-
        Provenance records requests, modes and counts but omits resolved/realized
        values, scientific identity, dependencies, product links, validity,
        uncertainty availability, and digests.
      closure_gate: >-
        Implement lossless four-stage one-way state and exact serialization,
        physical cardinality, and product linkage tests.
    - id: SCI-AST-001-F010
      class: implementation_defect
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: wcs_product_consumer_boundary
      summary: >-
        WCS continuous values use float, frame identity is incomplete/nonstandard,
        epoch defaults without transform, and feedback admission discards scale sign.
      closure_gate: >-
        Approve frame/epoch policy, retain full precision and handedness, and
        pass FITS/feedback round-trip and precision fixtures.
    - id: SCI-AST-001-F011
      class: implementation_defect
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: tod_product_schema
      summary: >-
        Generic TOD output falsely labels every telescope field radians,
        including time, state, and counter data.
      closure_gate: >-
        Use the approved per-variable ALIGN registry and pass exact unit,
        topology, frame, validity, schema, and reader round trips.
    - id: SCI-AST-001-F012
      class: implementation_defect
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: ast_boundary_and_consumers
      summary: >-
        Coordinate validity is not a first-class product/admission operator, so
        map geometry, mapmakers, and selection can consume invalid coordinates.
      closure_gate: >-
        Implement explicit validity and fail-closed propagation through every
        named consumer; pass exhaustive invalid-state tests and recipient re-audits.
    - id: SCI-AST-001-F013
      class: implementation_defect
      severity: P0
      evidence_basis: observed
      confidence: high
      status: open
      owner: ast_cal_detector_identity_boundary
      summary: >-
        APT admission does not validate x/y size/finiteness, UID uniqueness, or
        exact APT-to-raw detector mapping before index-wise coordinate use.
      closure_gate: >-
        Admit an immutable one-to-one mapping and basis/version; pass
        permutation, duplicate, nonfinite, mismatch, subset, and Beammap tests.
    - id: SCI-AST-001-F014
      class: implementation_defect
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: simulation_ast_implementation
      summary: >-
        Simulation bypasses time/wrap/frame setup and exposes Galactic use
        without constructing Galactic tangent coordinates.
      closure_gate: >-
        Approve parity scope, implement and validate each enabled frame or fail
        closed, and pass exact real/simulation fixtures.
    - id: SCI-AST-001-F015
      class: evidence_gap
      severity: P1
      evidence_basis: observed
      confidence: high
      status: open
      owner: local_validation_and_human_external_evidence_owner
      summary: >-
        No exact-governing compiled numerical suite or same-SHA operational
        bundle covers equations, validity, WCS, covariance, identities, units,
        simulations, and parallel equivalence.
      closure_gate: >-
        Pass every non-N/A local gate and return/audit SCI-AST-001-UNITY-001
        without required-data skip, then re-audit the exact successor SHA.

