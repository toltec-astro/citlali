findings:
  - id: SCI-MAP-003-F001
    class: contract_gap
    priority: P1
    status: open
    finding: No exact discrete g
    owner: SCI-RTC-001 and SCI-MAP-003 owners
    closure_gate: >-
      Freeze every APT row/weight, Gaussian parameter, amplitude/unit,
      truncation, center, pixelization, WCS, mask, crop, and digest; two
      independent reconstructions meet a preregistered byte or arithmetic
      identity.
  - id: SCI-MAP-003-F002
    class: dependency_gap
    priority: P0
    status: open
    finding: No admissible complete final k parent
    owner: >-
      SCI-RTC-001, SCI-PTC-001, SCI-MAP-002, SCI-VAL-001, and SCI-FRUIT-001
      owners
    closure_gate: >-
      Complete-response-or-unavailable, eligibility, and terminal-pass
      contracts close; the exact serial pre-crop normalized kernel and
      once-cropped k have immutable parent/stage/digest identity at the
      governing application SHA.
  - id: SCI-MAP-003-F003
    class: implementation_defect
    priority: P0
    status: open
    finding: Parallel JINC shared-array data races
    owner: SCI-MAP-002 / Citlali mapmaker owner
    closure_gate: >-
      An authorized repair provides race-free private/deterministic reduction
      or proved disjoint writes; thread-sanitizer evidence and preregistered
      serial-versus-parallel byte/tolerance equivalence pass for all
      accumulators, then a fresh independent audit accepts the exact repair
      SHA.
  - id: SCI-MAP-003-F004
    class: contract_gap
    priority: P1
    status: open
    finding: Odd grid, transform, quotient, and domain absent
    owner: SCI-MAP-003 with SCI-MAP-001 and SCI-AST-001 interfaces
    closure_gate: >-
      The exact owner crop and aligned planes are implemented and persisted;
      Cases 1--4 and 6--11 pass after ND-GRID and ND-DEN are frozen.
  - id: SCI-MAP-003-F005
    class: contract_gap
    priority: P1
    status: open
    finding: Transfer product schema and provenance absent
    owner: SCI-MAP-003, SCI-MAP-001, and SCI-MODE-001 owners
    closure_gate: >-
      A versioned product contract defines representation, cardinality, exact
      identity/provenance, aliases, association, required/optional behavior,
      atomic failure, and digest; deliberate mismatch/publication tests pass.
  - id: SCI-MAP-003-F006
    class: contract_gap
    priority: P1
    status: open
    finding: Response uncertainty and covariance unavailable
    owner: SCI-MAP-003 with RTC/PTC/VAL and later LMTOOF owners
    closure_gate: >-
      An approved estimator and persistence contract supplies or explicitly
      marks unavailable every formal, empirical, calibration/systematic, and
      response uncertainty term; named coverage/calibration tests satisfy a
      frozen protocol.
  - id: SCI-MAP-003-F007
    class: scientific_policy_decision
    priority: P1
    status: open
    finding: Remaining grid/domain/synthesis policy open
    owner: SCI-MAP-003 owner, with AST/VAL interfaces
    closure_gate: >-
      One owner decision freezes every operator and boundary value before
      implementation or Case 7/8 execution; at/below/above threshold and
      operator identity cases then pass unchanged.
  - id: SCI-MAP-003-F008
    class: scientific_policy_decision
    priority: P1
    status: open
    finding: Amplitude, uncertainty, publication, and consumer admission open
    owner: >-
      SCI-MAP-003, SCI-MODE-001, SCI-VAL-001, and LMTOOF product owners
    closure_gate: >-
      Separate owner decisions freeze optical units/nuisance amplitude,
      uncertainty, product schema, OOF association, fixed/recompute lifecycle,
      allowed consumer version, identity rejection, and failure policy.
  - id: SCI-MAP-003-F009
    class: dependency_gap
    priority: P0
    status: open
    finding: VAL, FRUIT, and MODE packages not started
    owner: SCI-VAL-001, SCI-FRUIT-001, and SCI-MODE-001 owners
    closure_gate: >-
      Each package produces an owner-approved bounded contract and accepted
      implementation/evidence result for its named interface; a dated re-audit
      admits it without rewriting either frozen core.
  - id: SCI-MAP-003-F010
    class: evidence_gap
    priority: P1
    status: open
    finding: No validation or adoption evidence
    owner: >-
      SCI-MAP-003 validation owner and separately authorized external/telescope
      owners
    closure_gate: >-
      After contracts and implementation blockers close, separately
      authorized preregistered studies pass unchanged under FRAMEWORK-NUM-001
      controls, followed by independent review and an explicit production
      decision.

