                raw_max_width_sec: 0.025
                raw_window_sec: 0.06
                sigma_scale: 0.75
              upper_tod_inv_var_factor: 0.0
            output:
              enabled: false
              mode: mini
              selection:
                mode: uniform_plus_source_crossing
                n_source_dense: 10
                n_uniform: 10
            weighting:
              busy_row_suppression:
                enabled: false
                factor: 0.0
                min_candidate_clusters: 5
                min_max_unflagged_residual_z: 25.0
                require_busy_veto: true
              corr_penalty:
