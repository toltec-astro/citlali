# Complete validated Citlali Beammap policy; generated and maintainer-owned.
# Normal reducers should use 81_beammap_defaults.yaml and 82_beammap_products.yaml.
reduce:
  jobkey: reduced
  inputs:
  - path: ../data
    select: scannum == 2 & (obsnum in [OBSNUM])
  steps:
  - name: citlali
    path: /work/toltec/citlali_dev/citlali_refactor/build/bin/citlali
    config:
      cal_items:
      - beammap_source:
          fluxes:
          - array_name: a1100
            uncertainty_mJy: 0.05
            value_mJy: 0.0
          - array_name: a1400
            uncertainty_mJy: 0.05
            value_mJy: 0.0
          - array_name: a2000
            uncertainty_mJy: 0.05
            value_mJy: 0.0
        type: photometry
      - pointing_offsets:
        - axes_name: az
          value_arcsec:
          - 0.0
        - axes_name: alt
          value_arcsec:
          - 0.0
        type: astrometry
      - filepath: ../apts/apt_OBSNUM_matched.ecsv
        meta:
          interface: apt
        select: obsnum == OBSNUM
        type: array_prop_table
      cal_objs: []
      low_level:
        beammap:
          convergence_radius_arcsec: 10.0
          derotate: true
          detector_tod_output:
            enabled: true
            n_source_dense: 10
            n_uniform: 10
            subdir_name: source_crossing_tod
          detector_weighting:
            mode: ptc_after_iter0
          fitting:
            fit_radius_fwhm: 0.0
          flagging:
            array_lower_fwhm_arcsec:
            - 3.0
            - 3.5
            - 5.5
            array_lower_sig2noise:
            - 5
            - 5
            - 5
            array_max_dist_arcsec:
            - 0
            - 0
            - 0
            array_network_robust_z:
            - 3.4
            - 0.0
            - 0.0
            array_upper_fwhm_arcsec:
            - 10
            - 15
            - 20
            array_upper_sig2noise:
            - 0
            - 0
            - 0
            max_prior_d2: 9.0
            sens_factors:
            - 0
            - 0
          iter_max: 3
          iter_tolerance: 0.03
          phase_strategy:
            enabled: true
            locator_iter: 0
            measurement_start_iter: 1
          priors:
            align_after_iter0: true
            alignment_common_support: all
            alignment_common_support_quantile: 0.02
            alignment_fit_rotation: true
            alignment_max_d2: 25.0
            alignment_max_rotation_deg: 8.0
            alignment_min_matches: 30
            alignment_scope: array
            candidate_top_n: 64
            enabled: true
            fallback_blind: true
            filepath: /work/toltec/citlali_dev/citlali/data/beammap_priors/beammap_slot_priors_soft_v1.ecsv
            max_d2: 25.0
            max_d2_after_iter0: 16.0
            max_d2_iter0: 25.0
            min_snr: 1.5
            score_lambda: 2.0
            score_lambda_after_iter0: 3.0
            score_lambda_iter0: 2.0
          reference_det: -99
          rfi_mask:
            block_size_samples: 64
            dilate_blocks: 1
            enabled: false
            max_flagged_fraction: 0.35
            min_good_samples: 32
            sigma_floor: 0.0
            sigma_threshold: 6.0
          scan_band_mask:
            edge_rows: 24
            enabled: false
            max_flagged_fraction: 0.3
            min_contiguous_rows: 2
            min_row_pixels: 8
            row_median_sigma_threshold: 4.0
            row_sigma_ratio_threshold: 2.5
          sens_psd_limits_Hz:
          - 3
          - 5
          split_fits_by_flag:
            enabled: true
            flag_values:
            - 0
            - 1
          subtract_reference_det: true
        coadd:
          enabled: false
        interface_sync_offset:
        - toltec0: 0
        - toltec1: 0
        - toltec2: 0
        - toltec3: 0
        - toltec4: 0
        - toltec5: 0
        - toltec6: 0
        - toltec7: 0
        - toltec8: 0
        - toltec9: 0
        - toltec10: 0
        - toltec11: 0
        - toltec12: 0
        - hwpr: 0
        kids:
          fitter:
            modelspec: gainlintrend
            weight_window:
              fwhm_Hz: 1.5e4
              type: lorentz
          solver:
            extra_output: false
            fitreportdir: ../data
            parallel_policy: seq
        mapmaking:
          coverage_cut: 0.1
          crpix1: 0
          crpix2: 0
          crval1_J2000: 0
          crval2_J2000: 0
          cunit: mJy/beam
          enabled: true
          grouping: detector
          jinc_filter:
            r_max: 3.0
            shape_params:
              a1100:
              - 1.1
              - 1.67
              - 2.0
              a1400:
              - 1.1
              - 2.17
              - 2.0
              a2000:
              - 1.1
              - 3.17
              - 2.0
            subpixel_n: 1
          maximum_likelihood:
            max_iterations: 50
            tolerance: 1e-20
          method: jinc
          pixel_axes: altaz
          pixel_size_arcsec: 1.0
          tan_dec: 0
          tan_ra: 0
          x_size_pix: 0
          y_size_pix: 0
        noise_maps:
          enabled: false
          n_noise_maps: 10
          randomize_dets: false
        post_processing:
          map_filtering:
            edge_guard:
              enabled: true
              fill_mode: core_median
              guard_radius_fwhm: 1.0
              hits_core_fraction: 0.15
              hits_threshold_mode: core_median_fraction
              taper_min_fraction: 0.25
              taper_mode: none
              weight_threshold_mode: coverage_cut
            enabled: false
            normalize_errors: true
            type: wiener_filter
          map_histogram_n_bins: 50
          source_finding:
            enabled: false
            mode: default
            source_sigma: 0.0
            source_window_arcsec: 0
          source_fitting:
            bounding_box_arcsec: 12
            fitting_radius_arcsec: 130
            gauss_model:
              amp_limit_factors:
              - 0.1
              - 4.0
              fit_rotation_angle: false
              fwhm_limit_factors:
              - 0.2
              - 3.0
            model: gaussian
        runtime:
          interp_over_gaps: true
          meta:
            version: tolteca...
          n_threads: 16
          output_dir: .
          parallel_policy: omp
          reduction_type: beammap
          use_subdir: true
          verbose: false
        source:
          map_regime: source_dominant
        timestream:
          chunking:
            chunk_mode: duration
            force_chunking: false
            value: 20
          enabled: true
          fruit_loops:
            adaptive_support_radius_arcsec: 0.0
            adaptive_support_radius_fwhm: 0.0
            array_flux_limit:
            - 8.0e-07
            - 1.0e-06
            - 6.0e-07
            center_keep_radius_arcsec: 0.0
            enabled: true
            interp_mode_override: auto
            legacy_center: false
            local_sigma_edge_guard_arcsec: 5.0
            local_sigma_inner_fwhm: 1.5
            local_sigma_inner_radius_arcsec: 10.0
            local_sigma_min_pixels: 50
            local_sigma_outer_fwhm: 4.0
            local_sigma_outer_radius_arcsec: 35.0
            local_snr_floor: 0.0
            max_iters: 2
            mode: upper
            path: null
            peak_fraction_limit: 0.0
            recompute_weights_after_addback: false
            save_all_iters: false
            sig2noise_limit: 0.0
            type: obsnum/raw
          output:
            stats:
              eigenvalues: false
            subdir_name: source_crossing_tod
          polarimetry:
            enabled: false
            grouping: fg
            ignore_hwpr: auto
          precompute_pointing: false
          processed_time_chunk:
            clean:
              adaptive_selector:
                candidate_offsets:
                - -2
                - 0
                - 2
                - 4
                clip_z: 50.0
                enabled: false
                grouping: []
                log_candidates: false
                low_band_Hz:
                - 0.05
                - 0.5
                low_weight: 1.0
                max_det: 120
                max_pairs: 2000
                max_samples: 1024
                mid_band_Hz:
                - 0.5
                - 2.0
                min_good_frac: 0.7
                reg_weight: 0.3
                seed: 12345
                tail_weight: 0.0
                topmode_weight: 0.1
              corr_grouping:
                clean_residual: true
                corr_min: 0.6
                enabled: true
                max_samples: 20000
                metric: abs
                min_good_frac: 0.7
                min_group_size: 6
                min_overlap: 200
              enabled: true
              grouping:
              - corr_nw
              marchenko_pastur:
                band_high_Hz: 0.0
                band_low_Hz: 0.0
                bulk_keep_frac: 0.8
                clip_z: 12.0
                enabled: false
                grouping: []
                max_modes: 64
                max_samples: 20000
                min_good_frac: 0.8
                q_grid_size: 64
              mask_radius_arcsec: 15
              null_model:
                enabled: false
                grouping:
                - nw
                max_modes: 32
                max_samples: 2000
                min_good_frac: 0.9
                n_surrogates: 16
                quantile: 0.98
                seed: 12345
              standard_pca:
                enabled: true
                n_calc: 0
                n_eig_to_cut:
                  a1100:
                  - 3
                  a1400:
                  - 3
                  a2000:
                  - 3
                stddev_limit: 0
              tau: 0.0
            flagging:
              lower_tod_inv_var_factor: 0.0
              second_pass_local:
                baseline_window_sec: 0.25
                cluster_events_sec: 0.08
                delta_half_peak_frac: 0.5
                delta_max_width_sec: 0.025
                delta_sigma_scale: 0.75
                delta_window_sec: 0.06
                enabled: false
                high_score_cluster_override: 9.0
                max_auto_flag_clusters_per_network: 3
                max_step_shift_z: 3.0
                merge_within_detector_sec: 0.08
                min_cluster_detectors: 3
                min_good_frac: 0.5
                min_spike_sigma: 8.0
                raw_candidate_rel_sigma_scale: 1.0
