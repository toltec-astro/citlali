                  enabled: false
                  ref: 0.05
                  span: 0.25
                  weight: 0.5
                cm_low_mid_ratio:
                  enabled: false
                  low_band_Hz:
                  - 0.05
                  - 0.5
                  mid_band_Hz:
                  - 0.5
                  - 2.0
                  ref: 0.6
                  span: 2.0
                  weight: 0.5
                enabled: false
                exponent: 2.0
                floor: 0.05
                max_pairs: 4000
                max_samples: 20000
                min_good_frac: 0.7
                min_overlap: 200
                pair_corr:
                  enabled: false
                  ref: 0.05
                  span: 0.15
                  weight: 1.0
                seed: 12345
              lower_map_weight_factor: 0.001
              median_map_weight_factor: 10
              type: full
              upper_map_weight_factor: 16.0
          raw_time_chunk:
            IIR_filter:
              enabled: false
              freq_Hz: 0.05
              order: 1
              zero_phase: true
            altaz_destripe:
              enabled: true
              fit_derivs: true
              fit_time_trend: true
              grouping: nw
