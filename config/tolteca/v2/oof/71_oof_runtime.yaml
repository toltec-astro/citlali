# Citlali executable and ordinary runtime resources.
# TolPROJ supplies this file; site operators may adjust it.
# Set n_threads to the CPU allocation available to this reduction.
reduce:
  jobkey: reduced

  # Citlali executable and runtime settings
  steps:
    0:
      path: /work/toltec/citlali_dev/citlali_refactor/build/bin/citlali
      config:
        low_level:

          # CPU use, output location, and log verbosity
          runtime:
            n_threads: 6
            output_dir: .
            use_subdir: true
            verbose: true
