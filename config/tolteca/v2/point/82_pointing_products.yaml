# Primary user-facing pointing product choices.
# Edit noise products, filtering, fitting, source finding, and retained TOD products here.
# Source finding remains experimental and disabled in the accepted policy.
# TOD indices are used only when the corresponding output.enabled value is true.
# Wiener settings apply when map_filtering.type is wiener_filter.
reduce:
  steps:
    0:
      config:
        low_level:

          # Noise realizations and empirical summaries
          noise_maps:
            enabled: true
            n_noise_maps: 5
            randomize_dets: false
            write_realizations: false
            products:
              enabled: true
              apply_empirical_weights: true

          # Filtered maps, source catalogs, and source fits
          post_processing:
            map_filtering:
              enabled: true
              type: wiener_filter
              normalize_errors: false
            map_histogram_n_bins: 50

            # Experimental source catalog; leave disabled for validated production
            source_finding:
              enabled: false
              mode: default
              source_sigma: 5.0
              source_window_arcsec: 10.0
            source_fitting:
              model: gaussian
              bounding_box_arcsec: 30
              fitting_radius_arcsec: 40

          # User-facing Wiener template choices
          wiener_filter:
            template_type: gaussian
            template_fwhm_arcsec:
              a1100: 2.5
              a1400: 3.5
              a2000: 5.0
            lowpass_only: false

          # Optional retained raw and processed TOD products
          timestream:

            # Raw calibrated TOD output
            raw_time_chunk:
              output:
                enabled: true
                indices: all

            # Cleaned and weighted TOD output
            processed_time_chunk:
              output:
                enabled: true
                indices: all
