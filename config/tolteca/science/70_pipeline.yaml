# Repository-managed canonical policy; normal users do not edit this file.
reduce:
  jobkey: reduced
  inputs:
  - path: ../data
    select: obsnum == OBSNUM
  steps:
  - name: citlali
    path: /work/toltec/citlali_dev/citlali_refactor/build/bin/citlali
    config:
      cal_items:
      - beammap_source:
          fluxes:
          - array_name: a1100
            uncertainty_mJy: 0.05
            value_mJy: 0.0
          - array_name: a1400
            uncertainty_mJy: 0.05
            value_mJy: 0.0
          - array_name: a2000
            uncertainty_mJy: 0.05
            value_mJy: 0.0
        type: photometry
      - pointing_offsets:
        - axes_name: az
          value_arcsec:
          - 0.0
        - axes_name: alt
          value_arcsec:
          - 0.0
        type: astrometry
      - filepath: ../apts/apt_OBSNUM_matched.ecsv
        meta:
          interface: apt
        select: obsnum == OBSNUM
        type: array_prop_table
      cal_objs: []
      low_level:
        beammap:
          derotate: true
          flagging:
            array_lower_fwhm_arcsec:
            - 4.0
            - 5.0
            - 8.0
            array_lower_sig2noise:
            - 5
            - 5
            - 5
            array_max_dist_arcsec:
            - 120
            - 120
            - 120
            array_upper_fwhm_arcsec:
            - 10
            - 12
            - 15
            array_upper_sig2noise:
            - 0
            - 0
            - 0
            sens_factors:
            - 0
            - 0
          iter_max: 10
          iter_tolerance: 0.02
          reference_det: -99
          sens_psd_limits_Hz:
          - 0
          - 0
          subtract_reference_det: true
        coadd:
          enabled: true
        interface_sync_offset:
        - toltec0: 0
        - toltec1: 0
        - toltec2: 0
        - toltec3: 0
        - toltec4: 0
        - toltec5: 0
        - toltec6: 0
        - toltec7: 0
        - toltec8: 0
        - toltec9: 0
        - toltec10: 0
        - toltec11: 0
        - toltec12: 0
        - hwpr: 0
        kids:
          fitter:
            modelspec: gainlintrend
            weight_window:
              fwhm_Hz: 1.5e4
              type: lorentz
          solver:
            extra_output: false
            fitreportdir: ../data
            parallel_policy: seq
        mapmaking:
          coverage_cut: 0.5
          crpix1: 0
          crpix2: 0
          crval1_J2000: 0
          crval2_J2000: 0
          cunit: mJy/beam
          enabled: true
          grouping: auto
          jinc_filter:
