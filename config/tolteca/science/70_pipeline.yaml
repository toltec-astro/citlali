            shape_params:
              a1100:
              - 1.1
              - 1.67
              - 2.0
              a1400:
              - 1.1
              - 2.17
              - 2.0
              a2000:
              - 1.1
              - 3.17
              - 2.0
            subpixel_n: 1
          maximum_likelihood:
            max_iterations: 50
            tolerance: 1e-20
          method: jinc
          pixel_axes: radec
          pixel_size_arcsec: 2.0
          tan_dec: 0
          tan_ra: 0
          x_size_pix: 0
          y_size_pix: 0
