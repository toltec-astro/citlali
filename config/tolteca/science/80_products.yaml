# Standard product policy for this mode; values intentionally reassert the baseline.
reduce:
  steps:
    0:
      config:
        low_level:
          coadd:
            enabled: true
          noise_maps:
            enabled: true
            n_noise_maps: 10
            products:
              enabled: false
            randomize_dets: false
          post_processing:
            map_filtering:
              edge_guard:
                enabled: true
                fill_mode: core_median
                guard_radius_fwhm: 1.0
                hits_core_fraction: 0.15
                hits_threshold_mode: core_median_fraction
                taper_min_fraction: 0.25
                taper_mode: none
                weight_threshold_mode: coverage_cut
              enabled: true
              normalize_errors: false
              type: wiener_filter
            map_histogram_n_bins: 20
            source_finding:
              enabled: false
              mode: default
              source_sigma: 0.0
              source_window_arcsec: 0
            source_fitting:
              bounding_box_arcsec: 10
              fitting_radius_arcsec: 30
              gauss_model:
                amp_limit_factors:
                - 0.0
                - 0.0
                fit_rotation_angle: false
                fwhm_limit_factors:
                - 0.0
                - 0.0
              model: gaussian
          wiener_filter:
            denom_check_iters: 0
            denom_rel_tol: 0.0001
            lowpass_only: true
            max_denom_iters: 0
            max_loops: 500
            tail_frac_tol: 0.05
            template_fwhm_arcsec:
              a1100: 18.0
              a1400: 18.0
              a2000: 18.0
            template_type: kernel
          timestream:
            output:
              rtcdiag:
                enabled: true
              stats:
                eigenvalues: false
              subdir_name: null
            raw_time_chunk:
              output:
                enabled: false
                indices:
                - 12
                - 19
                - 23
                - 36
                - 39
                - 60
                mode: mini
            processed_time_chunk:
              output:
                enabled: false
                indices:
                - 12
                - 19
                - 23
                - 36
                - 39
                - 60
                mode: mini
            fruit_loops:
              save_all_iters: true
