# Standard product policy for this mode; values intentionally reassert the baseline.
reduce:
  steps:
    0:
      config:
        low_level:
          coadd:
            enabled: false
          noise_maps:
            enabled: true
            n_noise_maps: 5
            products:
              apply_empirical_weights: true
              enabled: true
            randomize_dets: false
            write_realizations: false
          post_processing:
            map_filtering:
              edge_guard:
                enabled: true
                fill_mode: core_median
                guard_radius_fwhm: 1.0
                hits_core_fraction: 0.15
                hits_threshold_mode: core_median_fraction
                taper_min_fraction: 0.25
                taper_mode: none
                weight_threshold_mode: coverage_cut
              enabled: true
              normalize_errors: false
              type: wiener_filter
            map_histogram_n_bins: 50
            source_finding:
              enabled: false
              mode: default
              source_sigma: 5.0
              source_window_arcsec: 10.0
            source_fitting:
              bounding_box_arcsec: 30
              fitting_radius_arcsec: 40
              gauss_model:
                amp_limit_factors:
                - 0.0
                - 0.0
                fit_rotation_angle: false
                fwhm_limit_factors:
                - 0.0
                - 0.0
              model: gaussian
          wiener_filter:
            denom_check_iters: 0
            denom_rel_tol: 0.0001
            kernel_template_tail_mode: zero
            lowpass_only: false
            max_denom_iters: 0
            max_loops: 500
            tail_frac_tol: 0.05
            template_fwhm_arcsec:
              a1100: 2.5
              a1400: 3.5
              a2000: 5.0
            template_type: gaussian
          timestream:
            output:
              stats:
                eigenvalues: false
              subdir_name: null
            raw_time_chunk:
              output:
                enabled: true
                indices: all
                mode: mini
                outer_context_samples: 0
            processed_time_chunk:
              output:
                enabled: true
                indices: all
                mode: mini
            fruit_loops:
              save_all_iters: true
