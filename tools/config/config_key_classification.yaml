schema: citlali-config-key-classification-rules-v1
policy_version: provisional-baseline-v1
policy_date: 2026-07-02
description: >
  Provisional baseline v1 exposure policy for low-level Citlali YAML keys
  observed in TolTECA reduction baselines. This is review metadata only; it
  does not change runtime parsing or validation.
fallback:
  classification: expert
  owner: citlali
  reason: >
    No explicit classification rule matched. Keep the key available only through
    expert low-level overrides until a maintainer reviews it.
classes:
  user-facing: >
    Should be expressible by compact profile fields or normal TolTECA authoring
    choices.
  expert: >
    Valid tuning, diagnostic, or algorithm-control key, but hidden behind an
    explicit expert override in compact configs.
  hidden/internal: >
    Assembled by TolTECA, owned by runtime/profile plumbing, or otherwise not a
    normal authoring knob.
  deprecated: >
    Retained for compatibility or historical baselines, but should be replaced
    by a current key or removed after validation.
rules:
  - id: deprecated-precompute-pointing
    pattern: timestream.precompute_pointing
    classification: deprecated
    owner: citlali
    reason: data/config.yaml marks this key ignored.
  - id: deprecated-legacy-ptc-cleaner-blocks
    pattern: timestream.processed_time_chunk.standard_pca*
    classification: deprecated
    owner: citlali
    reason: Legacy cleaner location; current config uses timestream.processed_time_chunk.clean.standard_pca.
  - id: deprecated-legacy-ptc-null-model-block
    pattern: timestream.processed_time_chunk.null_model*
    classification: deprecated
    owner: citlali
    reason: Legacy cleaner location; current config uses timestream.processed_time_chunk.clean.null_model.
  - id: deprecated-legacy-ptc-mp-block
    pattern: timestream.processed_time_chunk.marchenko_pastur*
    classification: deprecated
    owner: citlali
    reason: Legacy cleaner location; current config uses timestream.processed_time_chunk.clean.marchenko_pastur.
  - id: deprecated-legacy-standard-pca-aliases
    pattern: timestream.processed_time_chunk.clean.n_eig_to_cut*
    classification: deprecated
    owner: citlali
    reason: Legacy standard-PCA alias; prefer clean.standard_pca.n_eig_to_cut.
  - id: deprecated-legacy-standard-pca-ncalc
    pattern: timestream.processed_time_chunk.clean.n_calc
    classification: deprecated
    owner: citlali
    reason: Legacy standard-PCA alias; prefer clean.standard_pca.n_calc.
  - id: deprecated-legacy-standard-pca-stddev
    pattern: timestream.processed_time_chunk.clean.stddev_limit
    classification: deprecated
    owner: citlali
    reason: Legacy standard-PCA alias; prefer clean.standard_pca.stddev_limit.
  - id: deprecated-legacy-standard-pca-cut-std
    pattern: timestream.processed_time_chunk.clean.cut_std
    classification: deprecated
    owner: citlali
    reason: Historical cleaner field not present in the current default config surface.
  - id: deprecated-legacy-weighting-pair-corr
    pattern: timestream.processed_time_chunk.weighting.pair_corr*
    classification: deprecated
    owner: citlali
    reason: Legacy weighting-correlation location; prefer weighting.corr_penalty.pair_corr.
  - id: deprecated-legacy-weighting-cm-el-corr
    pattern: timestream.processed_time_chunk.weighting.cm_el_corr*
    classification: deprecated
    owner: citlali
    reason: Legacy weighting-correlation location; prefer weighting.corr_penalty.cm_el_corr.
  - id: deprecated-legacy-weighting-cm-low-mid-ratio
    pattern: timestream.processed_time_chunk.weighting.cm_low_mid_ratio*
    classification: deprecated
    owner: citlali
    reason: Legacy weighting-correlation location; prefer weighting.corr_penalty.cm_low_mid_ratio.
  - id: deprecated-ignored-mapmaking-tangent
    pattern: mapmaking.tan_*
    classification: deprecated
    owner: citlali
    reason: data/config.yaml marks tangent-plane RA/Dec fields ignored for now.

  - id: internal-tolteca-input-assembly
    pattern: inputs*
    classification: hidden/internal
    owner: tolteca
    reason: TolTECA assembles inputs and calibration items into generated citlali_*.yaml files.
  - id: internal-runtime-meta
    pattern: runtime.meta*
    classification: hidden/internal
    owner: tolteca
    reason: Runtime metadata is generated provenance, not a reducer-authored knob.
  - id: internal-gap-interpolation
    pattern: runtime.interp_over_gaps
    classification: hidden/internal
    owner: citlali
    reason: Current runtime expects this to stay true; compact profiles should own it.
  - id: internal-timestream-type
    pattern: timestream.type
    classification: hidden/internal
    owner: profile
    reason: Normal reductions use profile-selected TOD type rather than exposing xs/rs/is/qs in compact configs.

