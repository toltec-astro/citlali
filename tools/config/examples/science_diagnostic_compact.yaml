schema: citlali-reduction-v2
mode: science
profile: science_diagnostic

inputs:
  legacy: ../../../data/config.yaml

output:
  dir: /path/to/redu/directory/
  subdir: true
  verbose: true

runtime:
  threads: 8
  parallel: omp

map:
  unit: mJy/beam
  method: naive
  grouping: auto
  pixel_axes: radec
  pixel_size_arcsec: 1.0
  center: auto
  size: auto
  coadd: false

products:
  maps: true
  noise: true
  noise_count: 8
  noise_products: true
  noise_realizations: false
  tod: both
  diagnostics: verbose

processing:
  tod: true
  clean: standard
  clean_grouping: [array]
  weighting: full
  fruitloops: off
  fruitloops_iters: 1

expert:
  timestream:
    processed_time_chunk:
      clean:
        standard_pca:
          n_eig_to_cut:
            a1100: [3]
            a1400: [3]
            a2000: [3]
