schema: citlali-reduction-v2
mode: beammap
profile: beammap_detector

inputs:
  legacy: ../../../data/config.yaml

output:
  dir: /path/to/redu/directory/
  subdir: true
  verbose: false

runtime:
  threads: 8
  parallel: omp

map:
  unit: mJy/beam
  method: naive
  grouping: detector
  pixel_axes: radec
  pixel_size_arcsec: 1.0
  center: auto
  size: auto
  coadd: false

products:
  maps: true
  noise: false
  noise_count: 1
  noise_products: true
  noise_realizations: false
  tod: none
  diagnostics: normal

processing:
  tod: true
  clean: off
  clean_grouping: [array]
  weighting: full
  fruitloops: off
  fruitloops_iters: 1

beammap:
  iterations: 1
  convergence_tolerance: 0.0
  derotate: false
  subtract_reference_det: true
  reference_det: -99
  detector_weighting: const
  detector_tod: false
  priors:
    enabled: false

expert: {}
