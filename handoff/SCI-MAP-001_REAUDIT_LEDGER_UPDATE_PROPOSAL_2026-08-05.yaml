  - id: SCI-MAP-001-F001
    current_status: open
    proposed_status: closed
    disposition: close_scoped_finding
    basis: >-
      One staged ordinary primitive, exact sequential/requested-parallel
      realization behavior, mutex-protected scan commits, and passing focused
      TSan evidence satisfy the scoped race finding.
  - id: SCI-MAP-001-F002
    current_status: open
    proposed_status: closed
    disposition: close_scoped_finding
    basis: >-
      Finite-positive support, pre-payload invalid skips, separate masks, and
      authoritative raw validity pass local and returned-product checks.
  - id: SCI-MAP-001-F003
    current_status: open
    proposed_status: closed
    disposition: close_scoped_finding
    basis: >-
      Full binary64 identity and two-phase centered coadd admission reject a
      mismatch before mutation; physical FITS loss remains assigned to F007.
  - id: SCI-MAP-001-F004
    current_status: open
    proposed_status: open
    disposition: retain_open
    basis: >-
      Same-case S-X observation realizations and independent raw/trace
      authority are absent, and the NOI/covariance boundary remains open.
  - id: SCI-MAP-001-F005
    current_status: open
    proposed_status: open
    disposition: retain_open
    basis: >-
      Finite staged floating and integer contributions can overflow at merge,
      and finite projected coordinates can reach rounding outside the
      representable index domain without fail-closed atomic rejection.
  - id: SCI-MAP-001-F006
    current_status: open
    proposed_status: closed
    disposition: close_scoped_finding
    basis: >-
      Persisted coefficient semantics are nonprecision by default and no
      unconditional uncertainty, significance, or inverse-variance coadd is
      published; SCI-PTC-001 remains open.
  - id: SCI-MAP-001-F007
    current_status: open
    proposed_status: open
    disposition: retain_open
    basis: >-
      Production FITS WCS fails the registered 1e-12-degree typed-identity
      bound, and realized threshold cards fail exact binary64 persistence.
  - id: SCI-MAP-001-F008
    current_status: open
    proposed_status: closed
    disposition: close_scoped_finding
    basis: >-
      Versioned sidecars losslessly preserve identity, policies, products,
      membership, thresholds, and raw-parent digests and pass tamper tests;
      unavailable independent raw authority remains assigned to F012.
  - id: SCI-MAP-001-F009
    current_status: addressed_pending_reaudit
    proposed_status: closed
    disposition: close_after_reaudit
    basis: >-
      Strict admission, centered integer embedding, L=I, the nonprecision
      normalized mean, invalid exclusion, and atomic coadd behavior conform;
      six returned coadds recombine exactly.
  - id: SCI-MAP-001-F010
    current_status: addressed_pending_reaudit
    proposed_status: addressed_pending_reaudit
    disposition: retain_pending
    basis: >-
      The returned eight facts, masks, aliases, and practical threshold
      behavior agree, but aggregate overflow prevents an all-input exact claim
      and exact WTTHRESH card round trips fail.
  - id: SCI-MAP-001-F011
    current_status: open
    proposed_status: open
    disposition: retain_open
    basis: >-
      All executed local gates pass, but registered states for production
      typed/FITS WCS, aggregate overflow/index range, concurrent noise merge,
      noise gamma bounds, and complete legacy-WCS atomicity are not tested.
  - id: SCI-MAP-001-F012
    current_status: open
    proposed_status: open
    disposition: retain_open_insufficient_evidence
    basis: >-
      The authentic seven-case corpus lacks approved raw/trace and
      wrapper/Slurm lanes, lacks direct same-case S-X observation
      realizations, and fails registered WCS and threshold-card checks.
  - id: SCI-MAP-001-F013
    current_status: open
    proposed_status: open
    disposition: retain_open_conditioned
    dependencies:
      - SCI-ALIGN-001
      - SCI-CAL-001
      - SCI-AST-001
      - SCI-PTC-001
      - SCI-VAL-001
    basis: MAP evidence closes none of the five governing dependencies.

