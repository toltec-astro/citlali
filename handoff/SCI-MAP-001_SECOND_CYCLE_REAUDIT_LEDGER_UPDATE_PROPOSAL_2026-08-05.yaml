  smallest_remaining_defect: >-
    Noise completion applies one global filtered-stage multiplier to both
    observation and coadd products, although coadd-enabled observation output
    has one raw stage and coadd output has raw plus filtered stages. The
    coadd-plus-filter state consequently overstates empirical-product maps and
    realization image writes and has no exact regression test.

finding_updates:
  - id: SCI-MAP-001-F001
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      The ordinary sequential/requested-parallel and concurrent realization
      path remains mutex-protected and exact within its registered policy; the
      focused TSan target passes 9/9.
  - id: SCI-MAP-001-F002
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      Explicit invalidity, finite-positive support, distinct masks, and
      required-companion validity behavior are unchanged by the bounded repair.
  - id: SCI-MAP-001-F003
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      Full binary64 identity and two-phase centered admission remain atomic;
      the legacy WCS object is now part of the failed-admission state digest.
  - id: SCI-MAP-001-F004
    pre_reaudit_status: open
    proposed_status: open
    disposition: retain_open_smallest_defect
    basis: >-
      Raw observation realizations now persist with coaddition, but the
      coadd-plus-filter state records 24 realization image writes for an actual
      routed 18 and 12 empirical-product maps for an actual 9 in the inspected
      three-map/two-realization example.
  - id: SCI-MAP-001-F005
    pre_reaudit_status: open
    proposed_status: closed
    disposition: close_after_second_cycle_reaudit
    basis: >-
      Staged and live floating, realization, and signed-count overflow plus
      finite out-of-index projection reject before any live bundle mutation.
  - id: SCI-MAP-001-F006
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      Nonprecision coefficient semantics and the absence of an unauthorized
      covariance, uncertainty, or significance claim are unchanged.
  - id: SCI-MAP-001-F007
    pre_reaudit_status: open
    proposed_status: closed
    disposition: close_after_second_cycle_reaudit
    basis: >-
      The production path passes the amended WCS separation, exact
      sign/orientation/integer-centering, exact-sidecar authority, and
      finite/unit/identity/alias/rtol threshold-card contract.
  - id: SCI-MAP-001-F008
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      Lossless one-way identity, threshold, membership, product, and raw-parent
      sidecar authority remains intact and tamper-rejected. The new
      stage-cardinality discrepancy is assigned to the F004 realization
      persistence repair surface.
  - id: SCI-MAP-001-F009
    pre_reaudit_status: closed_scoped
    proposed_status: closed
    disposition: confirm_prior_scoped_closure
    basis: >-
      Centered integer embedding, L=I, strict bundle admission, and normalized
      nonprecision coadd arithmetic are unchanged.
  - id: SCI-MAP-001-F010
    pre_reaudit_status: addressed_pending_reaudit
    proposed_status: closed
    disposition: close_after_second_cycle_reaudit
    basis: >-
      The eight facts, masks, aliases, exact sidecar threshold authority,
      aggregate safety, and amended FITS-card relations conform without
      changing threshold or coadd arithmetic.
  - id: SCI-MAP-001-F011
    pre_reaudit_status: open
    proposed_status: open
    disposition: retain_open_missing_and_failing_state
    basis: >-
      All executed gates pass, but the required coadd-plus-filter
      realization/product cardinality state is untested and nonconformant.
  - id: SCI-MAP-001-F012
    pre_reaudit_status: owner_resolved_bounded
    proposed_status: closed_bounded_owner_accepted
    disposition: close_only_owner_amended_external_scope
    basis: >-
      Accept only exact-ed28 execution, successful completion, returned
      product/inventory, visible observation/coadd, and sequential/OpenMP
      claims. Missing raw/trace/operational and same-case S-X observation
      realization lanes remain limitations and were not rerun.
  - id: SCI-MAP-001-F013
    pre_reaudit_status: open_conditioned
    proposed_status: open_conditioned
    disposition: retain_open_conditioned
