spack:
  include:
    - ../../config/repos.yaml
    - ../../config/macos/packages.yaml

  specs:
    - >-
      kidscpp@3.1.0 %cxx=llvm@20.1.8
      ^tula@3.1.0+ecsv+netcdf+enum+grppi+openmp
      ^netcdf-c@4.10.0+shared~blosc+szip+zstd build_system=cmake
      ^hdf5@1.14.6+hl+shared~mpi~szip

  concretizer:
    unify: true
    reuse: false

  view:
    default:
      root: .spack-view
      link: roots

  develop:
    tula-cmake:
      spec: tula-cmake@3.2.0
      path: ../../../../tula_cmake
    tula-logging:
      spec: tula-logging@1.0.0
      path: ../../../../tula_cmake/packages/tula_logging
    tula-yaml-cpp:
      spec: tula-yaml-cpp@0.8.0
      path: ../../../../tula_cmake/packages/tula_yaml_cpp
    tula-eigen3:
      spec: tula-eigen3@3.4.0
      path: ../../../../tula_cmake/packages/tula_eigen3
    tula-netcdf-cxx4:
      spec: tula-netcdf-cxx4@4.3.1
      path: ../../compat/tula_netcdf_cxx4
    tula-perflibs:
      spec: tula-perflibs@0.1.0+openmp
      path: ../../../../tula_cmake/packages/tula_perflibs
    tula:
      spec: tula@3.1.0+openmp
      path: ../../../../tula
    kidscpp:
      spec: kidscpp@3.1.0
      path: ../../../../kidscpp
