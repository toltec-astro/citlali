beammap: # beammap controls (node required, but options ignored if not beammapping)
  iter_max: 1 # maximum number of iterations for beammapping (>0)
  derotate: false # derotate beammap to zero elevation
  subtract_reference_det: true # enable subtraction of reference detector position
  reference_det: -99 # reference detector index for APT positions (if <0 and enabled, use median of nw=3; fallback nw=2,3,4)
  iter_tolerance: 0.0 # tolerance for iterations (if 0 all iterations are performed, tod output will be for last iteration)
  sens_psd_limits_Hz: [0,0] # lower and upper limits for psd in sensitivity calculation
  rfi_mask: # optional robust masking of short high-variance timestream bursts in detector-grouped beammaps
    enabled: false # enable or disable sample-level masking before mapmaking
    block_size_samples: 64 # block size for robust derivative-variance checks (>=8)
    min_good_samples: 32 # minimum unflagged finite samples per block used in stats (>=4)
    dilate_blocks: 1 # extend each detected bad block by this many neighboring blocks
    sigma_threshold: 6.0 # block MAD(diff) threshold in units of detector global MAD(diff)
    sigma_floor: 0.0 # absolute MAD(diff) floor in timestream units (ignored if 0)
    max_flagged_fraction: 0.35 # skip masking for a detector if proposed mask exceeds this fraction of its good samples
  scan_band_mask: # optional edge-band masking for coherent bad scan legs in detector-grouped beammaps
    enabled: false # identify bad top/bottom map bands and flag the corresponding TOD samples before fitting
    edge_rows: 24 # inspect up to this many rows from each map edge
    min_row_pixels: 8 # minimum positive-weight pixels required for a row to be considered
    min_contiguous_rows: 2 # require at least this many adjacent bad rows at an edge
    row_median_sigma_threshold: 4.0 # flag rows if |row median - interior median| exceeds this many interior MAD sigmas
    row_sigma_ratio_threshold: 2.5 # flag rows if row MAD exceeds this multiple of the interior-row MAD median
    max_flagged_fraction: 0.30 # skip masking for a detector if proposed sample mask exceeds this fraction of its good samples
  split_fits_by_flag: # optional split output of detector-grouped beammap FITS by detector quality flag
    enabled: false # if true, write separate FITS files for requested detector flag values
    flag_values: [0, 1] # detector flag values to include (e.g. 0=good, 1=bad)
  priors: # optional soft priors for beammap fit initialization in detector grouping
    enabled: false # enable prior-guided seed selection for map peak finding
    filepath: data/beammap_priors/beammap_slot_priors_soft_v1.ecsv # ECSV slot prior table path
    candidate_top_n: 64 # evaluate this many highest-S/N pixels per map
    min_snr: 0.0 # ignore candidate pixels below this robust map significance (median/MAD, weighted)
    max_d2: 25.0 # prior gating: require nearest-slot Mahalanobis d^2 <= max_d2 (0 disables gate)
    score_lambda: 2.0 # score = snr - score_lambda * d^2
    fallback_blind: true # if no prior candidate survives, run blind fit initialization
  flagging: # these parameters control how the beammapping algorithm flags bad detectors (array order for flagging is [1.1, 1.4, 2.0])
    array_lower_fwhm_arcsec: [0,0,0] # lower limits for fitted array fwhm values (used for flagging only)
    array_upper_fwhm_arcsec: [99,99,99] # upper limits for fitted array fwhm values (ignored if <0, flagging only)
    array_lower_sig2noise: [0,0,0] # lower limits for fitted array S/N values (used for flagging only)
    array_upper_sig2noise: [0,0,0] # upper limits for fitted array S/N values (ignored if <0, flagging only)
    array_max_dist_arcsec: [0,0,0] # max allowed distance from mean of all positions for each array (ignored if <0, flagging only)
    max_prior_d2: 0.0 # max allowed nearest-slot prior-space Mahalanobis d^2 for final position (ignored if <=0 or priors unavailable)
    sens_factors: [0,0] # per network lower and upper multiplicative factors on median sensitivty (ignored if 0, flagging only)
coadd: # coaddition controls
  enabled: false # enable or disable coaddition
noise_maps: # noise map controls (coadded noise maps if coadd enabled, obs noise maps if disabled)
  enabled: false # enable or disable noise maps
  n_noise_maps: 1 # number of noise maps (>0).
  randomize_dets: true # randomize jackknifed noise maps on time chunks and detectors if true. only on time chunks if false.
interface_sync_offset: # manual timing offsets for each nw/hwpr (in seconds)
  - toltec0: 0
  - toltec1: 0
  - toltec2: 0
  - toltec3: 0
  - toltec4: 0
  - toltec5: 0
  - toltec6: 0
  - toltec7: 0
  - toltec8: 0
  - toltec9: 0
  - toltec10: 0
  - toltec11: 0
  - toltec12: 0
  - hwpr: 0
kids: # kids fitting parameters
  fitter:
    modelspec: gainlintrend
    weight_window:
      fwhm_Hz: 1.5e4
      type: lorentz
  solver:
    fitreportdir: /path/to/fit/report/directory/ # directory to grab fit report from
    parallel_policy: seq # parallel policy for kids solver (independent of citlali parallel_policy)
    extra_output: false
mapmaking: # mapmaking parameters
  enabled: true # enable or disable mapmaking (useful when TOD processing only)
  crpix1: 0 # ref pixel 1 (ignored if 0)
  crpix2: 0 # ref pixel 2 (ignored if 0)
  crval1_J2000: 0 # ref value 1 (ignored if 0)
  crval2_J2000: 0 # ref value 2 (ignored if 0)
  tan_ra: 0 # tangent plane ra (ignored for now)
  tan_dec: 0 # tangent plane dec (ignored for now)
  cunit: mJy/beam # units (mJy/beam, MJy/sr, uK, Jy/pixel.  apt table flux conversion default is mJy/beam)
  grouping: auto # mapmaking grouping (auto, detector, nw, array, fg)
  method: naive # mapmaking algorithm (naive, jinc, maximum_likelihood)
  pixel_axes: radec # reference frame (radec or altaz)
  pixel_size_arcsec: 1.0 # pixel size in arceconds (used for all obs and coadded maps)
  x_size_pix: 0 # manually specify number of map columns (forced to be odd)
  y_size_pix: 0 # manually specify number of map rows (forced to be odd)
  coverage_cut: 0.0 # coverage cut value for psd, hist, and coverage_bool maps
  jinc_filter: # parameters to control jinc filter shape (map_method = jinc required)
    r_max: 3.0 # max radius to apply filter to (max radius = r_max x lambda/diameter)
    subpixel_n: 1 # sub-pixel kernel sampling (1 = off, 2-8 typical)
    shape_params: # a, b (beam-size/3), c
      a1100: [1.1, 1.67, 2.0] # default: [1.1, 1.67, 2.0]
      a1400: [1.1, 2.17, 2.0] # default: [1.1, 2.17, 2.0]
      a2000: [1.1, 3.17, 2.0] # default: [1.1, 3.17, 2.0]
  maximum_likelihood: # controls for built in maximum-likelihood mapmaker (under development)
    max_iterations: 50 # maximum number of iterations to run conjugate gradient for
    tolerance: 1e-20 # tolerance
runtime: # parameters to control how citlali runs
  verbose: true # extra debug output in terminal (same as -l debug).  adds summary files to obsnum/logs/ directory.
  interp_over_gaps: true # find and interpolate over gaps in the timestreams
  meta:
    version: tolteca... # extra info from tolteca
  n_threads: 1 # number of threads to use
  output_dir: /path/to/redu/directory/ # path to output directory
  parallel_policy: seq # parallelization policy (seq=sequential, omp=OpenMP parallelization)
  reduction_type: science # reduction engine (science, pointing, beammap)
  use_subdir: true # create "redu00, redu01,..." sub-directories.  increments automatically.
timestream: # timestream reduction parameters
  type: xs # type of TOD (xs, rs, is, qs)
  enabled: true # enable or disable TOD processing (to be implemented)
  precompute_pointing: false # compute detector pointing once (ignored for now)
  chunking: # how to chunk timestreams
    force_chunking: false # ignore map pattern chunking and use config file chunk length
    value: 10.0 # either chunk length or number of chunks for lissajous/rastajous maps (ignored if raster map)
    chunk_mode: duration # how to subdivide chunks, either by time (duration) or number (number)
  polarimetry: # polarized reduction
    enabled: false # enable or disable polarized reduction
    ignore_hwpr: auto # override automatic hwpr finding (true, false, auto)
    grouping: fg # use all matched detectors (fg) or only matched detectors with a pair (loc)
  output: # controls options for writing out TOD as netCDF file
    subdir_name: null # optional subdirectory name for tod output files (ignored if null)
    stats: # controls for what variables to include in stats file
      eigenvalues: false # include first 64 eigenvalues in stats file
  raw_time_chunk:
    despike: # remove cosmic ray spikes
      enabled: false # enable or disable despiking
      min_spike_sigma: 8.0 # minimum spike sigma value (n x sigma of TOD)
      time_constant_sec: 0.015 # spike decay time
      window_size: 32 # number of samples to flag on either side of spike (ignored if TOD filtering)
    downsample: # downsample the data
      enabled: false # enable or disable downsampling
      factor: 1 # downsample factor (integer only, ignored if <=0)
      downsampled_freq_Hz: 0 # specify downsample frequency (used if factor<=0, must be <= raw sampling factor)
    filter: # tod filtering
      enabled: false # enable or disable tod filtering
      a_gibbs: 50.0 # Kaiser-Bessel filter shape param
      freq_high_Hz: 16.0 # upper freq limit
      freq_low_Hz: 0.0 # lower freq limit
      n_terms: 32 # size of filter in samples
      notch: # optional notch filtering (applied after FIR)
        enabled: false # enable or disable notch filtering
        freqs_Hz: [10.5] # notch center frequencies in Hz
        delta_f_Hz: [1.0] # notch widths in Hz (per freq)
    IIR_filter: # optional highpass IIR filtering (applied after FIR/notch)
      enabled: false # enable or disable IIR highpass filtering
      freq_Hz: 0.1 # highpass cutoff frequency in Hz
      order: 1 # number of cascaded first-order highpass sections
      zero_phase: false # run forward-backward to remove phase delay
    kernel: # make synthetic timestreams for reduction characterization
      enabled: false # enable or disable kernel generation
      filepath: null # filepath to FITS file with kernel
      fwhm_arcsec: 0 # manually specify fwhm for gaussian/airy kernel (ignored if 0)
      image_ext_name: signal # extention name if FITS file
      type: gaussian # how to make kernel (gaussian, airy, fits)
    flux_calibration: # flux calibration
      enabled: false # enable or disable flux calibration
    extinction_correction: # extinction correction (per sample, tau for each band calculated from fit to atm models)
      enabled: false # enable or disable extinction correction
    flagging: # controls flagging before cleaning
      delta_f_min_Hz: 60.e3 # lower limit on frequency separation for flagging tones
      lower_tod_inv_var_factor: 0.0 # flag detectors below this inv variance limit (ignored if 0)
      upper_tod_inv_var_factor: 0.0 # flag detectors above this inv variance limit (ignored if 0)
    output:
      enabled: false # enable or disable rtc TOD output
      indices: all # chunk indices to write: "all" or [1,3,7] (1-based)
      mode: full # RTC TOD output mode: full or mini (mini uses float32 signal, byte flags, no per-det pointing/kernel)
  processed_time_chunk:
    clean: # remove (hopefully) the atmospheric signal
      enabled: false # enable or disable cleaning
      stddev_limit: 0.0 # standard deviation cut for cleaning (only used if >0)
      n_calc: 64 # number of eigenvalues to calculate for stddev_limit (0 => full spectrum)
      null_model: # brute-force mode cut using null surrogates (overrides stddev_limit / n_eig_to_cut when enabled)
        enabled: false
        n_surrogates: 16 # number of random circular-shift surrogate realizations
        quantile: 0.99 # null envelope quantile in [0.5, 1)
        min_good_frac: 0.8 # minimum unflagged sample fraction per detector
        max_modes: 64 # max modes to evaluate (0 => all available)
        max_samples: 20000 # max time samples for null-model computation (0 => all)
        seed: 12345 # random seed for reproducibility
      mask_radius_arcsec: 0.0 # radius of region around the map center to mask during cleaning (only used if >0)
      grouping: [array] # clean grouping (array, nw, all)
      tau: 0.0 # tolerance for detector correlations (fraction of mean correlation for current group)
      n_eig_to_cut: # number of eigenvalues to remove (ignored if stddev_limit >0)
        a1100: [3]
        a1400: [3]
        a2000: [3]
    weighting: # how to weight data and maps
      type: full # type of TOD weighting (full=use scan variance/approximate=use det sensitivity/const=1)
      median_map_weight_factor: 0 # set all weights above this factor x median of unflagged detectors to median (>=1 allowed)
      lower_map_weight_factor: 0.0 # flag detectors below this weight limit (ignored if 0)
      upper_map_weight_factor: 0.0 # flag detectors above this weight limit (ignored if 0)
      corr_penalty: # optional per-network, per-scan multiplicative penalty based on residual correlation/systematics metrics
        enabled: false
        min_good_frac: 0.7 # minimum unflagged sample fraction for detector participation in metrics
        min_overlap: 200 # minimum overlapping good samples for pairwise detector-detector corr estimates
        max_samples: 20000 # cap sampled time points per scan for metrics (0 => use all)
        max_pairs: 4000 # cap sampled detector pairs for pairwise corr metric (0 => all pairs)
        seed: 12345 # seed for reproducible pair subsampling
        floor: 0.05 # minimum multiplicative penalty factor applied to a network
        exponent: 2.0 # shape parameter for converting severity->[floor,1] penalty factor
        pair_corr: # sampled detector-detector median |corr| term
          enabled: true
          ref: 0.05 # no penalty contribution below this metric value
          span: 0.15 # metric rise from ref to ref+span maps contribution from 0 to 1
          weight: 1.0 # relative term weight in total severity
        cm_el_corr: # |corr(common_mode, TelElAct)| term
          enabled: false
          ref: 0.05
          span: 0.25
          weight: 0.5
        cm_low_mid_ratio: # common-mode low/mid bandpower ratio term
          enabled: false
          ref: 0.6
          span: 2.0
          weight: 0.5
          low_band_Hz: [0.05, 0.5]
          mid_band_Hz: [0.5, 2.0]
    flagging: # controls flagging after cleaning
      lower_tod_inv_var_factor: 0.0 # flag detectors below this inv variance limit (ignored if 0)
      upper_tod_inv_var_factor: 0.0 # flag detectors above this inv variance limit (ignored if 0)
    output:
      enabled: false # enable or disable ptc TOD output
      indices: all # chunk indices to write: "all" or [1,3,7] (1-based)
  fruit_loops: # algorithm to use input maps to subtract out source before cleaning and re-add afterwards
    enabled: false # enable or disable fruit loops algorithm (this overrides beammap source fitting if in beammap mode)
    path: null # path for maps.  If null use maps that were generated in previous iter.  If path, use maps in that redu dir.
    type: obsnum/raw # how to apply maps.  options are 'obsnum/raw' and 'obsnum/filtered' (looks for obsnum dir) or 'coadd/raw' or 'coadd/filtered' (same map for all obsnums)
    sig2noise_limit: 0 # limit on signal-to-noise of pixels to include (ignored if noise maps are disabled or none are found in path)
    array_flux_limit: [0,0,0] # limit on signal flux density of pixels to include for each array (in map units)
    mode: upper # how to decide on pixel to include with upper: pix >= limit, lower: pix <= limit, and both: abs(pix) >= abs(limit)
    max_iters: 1 # total number of iterations to run for if no convergence is reached
    save_all_iters: false # save all iterations or only the last one to save disk space (overwrites output files for each iter if true)
post_processing:
  source_fitting: # parameters for source fitting
    bounding_box_arcsec: 10 # size of box in arcseconds around initial position
    fitting_radius_arcsec: 0 # radius from center map to search for source in (ignored if zero or if source finding)
    model: gaussian # model type (ignored for now)
    gauss_model: # optional fitting limits for guassian model (ignored if zero)
      amp_limit_factors: [0.0, 0.0] # upper and lower multiplicative factors for amplitude fitting
      fwhm_limit_factors: [0.0, 0.0] # upper and lower multiplicative factors for fwhm fitting
      fit_rotation_angle: false # fit the elliptical Gaussian rotation angle (note fwhms will not align with axes if enabled).
  map_filtering: # map filtering (if coadd enabled, filters coadded map, if disabled, filters obs maps)
    enabled: false # enable or disable map filtering
    type: wiener_filter # type of map filter (wiener filter or convolve)
    normalize_errors: false # correct weight map errors based on noise map rms
  map_histogram_n_bins: 20 # number of histogram bins (>0)
  source_finding: # parameters to control source finding
    enabled: false # enable or disable source finding
    source_sigma: 0.0 # minimum sigma for source
    source_window_arcsec: 0 # window around each source to mask
    mode: default # defines how to search for sources (default=signal map, negative=-signal map, both)
wiener_filter: # controls for wiener filter
  template_type: kernel # template (kernel, gaussian, airy, highpass)
  template_fwhm_arcsec: # set fwhms for gaussian or airy template
    a1100: 5.0
    a1400: 6.3
    a2000: 9.5
  lowpass_only: false # apply lowpassing only
  denom_rel_tol: 1.0e-4 # relative update threshold for denominator convergence
  tail_frac_tol: 5.0e-2 # remaining |Z| fraction threshold for denominator convergence
inputs: # list of inputs and related data
  - cal_items:
      - beammap_source: # extra information used by beammapping (not needed if redu_type!=beammap)
          fluxes:
            - array_name: a1100
              uncertainty_mJy: 0.0 # 1.1 mm flux uncertainty in mJy
              value_mJy: 0.0 # 1.1 mm flux in mJy
            - array_name: a1400
              uncertainty_mJy: 0.0 # 1.4 mm flux uncertainty in mJy
              value_mJy: 0.0 # 1.4 mm flux in mJy
            - array_name: a2000
              uncertainty_mJy: 0.0 # 2.0 mm flux uncertainty in mJy
              value_mJy: 0.0 # 2.0 mm flux in mJy
        type: photometry
      - pointing_offsets: # pointing offsets.  can provide 1 or 2 values in each dimension.  if 2, they are interpolated between.
          - axes_name: az
            value_arcsec: [0.0]
          - axes_name: alt
            value_arcsec: [0.0]
          - modified_julian_date: [0.0] # MJD of pointing observations in seconds for interpolation (ignored if <=0 or only 1 offset)
        type: astrometry
      - value: 1.0 # optional per-observation multiplicative correction to APT flxscale
        type: flxscale_correction
      - filepath: /path/to/data/apt.ecsv # APT table (ignored for redu_type=beammap with mapmaking grouping=det)
        meta:
          interface: apt
        type: array_prop_table
    data_items:
      - filepath: /path/to/raw/data/hwpr.nc # half-wave plate file.  Set to null or remove to ignore hwpr when polarimetry=true.
        meta:
          interface: hwpr
      - filepath: /path/to/raw/data/tel.nc # telescope file
        meta:
          interface: lmt
      - filepath: /path/to/raw/data/toltec0.nc # data file for nw0
        meta:
          interface: toltec0
      - filepath: /path/to/raw/data/toltec1.nc # data file for nw1
        meta:
          interface: toltec1
      - filepath: /path/to/raw/data/toltec2.nc # data file for nw2
        meta:
          interface: toltec2
      - filepath: /path/to/raw/data/toltec3.nc # data file for nw3
        meta:
          interface: toltec3
      - filepath: /path/to/raw/data/toltec4.nc # data file for nw4
        meta:
          interface: toltec4
      - filepath: /path/to/raw/data/toltec5.nc # data file for nw5
        meta:
          interface: toltec5
      - filepath: /path/to/raw/data/toltec6.nc # data file for nw6
        meta:
          interface: toltec6
      - filepath: /path/to/raw/data/toltec7.nc # data file for nw7
        meta:
          interface: toltec7
      - filepath: /path/to/raw/data/toltec8.nc # data file for nw8
        meta:
          interface: toltec8
      - filepath: /path/to/raw/data/toltec9.nc # data file for nw9
        meta:
          interface: toltec9
      - filepath: /path/to/raw/data/toltec10.nc # data file for nw10
        meta:
          interface: toltec10
      - filepath: /path/to/raw/data/toltec11.nc # data file for nw11
        meta:
          interface: toltec11
      - filepath: /path/to/raw/data/toltec12.nc # data file for nw12
        meta:
          interface: toltec12
    meta:
      name: 1_0_0 # for additional information from tolteca
