beammap: # beammap controls (node required, but options ignored if not beammapping)
  iter_max: 1 # maximum number of iterations for beammapping (>0)
  derotate: false # derotate beammap to zero elevation
  subtract_reference_det: true # enable subtraction of reference detector position
  reference_det: -99 # reference detector index for APT positions (if <0 and enabled, use median of nw=3; fallback nw=2,3,4)
  iter_tolerance: 0.0 # tolerance for iterations (if 0 all iterations are performed, tod output will be for last iteration)
  sens_psd_limits_Hz: [0,0] # lower and upper limits for psd in sensitivity calculation
  rfi_mask: # optional robust masking of short high-variance timestream bursts in detector-grouped beammaps
    enabled: false # enable or disable sample-level masking before mapmaking
    block_size_samples: 64 # block size for robust derivative-variance checks (>=8)
    min_good_samples: 32 # minimum unflagged finite samples per block used in stats (>=4)
    dilate_blocks: 1 # extend each detected bad block by this many neighboring blocks
    sigma_threshold: 6.0 # block MAD(diff) threshold in units of detector global MAD(diff)
    sigma_floor: 0.0 # absolute MAD(diff) floor in timestream units (ignored if 0)
    max_flagged_fraction: 0.35 # skip masking for a detector if proposed mask exceeds this fraction of its good samples
  detector_weighting:
    mode: const # detector map weights: const, ptc, or ptc_after_iter0
  performance_timing:
    enabled: false # log coarse per-iteration beammap performance timings for bottleneck studies
  fitting:
    fit_radius_fwhm: 0.0 # circular residual support radius for beammap Gaussian fits, in nominal FWHM units (ignored if <=0)
  scan_band_mask: # optional edge-band masking for coherent bad scan legs in detector-grouped beammaps
    enabled: false # identify bad top/bottom map bands and flag the corresponding TOD samples before fitting
    edge_rows: 24 # inspect up to this many rows from each map edge
    min_row_pixels: 8 # minimum positive-weight pixels required for a row to be considered
    min_contiguous_rows: 2 # require at least this many adjacent bad rows at an edge
    row_median_sigma_threshold: 4.0 # flag rows if |row median - interior median| exceeds this many interior MAD sigmas
    row_sigma_ratio_threshold: 2.5 # flag rows if row MAD exceeds this multiple of the interior-row MAD median
    max_flagged_fraction: 0.30 # skip masking for a detector if proposed sample mask exceeds this fraction of its good samples
  split_fits_by_flag: # optional split output of detector-grouped beammap FITS by detector quality flag
    enabled: false # if true, write separate FITS files for requested detector flag values
    flag_values: [0, 1] # detector flag values to include (e.g. 0=good, 1=bad)
  priors: # optional soft priors for beammap fit initialization in detector grouping
    enabled: false # enable prior-guided seed selection for map peak finding
    filepath: data/beammap_priors/beammap_slot_priors_soft_v1.ecsv # ECSV slot prior table path
    candidate_top_n: 64 # evaluate this many highest-S/N pixels per map
    min_snr: 0.0 # ignore candidate pixels below this robust map significance (median/MAD, weighted)
    max_d2: 25.0 # prior gating: require nearest-slot Mahalanobis d^2 <= max_d2 (0 disables gate)
    score_lambda: 2.0 # score = snr - score_lambda * d^2
    max_d2_iter0: 25.0 # iter-0 prior gate; lower and/or raise score_lambda_iter0 for weak sources
    max_d2_after_iter0: 16.0 # post-iter-0 prior gate after empirical alignment is available
    score_lambda_iter0: 2.0 # iter-0 prior penalty; weak sources can use a larger value
    score_lambda_after_iter0: 3.0 # post-iter-0 prior penalty after current-observation alignment
    align_after_iter0: true # align static slot priors to previous-iteration fits
    alignment_scope: array # alignment transform scope: array or common
    alignment_common_support: all # common-scope fit support: all or overlap_box
    alignment_common_support_quantile: 0.02 # per-array edge quantile trimmed before overlap_box intersection
    alignment_min_matches: 30 # minimum prior-compatible previous fits needed to solve alignment
    alignment_max_d2: 25.0 # max nearest-slot d^2 for previous fits used in alignment
    alignment_fit_rotation: true # fit small residual array rotation in the prior frame
    alignment_max_rotation_deg: 8.0 # reject fitted residual rotations larger than this
    fallback_blind: true # if no prior candidate survives, run blind fit initialization
  flagging: # these parameters control how the beammapping algorithm flags bad detectors (array order for flagging is [1.1, 1.4, 2.0])
    array_lower_fwhm_arcsec: [0,0,0] # lower limits for fitted array fwhm values (used for flagging only)
    array_upper_fwhm_arcsec: [99,99,99] # upper limits for fitted array fwhm values (ignored if <0, flagging only)
    array_lower_sig2noise: [0,0,0] # lower limits for fitted array S/N values (used for flagging only)
    array_upper_sig2noise: [0,0,0] # upper limits for fitted array S/N values (ignored if <0, flagging only)
    array_max_dist_arcsec: [0,0,0] # max allowed distance from mean of all positions for each array (ignored if <0, flagging only)
    array_network_robust_z: [0,0,0] # post-derotation per-network robust radial-z limit in final x_t/y_t (ignored if <=0, flagging only)
    max_prior_d2: 0.0 # max allowed nearest-slot prior-space Mahalanobis d^2 for final position (ignored if <=0 or priors unavailable)
    sens_factors: [0,0] # per network lower and upper multiplicative factors on median sensitivty (ignored if 0, flagging only)
coadd: # coaddition controls
  enabled: false # enable or disable coaddition
noise_maps: # noise map controls (coadded noise maps if coadd enabled, obs noise maps if disabled)
  enabled: false # enable or disable noise maps
  n_noise_maps: 1 # number of noise maps (>0).
  randomize_dets: true # randomize jackknifed noise maps on time chunks and detectors if true. only on time chunks if false.
  write_realizations: false # write full jackknifed noise realization FITS HDUs (noise products are still computed when disabled)
  products:
    enabled: true # compute empirical noise variance, weight calibration, and S/N products from jackknife maps
    apply_empirical_weights: true # scale output weight maps by median(weight_formal * jackknife_variance)^-1
source: # optional source-context metadata used to interpret map diagnostics
  map_regime: unknown # one of: source_dominant, source_faint, blank_field, unknown
interface_sync_offset: # manual timing offsets for each nw/hwpr (in seconds)
  - toltec0: 0
  - toltec1: 0
  - toltec2: 0
  - toltec3: 0
  - toltec4: 0
  - toltec5: 0
  - toltec6: 0
  - toltec7: 0
  - toltec8: 0
  - toltec9: 0
  - toltec10: 0
  - toltec11: 0
  - toltec12: 0
  - hwpr: 0
kids: # kids fitting parameters
  fitter:
    modelspec: gainlintrend
    weight_window:
      fwhm_Hz: 1.5e4
      type: lorentz
  solver:
    fitreportdir: /path/to/fit/report/directory/ # directory to grab fit report from
    parallel_policy: seq # parallel policy for kids solver (independent of citlali parallel_policy)
    extra_output: false
mapmaking: # mapmaking parameters
  enabled: true # enable or disable mapmaking (useful when TOD processing only)
  crpix1: 0 # ref pixel 1 (ignored if 0)
  crpix2: 0 # ref pixel 2 (ignored if 0)
  crval1_J2000: 0 # ref value 1 (ignored if 0)
  crval2_J2000: 0 # ref value 2 (ignored if 0)
  tan_ra: 0 # tangent plane ra (ignored for now)
  tan_dec: 0 # tangent plane dec (ignored for now)
  cunit: mJy/beam # units (mJy/beam, MJy/sr, uK, Jy/pixel. uK is Rayleigh-Jeans brightness temperature; apt table flux conversion default is mJy/beam)
  grouping: auto # mapmaking grouping (auto, detector, nw, array, fg)
  method: naive # mapmaking algorithm (naive, jinc, maximum_likelihood)
  pixel_axes: radec # reference frame (radec or altaz)
  pixel_size_arcsec: 1.0 # pixel size in arceconds (used for all obs and coadded maps)
  x_size_pix: 0 # manually specify number of map columns (forced to be odd)
  y_size_pix: 0 # manually specify number of map rows (forced to be odd)
  coverage_cut: 0.0 # coverage cut value for psd, hist, and coverage_bool maps
  jinc_filter: # parameters to control jinc filter shape (map_method = jinc required)
    r_max: 3.0 # max radius to apply filter to (max radius = r_max x lambda/diameter)
    subpixel_n: 1 # sub-pixel kernel sampling (1 = off, 2-8 typical)
    shape_params: # a, b (beam-size/3), c
      a1100: [1.1, 1.67, 2.0] # default: [1.1, 1.67, 2.0]
      a1400: [1.1, 2.17, 2.0] # default: [1.1, 2.17, 2.0]
      a2000: [1.1, 3.17, 2.0] # default: [1.1, 3.17, 2.0]
  maximum_likelihood: # controls for built in maximum-likelihood mapmaker (under development)
    max_iterations: 50 # maximum number of iterations to run conjugate gradient for
    tolerance: 1e-20 # tolerance
runtime: # parameters to control how citlali runs
  verbose: true # extra debug output in terminal (same as -l debug).  adds summary files to obsnum/logs/ directory.
  interp_over_gaps: true # required true; find and interpolate over gaps in the timestreams
  meta:
    version: tolteca... # extra info from tolteca
  n_threads: 1 # number of threads to use
  output_dir: /path/to/redu/directory/ # path to output directory
  parallel_policy: seq # parallelization policy (seq=sequential, omp=OpenMP parallelization)
  reduction_type: science # reduction engine (science, pointing, beammap)
  use_subdir: true # create "redu00, redu01,..." sub-directories.  increments automatically.
timestream: # timestream reduction parameters
  type: xs # type of TOD (xs, rs, is, qs)
  enabled: true # enable or disable TOD processing (to be implemented)
  precompute_pointing: false # compute detector pointing once (ignored for now)
  chunking: # how to chunk timestreams
    force_chunking: false # ignore map pattern chunking and use config file chunk length
    value: 10.0 # either chunk length or number of chunks for lissajous/rastajous maps (ignored if raster map)
    chunk_mode: duration # how to subdivide chunks, either by time (duration) or number (number)
  polarimetry: # polarized reduction
    enabled: false # enable or disable polarized reduction
    ignore_hwpr: auto # override automatic hwpr finding (true, false, auto)
    grouping: fg # use all matched detectors (fg) or only matched detectors with a pair (loc)
  output: # controls options for writing out TOD as netCDF file
    subdir_name: null # optional subdirectory name for tod output files (ignored if null)
    stats: # controls for what variables to include in stats file
      eigenvalues: false # include first 64 eigenvalues in stats file
  raw_time_chunk:
    despike: # remove cosmic ray spikes
      enabled: false # enable or disable despiking
      min_spike_sigma: 8.0 # minimum spike sigma value (n x sigma of TOD)
      time_constant_sec: 0.015 # spike decay time
      window_size: 32 # number of samples to flag on either side of spike (ignored if TOD filtering)
      legacy:
        enabled: true # run the legacy full-scan raw/delta despiker in addition to local residual gates
      local_residual: # optional second despike pass on locally detrended detector residuals
        enabled: false # enable or disable the local-residual compact-event pass
        window_sec: 0.25 # smoothing window used to define the local baseline before thresholding
        sigma_scale: 0.75 # scale factor on min_spike_sigma for locally detrended raw excursions
        delta_sigma_scale: 0.75 # scale factor on min_spike_sigma for locally detrended delta excursions
        compact_raw_gate: # optional morphology gate for local raw candidates
          enabled: true # require locally detrended raw events to look like compact bursts rather than steps/drifts
          candidate_rel_sigma_scale: 1.0 # nominate raw candidates above this multiple of the accepted local-residual raw threshold before morphology gating
          window_sec: 0.18 # pre/post window used to measure compactness and baseline shift for raw candidates
          half_peak_frac: 0.5 # width threshold as a fraction of the candidate's peak local-raw z
          max_width_sec: 0.18 # reject raw candidates broader than this in local-residual space
          max_step_shift_z: 3.0 # reject raw candidates whose pre/post local baseline shift exceeds this z
        compact_delta_gate: # optional morphology gate for local delta candidates
          enabled: true # require locally detrended delta events to look compact rather than step-like
          window_sec: 0.12 # pre/post window used to measure local compactness and baseline shift
          half_peak_frac: 0.5 # width threshold as a fraction of the candidate's peak local-delta z
          max_width_sec: 0.10 # reject candidates broader than this in local-delta space
          max_step_shift_z: 3.0 # reject candidates whose pre/post local baseline shift exceeds this z
    downsample: # downsample the data
      enabled: false # enable or disable downsampling
      factor: 1 # downsample factor (integer only, ignored if <=0)
      downsampled_freq_Hz: 0 # specify downsample frequency (used if factor<=0, must be <= raw sampling factor)
    filter: # tod filtering
      enabled: false # enable or disable tod filtering
      a_gibbs: 50.0 # Kaiser-Bessel filter shape param
      freq_high_Hz: 16.0 # upper freq limit
      freq_low_Hz: 0.0 # lower freq limit
      n_terms: 32 # size of filter in samples
      notch: # optional notch filtering (applied after FIR)
        enabled: false # enable or disable notch filtering
        freqs_Hz: [10.5] # notch center frequencies in Hz
        delta_f_Hz: [1.0] # notch widths in Hz (per freq)
      edge_guard: # flag scan-edge samples affected by TOD filter transients
        enabled: false # enable or disable the common TOD filter edge guard
        mode: flag # flag or none; flag preserves sample alignment
        combine: sum # sum or max filter-stage guard estimates
        min_samples: 0 # minimum samples to guard at each scan edge
        extra_samples: 0 # additional samples to guard after stage estimates
        max_samples: 128 # cap guarded samples per edge; 0 disables the cap
        iir_settle_attenuation: 0.01 # target residual amplitude for IIR/notch guard estimates
        apply_fir: true # include FIR support in the guard estimate
        apply_notch: true # include configured static notch settling in the guard estimate
        apply_dynamic_notch: true # include runtime shared-line notch settling in the guard estimate
        apply_iir_highpass: true # include IIR highpass settling in the guard estimate
        apply_downsample: true # include downsample phase/bin support in the guard estimate
    IIR_filter: # optional highpass IIR filtering (applied after FIR/notch)
      enabled: false # enable or disable IIR highpass filtering
      freq_Hz: 0.1 # highpass cutoff frequency in Hz
      order: 1 # number of cascaded first-order highpass sections
      zero_phase: false # run forward-backward to remove phase delay
    kernel: # make synthetic timestreams for reduction characterization
      enabled: false # enable or disable kernel generation
      filepath: null # filepath to FITS file with kernel
      fwhm_arcsec: 0 # manually specify fwhm for gaussian/airy kernel (ignored if 0)
      image_ext_name: signal # extention name if FITS file
      type: gaussian # how to make kernel (gaussian, airy, fits)
    flux_calibration: # flux calibration
      enabled: false # enable or disable flux calibration
    extinction_correction: # extinction correction (per sample, tau for each band calculated from fit to atm models)
      enabled: false # enable or disable extinction correction
    flagging: # controls flagging before cleaning
      delta_f_min_Hz: 60.e3 # lower limit on frequency separation for flagging tones
      lower_tod_inv_var_factor: 0.0 # flag detectors below this inv variance limit (ignored if 0)
      upper_tod_inv_var_factor: 0.0 # flag detectors above this inv variance limit (ignored if 0)
      network_step_mask: # optional network-window masking of aligned step-like RTC events before PTC cleaning
        enabled: false # detect aligned step clusters within a network and flag a shared time window around the dominant step
        step_window_sec: 0.5 # pre/post window size used to score detector-level step-like jumps
        step_score_thresh: 2.5 # detector step-score threshold used to count detectors as step-active
        min_good_frac: 0.8 # minimum unflagged sample fraction for a detector to participate in step-mask metrics
        min_det_used: 32 # minimum number of participating detectors required in a network before masking can trigger
        min_step_det_frac: 0.05 # minimum fraction of participating detectors that must be step-active to trigger masking
        min_alignment_frac: 0.5 # minimum fraction of step-active detectors that must align in time to trigger masking
        cluster_tol_sec: 0.25 # allowed timing spread around the dominant step cluster
        mask_half_width_sec: 0.5 # half-width of the flagged time window around the dominant step time
        max_flagged_fraction: 0.30 # reject the proposed mask if it would newly flag more than this fraction of good detector-samples in the network
      impulsive_capture: # optional compact capture of the strongest impulsive RTC events by network
        enabled: false # persist top per-network impulsive detectors plus short standardized snippets
        min_good_frac: 0.8 # minimum unflagged sample fraction for a detector to be eligible
        min_event_z: 6.0 # minimum max(raw_z, delta_z) score required for snippet capture
        near_event_z: 4.0 # threshold for counting near-threshold raw/delta events in per-detector summaries
        max_events_per_network: 3 # cap on captured detectors per scan/network
        snippet_pre_window_sec: 0.25 # saved pre-event snippet duration around each captured event
        snippet_post_window_sec: 0.25 # saved post-event snippet duration around each captured event
      impulsive_coincidence: # network-level summaries for short same-sample impulsive bursts
        enabled: false # detect aligned impulsive coincidences within or across networks and flag a short shared time window
        min_good_frac: 0.8 # minimum unflagged sample fraction for a detector to contribute to impulsive coincidence metrics
        event_score_thresh: 6.0 # detector impulsive-event score threshold used to count a detector as impulsive-active
        min_det_used: 32 # minimum detectors contributing to a network before impulsive coincidence fractions are considered valid
        min_impulsive_det_frac: 0.05 # minimum fraction of participating detectors that must be impulsive-active for a network-local trigger
        min_alignment_frac: 0.5 # minimum fraction of impulsive-active detectors aligned in time for a network-local trigger
        min_networks_aligned: 3 # minimum number of networks with aligned dominant impulsive times for a cross-network trigger
        high_score_override_thresh: 0.0 # high-score threshold enabling a looser cross-network trigger; <=0 disables the override
        high_score_min_networks_aligned: 0 # minimum aligned networks for the high-score override trigger; <=0 disables the override
        cluster_tol_sec: 0.03 # allowed timing spread around the dominant impulsive coincidence cluster
        mask_pre_window_sec: 0.03 # pre-event duration of the applied impulsive coincidence mask window
        mask_post_window_sec: 0.03 # post-event duration of the applied impulsive coincidence mask window
        max_flagged_fraction: 0.10 # reject the proposed mask if it would newly flag more than this fraction of good detector-samples in the network
    line_audit: # optional staged RTC narrowband line audit and shared-line actuation
      enabled: false # analyze flagged RTC chunks for shared narrow lines and detector-local periodic offenders
      line_min_hz: 1.0 # lower frequency bound of the RTC line search
      line_max_hz: 60.0 # upper frequency bound of the RTC line search
      segment_sec: 4.0 # Welch segment duration used for masked RTC PSD estimation
      min_segment_sec: 2.0 # minimum contiguous good-segment duration required to contribute to the RTC PSD
      overlap_frac: 0.5 # overlap fraction between adjacent Welch segments
      continuum_radius_bins: 8 # rolling-median half-width in PSD bins for local continuum estimation
      prominence_thresh: 8.0 # minimum detector-level PSD prominence for a narrow RTC line candidate
      cm_prominence_thresh: 6.0 # minimum common-mode PSD prominence for RTC line matching
      min_good_frac: 0.8 # minimum unflagged sample fraction for a detector to participate in RTC line auditing
      min_windows: 2 # minimum masked-Welch windows required to keep a detector or common-mode PSD
      max_peaks_per_detector: 3 # cap on narrowband peaks retained per detector for clustering
      max_det: 128 # maximum detectors per network to analyze; <=0 means use all eligible detectors
      min_det_for_network: 16 # minimum eligible detectors required before a network gets an RTC line-audit summary
      cluster_tol_hz: 0.15 # frequency tolerance used to merge nearby detector-level line peaks within one network chunk
      notch_min_detector_frac: 0.10 # detector-fraction threshold for marking a shared RTC line as notch-worthy
      notch_min_detectors: 8 # minimum detector count required when promoting a strong common-mode RTC line to notch-worthy
      notch_min_cm_prominence: 10.0 # common-mode prominence threshold for marking a shared RTC line as notch-worthy
      detector_min_prominence: 12.0 # minimum detector-level prominence for a detector-local RTC line candidate
      detector_min_line_power_frac: 0.10 # minimum detector-level line-power fraction for a detector-local RTC line candidate
      bad_detector_max_cluster_frac: 0.10 # maximum shared-cluster detector fraction allowed for a detector-local RTC line candidate
      pre_filter_enabled: true # run the audit/notch pass before the normal RTC filter chain
      post_filter_enabled: false # run a second audit pass after lowpass/filtering/downsampling on the output chunk
      post_filter_apply_shared_notches: false # apply shared-line notches during the post-filter audit pass
      post_filter_apply_detector_notches: false # apply detector-local zero-phase notches during the post-filter pass, selecting lines from the outer scan context before inner-scan cropping
      post_filter_apply_iterations: 1 # number of post-filter audit/apply passes; values >1 allow newly exposed residual line families to be notched
      post_filter_line_min_hz: 1.0 # lower frequency bound used by the post-filter audit pass; NaN inherits line_min_hz
      post_filter_line_max_hz: 25.0 # upper frequency bound used by the post-filter audit pass; NaN inherits line_max_hz
      apply_shared_notches: false # if true, cluster shared-notch recommendations across networks and apply temporary RTC notches before the normal RTC filter chain
      apply_min_support_networks: 2 # minimum number of networks supporting one shared-line family before applying a chunk-level RTC notch
      apply_min_detector_frac: 0.90 # minimum detector fraction required when promoting a single-network, strong-common-mode family to an applied RTC notch
      apply_min_common_mode_prominence: 150.0 # minimum common-mode prominence required for a single-network shared family to become an applied RTC notch
      apply_width_scale: 1.5 # multiplier applied to the measured shared-line family width before building the RTC notch
      apply_min_width_hz: 0.25 # lower clamp on the applied RTC notch bandwidth
      apply_max_width_hz: 1.50 # upper clamp on the applied RTC notch bandwidth
      apply_max_notches: 3 # maximum chunk-level RTC notches to apply per scan (0 => no cap)
      apply_cluster_tol_hz: 0.25 # frequency tolerance used when merging shared-line recommendations across networks into one applied RTC notch
      detector_notch_min_prominence: 8.0 # minimum detector-level PSD prominence for post-filter detector-local notching
      detector_notch_min_line_power_frac: 0.0 # minimum detector-level line-power fraction for post-filter detector-local notching
      detector_notch_max_notches: 3 # maximum detector-local post-filter notches per detector (0 => no cap)
      detector_notch_width_scale: 1.0 # multiplier applied to detector-local line widths before building post-filter notches
      detector_notch_min_width_hz: 0.25 # lower clamp on detector-local post-filter notch bandwidth
      detector_notch_max_width_hz: 1.50 # upper clamp on detector-local post-filter notch bandwidth
      detector_notch_context_samples: 0 # extra outer samples per side to load for detector-local post-filter notch PSD selection (does not shrink the science scan or increase flagged edge guard)
    output:
      enabled: false # enable or disable rtc TOD output
      indices: all # chunk indices to write: "all" or [1,3,7] (1-based)
      mode: full # RTC TOD output mode: full, mini, full_outer, or mini_outer (mini uses float32 signal, byte flags, no per-det pointing/kernel; *_outer includes loaded outer scan context)
      outer_context_samples: 0 # minimum samples per side to include when mode is full_outer or mini_outer
  processed_time_chunk:
    clean: # remove (hopefully) the atmospheric signal
      enabled: false # enable or disable cleaning
      standard_pca: # exactly one cleaner block should be enabled when clean.enabled=true
        enabled: true
        stddev_limit: 0.0 # standard deviation cut for cleaning (only used if >0)
        n_calc: 64 # number of eigenvalues to calculate for stddev_limit (0 => full spectrum)
        n_eig_to_cut: # number of eigenvalues to remove (ignored if stddev_limit >0)
          a1100: [3]
          a1400: [3]
          a2000: [3]
      null_model: # brute-force mode cut using null surrogates (mutually exclusive with other cleaner blocks)
        enabled: false
        n_surrogates: 16 # number of random circular-shift surrogate realizations
        quantile: 0.99 # null envelope quantile in [0.5, 1)
        min_good_frac: 0.8 # minimum unflagged sample fraction per detector
        max_modes: 64 # max modes to evaluate (0 => all available)
        max_samples: 20000 # max time samples for null-model computation (0 => all)
        seed: 12345 # random seed for reproducibility
      marchenko_pastur: # adaptive mode cut from a fitted Marchenko-Pastur bulk (mutually exclusive with other cleaner blocks)
        enabled: false
        min_good_frac: 0.8 # minimum unflagged sample fraction per detector
        max_modes: 64 # max eigenmodes to evaluate (0 => all available)
        max_samples: 20000 # max time samples for MP covariance estimation (0 => all)
        band_low_Hz: 0.0 # optional lower band edge for covariance estimation (0 => no lower edge)
        band_high_Hz: 0.0 # optional upper band edge for covariance estimation (0 => no upper edge)
        clip_z: 12.0 # clip robust-whitened detector samples before covariance (<=0 disables)
        bulk_keep_frac: 0.8 # fraction of smallest eigenvalues treated as MP bulk
        q_grid_size: 64 # number of candidate q values used in the MP bulk fit
        grouping: [] # optional subset of clean.grouping entries where MP selection is active; empty => all
      adaptive_selector: # bounded adaptive PCA cut chosen from residual metrics around the configured baseline cut
        enabled: false
        min_good_frac: 0.7 # minimum unflagged sample fraction per detector required for selector metrics
        max_det: 120 # cap detectors used for selector scoring (0 => use all eligible detectors)
        max_samples: 1024 # cap sampled time points used for selector scoring (0 => use all)
        max_pairs: 2000 # cap sampled detector pairs used for residual-correlation scoring (0 => use all)
        seed: 12345 # seed for reproducible detector-pair subsampling
        clip_z: 50.0 # clip robust-whitened detector residuals before selector scoring (<=0 disables)
        low_weight: 1.0 # weight of low/mid common-mode bandpower ratio in selector score
        tail_weight: 0.0 # weight of tail-excess term in selector score
        topmode_weight: 0.1 # weight of top residual mode fraction in selector score
        reg_weight: 0.3 # regularization weight that pulls chosen cut back toward configured baseline
        low_band_Hz: [0.05, 0.5] # low band used in the common-mode low/mid selector term
        mid_band_Hz: [0.5, 2.0] # mid band used in the common-mode low/mid selector term
        candidate_offsets: [-2, 0, 2, 4] # candidate k offsets tested around each configured baseline cut
        grouping: [] # optional subset of clean.grouping entries where adaptive selector is active; empty => all supported groups
        log_candidates: false # log per-candidate selector metrics and timings for every cleaning block
      mask_radius_arcsec: 0.0 # radius of region around the map center to mask during cleaning (only used if >0)
      grouping: [array] # clean grouping (array, nw, all)
      tau: 0.0 # tolerance for detector correlations (fraction of mean correlation for current group)
    weighting: # how to weight data and maps
      type: full # type of TOD weighting (full=use scan variance/approximate=use det sensitivity/const=1)
      median_map_weight_factor: 0 # set all weights above this factor x median of unflagged detectors to median (>=1 allowed)
      lower_map_weight_factor: 0.0 # flag detectors below this weight limit (ignored if 0)
      upper_map_weight_factor: 0.0 # flag detectors above this weight limit (ignored if 0)
      corr_penalty: # optional per-network, per-scan multiplicative penalty based on residual correlation/systematics metrics
        enabled: false
        min_good_frac: 0.7 # minimum unflagged sample fraction for detector participation in metrics
        min_overlap: 200 # minimum overlapping good samples for pairwise detector-detector corr estimates
        max_samples: 20000 # cap sampled time points per scan for metrics (0 => use all)
        max_pairs: 4000 # cap sampled detector pairs for pairwise corr metric (0 => all pairs)
        seed: 12345 # seed for reproducible pair subsampling
        floor: 0.05 # minimum multiplicative penalty factor applied to a network
        exponent: 2.0 # shape parameter for converting severity->[floor,1] penalty factor
        pair_corr: # sampled detector-detector median |corr| term
          enabled: true
          ref: 0.05 # no penalty contribution below this metric value
          span: 0.15 # metric rise from ref to ref+span maps contribution from 0 to 1
          weight: 1.0 # relative term weight in total severity
        cm_el_corr: # |corr(common_mode, TelElAct)| term
          enabled: false
          ref: 0.05
          span: 0.25
          weight: 0.5
        cm_low_mid_ratio: # common-mode low/mid bandpower ratio term
          enabled: false
          ref: 0.6
          span: 2.0
          weight: 0.5
          low_band_Hz: [0.05, 0.5]
          mid_band_Hz: [0.5, 2.0]
      busy_row_suppression: # optional hard suppression of pathological scan/network rows using second-pass residual diagnostics
        enabled: false
        require_busy_veto: true # only suppress if the second-pass diagnostic marked this network busy/diagnostic-only
        min_candidate_clusters: 5 # minimum number of candidate second-pass residual clusters required
        min_max_unflagged_residual_z: 25.0 # minimum largest surviving unflagged residual z required
        factor: 0.0 # multiplicative factor applied to positive detector weights in affected scan/network blocks
    flagging: # controls flagging after cleaning
      lower_tod_inv_var_factor: 0.0 # flag detectors below this inv variance limit (ignored if 0)
      upper_tod_inv_var_factor: 0.0 # flag detectors above this inv variance limit (ignored if 0)
      second_pass_local: # optional detector-local residual deglitch after PCA/common-mode cleaning
        enabled: false # detect compact post-PCA detector-local residual events and add conservative PTC flags
        min_spike_sigma: 8.0 # base sigma threshold used by raw-like and delta-like residual event finders
        min_good_frac: 0.5 # minimum unflagged sample fraction required for a detector to participate
        baseline_window_sec: 0.25 # smoothing window used to define the local detector baseline before residual scoring
        sigma_scale: 0.75 # scale factor applied to min_spike_sigma for raw-like residual scoring
        delta_sigma_scale: 0.75 # scale factor applied to min_spike_sigma for delta-like residual scoring
        raw_candidate_rel_sigma_scale: 1.0 # additional multiplicative factor for raw-like residual candidate admission
        raw_window_sec: 0.18 # half-window used to characterize compact raw-like residual events
        raw_half_peak_frac: 0.5 # fractional peak level used to measure raw-like residual event width
        raw_max_width_sec: 0.18 # reject raw-like residual events broader than this
        delta_window_sec: 0.12 # half-window used to characterize compact delta-like residual events
        delta_half_peak_frac: 0.5 # fractional peak level used to measure delta-like residual event width
        delta_max_width_sec: 0.10 # reject delta-like residual events broader than this
        max_step_shift_z: 3.0 # reject residual events whose pre/post baseline shift exceeds this step-like threshold
        merge_within_detector_sec: 0.08 # merge repeated hits on the same detector within this interval
        cluster_events_sec: 0.08 # cluster merged detector events within a network inside this interval
        min_cluster_detectors: 3 # auto-flag a residual cluster if at least this many detectors contribute
        high_score_cluster_override: 9.0 # auto-flag a residual cluster below min_cluster_detectors if its peak score exceeds this
        max_auto_flag_clusters_per_network: 3 # if a scan/network exceeds this many candidate clusters, keep it diagnostic-only and do not auto-flag
    output:
      enabled: false # enable or disable ptc TOD output
      indices: all # chunk indices to write: "all" or [1,3,7] (1-based)
  fruit_loops: # algorithm to use input maps to subtract out source before cleaning and re-add afterwards
    enabled: false # enable or disable fruit loops algorithm (this overrides beammap source fitting if in beammap mode)
    path: null # path for maps.  If null use maps that were generated in previous iter.  If path, use maps in that redu dir.
    type: obsnum/raw # how to apply maps.  options are 'obsnum/raw' and 'obsnum/filtered' (looks for obsnum dir) or 'coadd/raw' or 'coadd/filtered' (same map for all obsnums)
    sig2noise_limit: 0 # limit on signal-to-noise of pixels to include (ignored if noise maps are disabled or none are found in path)
    array_flux_limit: [0,0,0] # limit on signal flux density of pixels to include for each array (in map units)
    mode: upper # how to decide on pixel to include with upper: pix >= limit, lower: pix <= limit, and both: abs(pix) >= abs(limit)
    center_keep_radius_arcsec: 0.0 # exempt the central map region from coverage_cut masking when loading fruit-loops templates
    interp_mode_override: auto # auto|nearest|bilinear|jinc|trunc ; trunc reproduces legacy integer-cast map sampling
    legacy_center: false # false uses (n-1)/2 center, true uses legacy n/2 center in map->TOD projection
    recompute_weights_after_addback: false # false keeps source-subtracted weights, true recomputes weights after add-back
    max_iters: 1 # total number of iterations to run for if no convergence is reached
    save_all_iters: false # save all iterations or only the last one to save disk space (overwrites output files for each iter if true)
post_processing:
  source_fitting: # parameters for source fitting
    bounding_box_arcsec: 10 # size of box in arcseconds around initial position
    fitting_radius_arcsec: 0 # radius from center map to search for source in (ignored if zero or if source finding)
    model: gaussian # model type (ignored for now)
    gauss_model: # optional fitting limits for guassian model (ignored if zero)
      amp_limit_factors: [0.0, 0.0] # upper and lower multiplicative factors for amplitude fitting
      fwhm_limit_factors: [0.0, 0.0] # upper and lower multiplicative factors for fwhm fitting
      fit_rotation_angle: false # fit the elliptical Gaussian rotation angle (note fwhms will not align with axes if enabled).
  map_filtering: # map filtering (if coadd enabled, filters coadded map, if disabled, filters obs maps)
    enabled: false # enable or disable map filtering
    type: wiener_filter # type of map filter (wiener filter or convolve)
    normalize_errors: false # correct weight map errors based on noise map rms
    edge_guard: # runtime edge conditioning before FFT-based map filtering
      enabled: true # derive a science/support mask from weight and coverage and suppress the exterior before filtering
      weight_threshold_mode: coverage_cut # use the existing coverage-cut logic to derive the science-region weight threshold
      hits_threshold_mode: core_median_fraction # derive the coverage threshold from the median coverage within the provisional weight-defined core
      hits_core_fraction: 0.15 # require coverage >= this fraction of the provisional-core median coverage
      guard_radius_fwhm: 1.0 # support-mask dilation radius in units of the nominal beam FWHM
      fill_mode: core_median # fill exterior pixels with the science-region median signal before filtering
      taper_mode: none # none => hard support edge; cosine => taper only the guard band to zero while leaving the science mask untouched
      taper_min_fraction: 0.25 # when tapering, require guard-band weight/coverage to exceed this fraction of the science-threshold values
  map_histogram_n_bins: 20 # number of histogram bins (>0)
  source_finding: # parameters to control source finding
    enabled: false # enable or disable source finding
    source_sigma: 0.0 # minimum sigma for source
    source_window_arcsec: 0 # window around each source to mask
    mode: default # defines how to search for sources (default=signal map, negative=-signal map, both)
wiener_filter: # controls for wiener filter
  template_type: kernel # template (kernel, gaussian, airy, highpass)
  template_fwhm_arcsec: # set fwhms for gaussian or airy template
    a1100: 5.0
    a1400: 6.3
    a2000: 9.5
  lowpass_only: false # apply lowpassing only
  denom_rel_tol: 1.0e-4 # relative update threshold for denominator convergence
  tail_frac_tol: 5.0e-2 # remaining |Z| fraction threshold for denominator convergence
  max_loops: 500 # maximum denominator convergence checks before stopping early
  denom_check_iters: 0 # check convergence every N denominator iterations (0=auto)
  max_denom_iters: 0 # deprecated advisory cap; denominator continues to the tail-fraction cap when needed for stability (0=all)
inputs: # list of inputs and related data
  - cal_items:
      - beammap_source: # extra information used by beammapping (not needed if redu_type!=beammap)
          fluxes:
            - array_name: a1100
              uncertainty_mJy: 0.0 # 1.1 mm flux uncertainty in mJy
              value_mJy: 0.0 # 1.1 mm flux in mJy
            - array_name: a1400
              uncertainty_mJy: 0.0 # 1.4 mm flux uncertainty in mJy
              value_mJy: 0.0 # 1.4 mm flux in mJy
            - array_name: a2000
              uncertainty_mJy: 0.0 # 2.0 mm flux uncertainty in mJy
              value_mJy: 0.0 # 2.0 mm flux in mJy
        type: photometry
      - pointing_offsets: # pointing offsets.  can provide 1 or 2 values in each dimension.  if 2, they are interpolated between.
          - axes_name: az
            value_arcsec: [0.0]
          - axes_name: alt
            value_arcsec: [0.0]
          - modified_julian_date: [0.0] # MJD of pointing observations for interpolation. Provide 2 values for 2 offsets; ignored if <=0 or only 1 offset.
        type: astrometry
      - value: 1.0 # optional per-observation multiplicative correction to APT flxscale
        type: flxscale_correction
      - filepath: /path/to/data/apt.ecsv # APT table (ignored for redu_type=beammap with mapmaking grouping=det)
        meta:
          interface: apt
        type: array_prop_table
    data_items:
      - filepath: /path/to/raw/data/hwpr.nc # half-wave plate file.  Set to null or remove to ignore hwpr when polarimetry=true.
        meta:
          interface: hwpr
      - filepath: /path/to/raw/data/tel.nc # telescope file
        meta:
          interface: lmt
      - filepath: /path/to/raw/data/toltec0.nc # data file for nw0
        meta:
          interface: toltec0
      - filepath: /path/to/raw/data/toltec1.nc # data file for nw1
        meta:
          interface: toltec1
      - filepath: /path/to/raw/data/toltec2.nc # data file for nw2
        meta:
          interface: toltec2
      - filepath: /path/to/raw/data/toltec3.nc # data file for nw3
        meta:
          interface: toltec3
      - filepath: /path/to/raw/data/toltec4.nc # data file for nw4
        meta:
          interface: toltec4
      - filepath: /path/to/raw/data/toltec5.nc # data file for nw5
        meta:
          interface: toltec5
      - filepath: /path/to/raw/data/toltec6.nc # data file for nw6
        meta:
          interface: toltec6
      - filepath: /path/to/raw/data/toltec7.nc # data file for nw7
        meta:
          interface: toltec7
      - filepath: /path/to/raw/data/toltec8.nc # data file for nw8
        meta:
          interface: toltec8
      - filepath: /path/to/raw/data/toltec9.nc # data file for nw9
        meta:
          interface: toltec9
      - filepath: /path/to/raw/data/toltec10.nc # data file for nw10
        meta:
          interface: toltec10
      - filepath: /path/to/raw/data/toltec11.nc # data file for nw11
        meta:
          interface: toltec11
      - filepath: /path/to/raw/data/toltec12.nc # data file for nw12
        meta:
          interface: toltec12
    meta:
      name: 1_0_0 # for additional information from tolteca
